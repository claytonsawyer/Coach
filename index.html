// ════════════════════════════════════════════════════════════════════
//  RUN MECHANICS — climb cadence, HR drift, Z2 discipline
//  Per-second streams come from Intervals.icu (already synced from the
//  watch). Each run is analysed once and cached on this device.
// ════════════════════════════════════════════════════════════════════
const RM_KEY = 'runmech_v1';
state.runMech = (() => { try { return JSON.parse(localStorage.getItem(RM_KEY) || '{}'); } catch (e) { return {}; } })();
state.runMechStatus = '';
let runMechLoading = false;
const runMechTried = new Set();  // never re-request a run in the same session

function analyseRunStreams(streams) {
  const get = (...names) => { for (const n of names) { const s = streams.find(x => x.type === n); if (s && s.data && s.data.length) return s.data; } return null; };
  const t = get('time'), hr = get('heartrate'), cadRaw = get('cadence'), dist = get('distance');
  const alt = get('fixed_altitude', 'altitude'), gradeS = get('grade_smooth'), velS = get('velocity_smooth');
  if (!t || !hr || t.length < 300) return null;
  const n = t.length;

  // speed (m/s)
  const v = velS || (dist ? t.map((_, i) => i ? Math.max(0, (dist[i] - dist[i - 1]) / Math.max(1, t[i] - t[i - 1])) : 0) : null);
  // grade (%) over a ~40 m window when no smoothed grade is provided
  let grade = gradeS;
  if (!grade && alt && dist) {
    grade = new Array(n).fill(0);
    let j = 0;
    for (let i = 0; i < n; i++) {
      while (j < i && dist[i] - dist[j] > 40) j++;
      const dd = dist[i] - dist[j];
      grade[i] = dd > 15 ? (alt[i] - alt[j]) / dd * 100 : (i ? grade[i - 1] : 0);
    }
  }
  // running cadence: FIT stores strides/min (~85); convert to steps/min
  let cad = cadRaw;
  if (cad) {
    const nz = cad.filter(c => c > 30).sort((a, b) => a - b);
    const med = nz.length ? nz[Math.floor(nz.length / 2)] : 0;
    if (med && med < 120) cad = cad.map(c => c * 2);
  }

  let moving = 0, over150 = 0, flatT = 0, flatC = 0, climbT = 0, climbC = 0;
  const steady = [];  // [dtCumulative, v, hr] for flat-ish moving samples
  for (let i = 1; i < n; i++) {
    const dt = Math.min(5, t[i] - t[i - 1]);
    if (dt <= 0) continue;
    const isMoving = v ? v[i] > 0.8 : true;
    if (!isMoving) continue;
    moving += dt;
    if (hr[i] > 150) over150 += dt;
    const g = grade ? grade[i] : 0;
    const c = cad ? cad[i] : 0;
    if (c > 100) {
      if (g >= 6) { climbT += dt; climbC += c * dt; }
      else if (Math.abs(g) < 2) { flatT += dt; flatC += c * dt; }
    }
    if (v && hr[i] > 80 && Math.abs(g) < 4) steady.push([moving, v[i], hr[i], dt]);
  }
  if (moving < 600) return null;

  // aerobic decoupling: efficiency (speed / HR) first half vs second half
  let decouple = null;
  if (steady.length > 200 && moving >= 25 * 60) {
    const half = moving / 2;
    const ef = part => { let sv = 0, sh = 0, st = 0; part.forEach(([, sp, h, dt]) => { sv += sp * dt; sh += h * dt; st += dt; }); return st > 300 ? (sv / st) / (sh / st) : null; };
    const a = ef(steady.filter(x => x[0] <= half)), b = ef(steady.filter(x => x[0] > half));
    if (a && b) decouple = Math.round((a - b) / a * 1000) / 10;
  }
  return {
    mins: Math.round(moving / 60),
    cadFlat: flatT >= 120 ? Math.round(flatC / flatT) : null,
    cadClimb: climbT >= 90 ? Math.round(climbC / climbT) : null,
    climbMins: Math.round(climbT / 60 * 10) / 10,
    decouple,
    over150: Math.round(over150 / moving * 100),
  };
}

async function loadRunMechanics() {
  if (runMechLoading || !state.athleteId || !state.apiKey) return;
  const runs = (state.activities || [])
    .filter(a => /run/i.test(a.type || '') && (a.moving_time || 0) >= 15 * 60)
    .sort((a, b) => (b.start_date_local || '').localeCompare(a.start_date_local || ''))
    .slice(0, 12);
  const todo = runs.filter(a => !state.runMech[a.id] && !runMechTried.has(a.id));
  todo.forEach(a => runMechTried.add(a.id));
  if (!todo.length) return;
  runMechLoading = true;
  const auth = 'Basic ' + btoa('API_KEY:' + state.apiKey);
  let done = 0;
  for (const a of todo) {
    state.runMechStatus = `Analysing runs… ${done + 1}/${todo.length}`;
    const el = document.getElementById('rm-status'); if (el) el.textContent = state.runMechStatus;
    try {
      const r = await fetch(`https://intervals.icu/api/v1/activity/${a.id}/streams.json?types=time,heartrate,cadence,distance,altitude,fixed_altitude,grade_smooth,velocity_smooth`, { headers: { Authorization: auth } });
      if (r.ok) {
        const res = analyseRunStreams(await r.json());
        state.runMech[a.id] = res ? { ...res, date: (a.start_date_local || '').slice(0, 10), name: a.name || 'Run' } : { skip: true };
      }
    } catch (e) { /* try again next load */ }
    done++;
  }
  try { localStorage.setItem(RM_KEY, JSON.stringify(state.runMech)); } catch (e) {}
  state.runMechStatus = '';
  runMechLoading = false;
  if (state.tab === 'train') render();
}


// ── 3-week back checkpoint (Dec 12) ─────────────────────────────────
const BACK_START = '2026-11-25', BACK_CHECK = '2026-12-12';
function renderBackCheckpoint() {
  const daysLeft = Math.round((new Date(BACK_CHECK + 'T12:00:00') - new Date(todayIso + 'T12:00:00')) / 86400000);
  const span = [];
  for (let d = new Date(BACK_START + 'T12:00:00'); isoLocal(d) <= todayIso; d.setDate(d.getDate() + 1)) span.push(isoLocal(d));
  const logged = span.map(d => ({ d, e: backEntryFor(d) })).filter(x => x.e && x.e.pain != null);
  const routine = logged.filter(x => x.e.routine).length;
  const mean = a => a.length ? a.reduce((s, x) => s + x.e.pain, 0) / a.length : null;
  const first = mean(logged.slice(0, 7)), last = mean(logged.slice(-7));
  const kneeLast = logged.slice(-7).some(x => x.e.reach.includes('Knee'));

  if (daysLeft > 0) {
    return `<div class="card m-card m-check">
      <div class="m-row"><div class="card-title">Checkpoint · Dec 12</div><div class="card-meta">${daysLeft} day${daysLeft === 1 ? '' : 's'}</div></div>
      <div class="g-s">On Dec 12 this card says whether the routine is working or it's time for a PT. So far: ${logged.length}/${span.length} days logged, routine on ${routine}. ${logged.length < span.length ? 'Log every day so the verdict is real.' : 'Keep it up.'}</div>
    </div>`;
  }
  let verdict;
  if (logged.length < 10) verdict = takeaway('warn', `Only ${logged.length} days logged since Nov 25 — not enough to call it. If it doesn't feel clearly better, book the PT anyway.`);
  else if (last <= 2 && !kneeLast) verdict = takeaway('good', `Working. Down to ${last.toFixed(1)}/10 from ${first.toFixed(1)}. Keep the routine; once you have a full week at 0–2, start bringing back light trap bar work.`);
  else if (last <= first - 1.5 && !kneeLast) verdict = takeaway('good', `Improving: ${first.toFixed(1)} → ${last.toFixed(1)}/10. Give it two more weeks, same plan.`);
  else verdict = takeaway('bad', `Not clearly better: ${first.toFixed(1)} → ${last.toFixed(1)}/10${kneeLast ? ', still reaching the knee' : ''}. Stretching alone isn't fixing this — book a physical therapist or sports med visit this week.`);
  return `<div class="card m-card m-check">
    <div class="m-row"><div class="card-title">3-week checkpoint</div><div class="card-meta">${logged.length} days · routine ${routine}</div></div>
    ${verdict}
  </div>`;
}

// ════════════════════════════════════════════════════════════════════
//  "TRAINING DASHBOARD" LOOK — hero cards, Your numbers, desktop page
// ════════════════════════════════════════════════════════════════════
const GOAL = { name: null, date: null };   // set e.g. { name: 'Big Sur Half', date: '2027-04-26' } to switch the hero to a race countdown

function weeklyAgg(nWeeks) {
  const weeks = lastNWeeks(nWeeks);
  const byWeek = {};
  weeks.forEach(w => byWeek[w] = { mins: 0, load: 0, n: 0, sport: {}, z: [0, 0, 0, 0, 0] });
  (state.garmin?.acts || []).forEach(a => {
    const b = byWeek[mondayOf(actDate(a))]; if (!b) return;
    const sp = sportOf(a.type), m = (a.dur || 0) / 60;
    b.mins += m; b.load += a.load || 0; b.n += 1;
    b.sport[sp] = (b.sport[sp] || 0) + m;
    (a.z || []).forEach((s, i) => b.z[i] += (s || 0) / 60);
  });
  return { weeks, byWeek };
}
const dayIdx = () => (new Date().getDay() + 6) % 7 + 1;
const todayShort = () => new Date().toLocaleDateString('en-US', { weekday: 'short' });

// ── hero: Training for ──────────────────────────────────────────────
function painFreeStreak() {
  let streak = 0;
  for (let i = 0; i < 60; i++) {
    const e = backEntryFor(daysAgoIso(i));
    if (!e || e.pain == null) { if (i === 0) continue; break; }   // today not logged yet doesn't break it
    if (e.pain <= 2 && !e.reach.includes('Knee')) streak++; else break;
  }
  return streak;
}
function progRow(label, value, pct, color, caption) {
  return `<div class="prog-row">
    <div class="prog-top"><span>${label}</span><b>${value}</b></div>
    <div class="prog-bar"><i style="width:${Math.max(2, Math.min(100, pct))}%;background:${color}"></i></div>
    <div class="prog-cap">${caption}</div></div>`;
}
function consistentWeeks() {
  // full weeks in a row (not counting this one) with 3+ Garmin sessions
  const { weeks, byWeek } = weeklyAgg(27);
  let n = 0;
  for (let i = weeks.length - 2; i >= 0; i--) { if (byWeek[weeks[i]].n >= 3) n++; else break; }
  return n;
}
function heroTrainingFor() {
  const days = GOAL.date ? Math.ceil((new Date(GOAL.date + 'T12:00:00') - new Date()) / 86400000) : null;
  const streak = painFreeStreak();
  const cov = weekCoverage();
  const minCats = [['lower', 'Lower'], ['upper', 'Upper'], ['run', 'Z2 run']];
  const minDone = minCats.filter(([c]) => cov[c]).length;
  const next = minCats.filter(([c]) => !cov[c]).map(([, l]) => l);
  const cw = consistentWeeks();
  return `
  <div class="hero">
    <div class="hero-k">${GOAL.name ? 'Training for' : 'Current focus'}</div>
    <div class="hero-h">${GOAL.name ? esc(GOAL.name) : 'Back to 100%'}</div>
    <div class="hero-sub">${GOAL.name ? (days != null ? `${days} days to race day` : 'Race date not set') : 'No race on the calendar · fix the back, build the habit'}</div>
    ${progRow('Pain-free streak', `${Math.min(streak, 7)} of 7 days · ${Math.round(Math.min(streak, 7) / 7 * 100)}%`, streak / 7 * 100, 'var(--accent)',
      streak >= 7 ? 'A full week at 0–2 — light trap bar and RDL are back on' : 'A full week at 0–2 brings back trap bar and RDL')}
    ${progRow('3-day minimum, this week', `${minDone} of 3 · ${Math.round(minDone / 3 * 100)}%`, minDone / 3 * 100, '#3B82F6',
      minDone === 3 ? 'Covered — anything else is a bonus' : `Next: ${next.join(', ')}`)}
    ${progRow('Consistent weeks in a row', `${Math.min(cw, 8)} of 8 · ${Math.round(Math.min(cw, 8) / 8 * 100)}%`, cw / 8 * 100, '#E2572B',
      cw >= 8 ? 'Two months without a crash — the boom-bust pattern is broken' : 'Weeks with 3+ sessions. Eight straight breaks the boom-bust cycle')}
  </div>`;
}

// ── hero: Training time this week ───────────────────────────────────
function heroWeek() {
  const { weeks, byWeek } = weeklyAgg(13);
  const shown = weeks.slice(1);                    // 12 weeks
  const cur = byWeek[weeks[weeks.length - 1]];
  const prev8 = weeks.slice(-9, -1).map(w => byWeek[w].mins);
  const avg8 = prev8.reduce((a, b) => a + b, 0) / (prev8.length || 1);
  const paceAvg = avg8 * dayIdx() / 7;
  const diff = cur.mins - paceAvg;
  const sportsUsed = Object.keys(SPORTS).filter(sp => shown.some(w => byWeek[w].sport[sp]));

  // chart
  const W = 620, H = 120, padB = 20;
  const max = Math.max(1, avg8, ...shown.map(w => byWeek[w].mins));
  const bw = W / shown.length;
  const y = v => H - padB - v / max * (H - padB - 10);
  let svg = '';
  shown.forEach((w, i) => {
    let acc = 0; const x = i * bw + bw * 0.14, bwid = bw * 0.72;
    sportsUsed.forEach((sp, k) => {
      const v = byWeek[w].sport[sp] || 0; if (!v) return;
      const y1 = y(acc + v), y0 = y(acc);
      svg += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bwid.toFixed(1)}" height="${Math.max(0.5, y0 - y1 - 1).toFixed(1)}" rx="2" fill="${SPORTS[sp].color}" fill-opacity=".5"/>`;
      acc += v;
    });
    const tip = `<b>Week of ${shortDate(w)}</b> · ${hm(byWeek[w].mins)} · ${sportsUsed.filter(sp => byWeek[w].sport[sp]).map(sp => `${SPORTS[sp].label} ${hm(byWeek[w].sport[sp])}`).join(' · ') || 'nothing logged'}`;
    svg += `<rect class="ch-hit" x="${(i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H - padB}" data-tip="${esc(tip)}"/>`;
    const isLast = i === shown.length - 1;
    if (isLast || (i % 3 === 0 && shown.length - 1 - i >= 2))
      svg += `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 4}" class="ch-x hero-x">${isLast ? 'Now' : shortDate(w)}</text>`;
  });
  svg += `<line x1="0" x2="${W}" y1="${y(avg8).toFixed(1)}" y2="${y(avg8).toFixed(1)}" class="ch-target"/>`;
  svg += `<text x="${W - 2}" y="${(y(avg8) - 5).toFixed(1)}" class="ch-x hero-x" text-anchor="end" style="text-anchor:end">8-wk avg</text>`;

  return `
  <div class="hero">
    <div class="hero-k">Training time · this week</div>

    <div class="hero-legend">${sportsUsed.filter(sp => cur.sport[sp]).map(sp => `<span><i style="background:${SPORTS[sp].color}"></i>${SPORTS[sp].label} ${hm(cur.sport[sp])}</span>`).join('') || '<span>Nothing logged yet this week</span>'}</div>

// ── Your numbers ────────────────────────────────────────────────────
function numTile(k, v, unit, sub) {
  return `<div class="num"><div class="num-k">${k}</div><div class="num-v">${v}${unit ? `<small>${unit}</small>` : ''}</div><div class="num-s">${sub}</div></div>`;
}
function dArrow(delta, goodWhenUp, fmt = x => Math.round(x)) {
  if (delta == null || isNaN(delta)) return '';
  if (fmt(Math.abs(delta)) === fmt(0)) return '<span>± 0</span>';
  const up = delta >= 0, good = up === goodWhenUp;
  return `<span class="${Math.abs(delta) < 1e-9 ? '' : good ? 'good' : 'bad'}">${up ? '▲' : '▼'} ${fmt(Math.abs(delta))}</span>`;
}
function yourNumbers() {
  const g = state.garmin, days = g.days;
  const avgRange = (key, from, to) => { const v = days.filter(d => d.d >= daysAgoIso(from) && d.d <= daysAgoIso(to) && d[key] != null).map(d => d[key]); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const acwr = garminAcwr(g);
  const status = !acwr ? ['—', 'var(--text-dim)'] : acwr.ratio > 1.3 ? ['Overreaching', 'var(--red)'] : acwr.ratio >= 1.0 ? ['Productive', 'var(--green)'] : acwr.ratio >= 0.8 ? ['Maintaining', 'var(--green)'] : ['Recovering', 'var(--yellow)'];
  const hrv7 = avgRange('hrv', 6, 0), hrv28 = avgRange('hrv', 34, 7);
  const sl7 = avgRange('sleepS', 6, 0), sl28 = avgRange('sleepS', 34, 7);
  const rhr7 = avgRange('rhr', 6, 0), rhr30 = avgRange('rhr', 29, 0);
  const rhrLast = lastWith(days, 'rhr')?.rhr;
  const st7 = avgRange('steps', 6, 0), st28 = avgRange('steps', 34, 7);
  const bb7 = avgRange('bbMax', 6, 0), bb28 = avgRange('bbMax', 34, 7);
  const back = backEntryFor(todayIso);
  return `
  <div class="sec-k">Your numbers</div>
  <div class="num-grid">
    <div class="num"><div class="num-k">Load status*</div><div class="num-status" style="color:${status[1]}">● ${status[0]}</div>
      <div class="num-s">${acwr ? `7-day ${acwr.acute} vs. norm ${acwr.chronic} (${acwr.ratio.toFixed(2)}×)` : 'needs 4 weeks of data'}</div></div>
    ${numTile('HRV', hrv7 ? Math.round(hrv7) : '—', 'ms', `7-day avg · ${dArrow(hrv7 && hrv28 ? hrv7 - hrv28 : null, true)} vs 4 wks`)}
    ${numTile('Sleep / night', sl7 ? fmtHm(sl7) : '—', 'h', `7-day avg · ${dArrow(sl7 && sl28 ? (sl7 - sl28) / 60 : null, true, x => Math.round(x) + 'm')} vs 4 wks`)}
    ${numTile('Resting HR', rhrLast ?? '—', 'bpm', `30-day avg ${rhr30 ? Math.round(rhr30) : '—'} · ${dArrow(rhrLast && rhr30 ? rhrLast - rhr30 : null, false)}`)}
    ${numTile('Steps / day', st7 ? Math.round(st7).toLocaleString() : '—', '', `7-day avg · ${dArrow(st7 && st28 ? st7 - st28 : null, true, x => Math.round(x).toLocaleString())} vs 4 wks`)}
    ${numTile('Back pain', back ? back.pain : '—', '/10', back ? `today · ${back.reach.length ? back.reach.join(', ') : 'no spread'}` : '<a href="#" onclick="setTab(\'back\');return false;">log today →</a>')}
  </div>
  <div class="num-foot">*Garmin training load, 7-day vs 28-day. Body Battery 7-day high ${bb7 ? Math.round(bb7) : '—'} ${dArrow(bb7 && bb28 ? bb7 - bb28 : null, true)}</div>`;
}

// ── This week vs recent weeks (by sport) ────────────────────────────
function thisWeekTable() {
  const { weeks, byWeek } = weeklyAgg(9);
  const cur = byWeek[weeks[8]], prev = weeks.slice(0, 8).map(w => byWeek[w]);
  const frac = dayIdx() / 7;
  const rows = Object.keys(SPORTS).map(sp => {
    const now = cur.sport[sp] || 0, avg = prev.reduce((s, b) => s + (b.sport[sp] || 0), 0) / 8;
    return { sp, now, avg, pace: avg * frac };
  }).filter(r => r.now || r.avg);
  const tot = { now: cur.mins, avg: prev.reduce((s, b) => s + b.mins, 0) / 8 };
  return `
  <div class="sec-k">This week vs. recent weeks</div>
  <div class="card m-card">
    <table class="wk-table">
      <thead><tr><th></th><th>This week</th><th>8-wk avg</th><th>Pace (${todayShort()})</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td><i style="background:${SPORTS[r.sp].color}"></i>${SPORTS[r.sp].label}</td><td><b>${hm(r.now)}</b></td><td>${hm(r.avg)}</td><td>${dArrow(r.now - r.pace, true, hm)}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td><b>${hm(tot.now)}</b></td><td>${hm(tot.avg)}</td><td>${dArrow(tot.now - tot.avg * frac, true, hm)}</td></tr>

}

// ════════════════════════════════════════════════════════════════════
//  v3 — synced day log, rebalanced readiness, strength log,
//  hinge ladder, function check, body weight, weekly review
// ════════════════════════════════════════════════════════════════════
const Z2_CAP = 150;            // one Zone 2 ceiling everywhere
const EASY_CAP = 140;          // "easy end of Z2" on trim days

// ── Day log: one line per prefix in the Intervals wellness comment ──
// Lines: "Back: …", "Done: …", "Lifts: …", "Check: …", "Hinge: …".
// Writes go to a pending queue first, then PUT to Intervals; reads
// prefer a pending value, else Intervals. Every device converges.
var DAY_PREFIXES = ['Back:', 'Done:', 'Lifts:', 'Check:', 'Hinge:'];
function pendKey(date, prefix) { return `pend_${date}_${prefix}`; }

function dayLine(date, prefix) {
  const p = localStorage.getItem(pendKey(date, prefix));
  if (p != null) return p === '' ? null : p;
  const w = (state.wellness || []).find(x => x.id === date);
  const line = String(w?.comments || '').split('\n').find(l => l.startsWith(prefix));
  return line || null;
}
function pendingDates() {
  const out = new Set();
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('pend_')) out.add(k.slice(5, 15)); }
  return [...out];
}
async function pushDay(date) {
  if (!state.athleteId || !state.apiKey) return false;
  const rec = (state.wellness || []).find(x => x.id === date);
  const keep = String(rec?.comments || '').split('\n').filter(l => l.trim() && !DAY_PREFIXES.some(p => l.startsWith(p)));
  const lines = DAY_PREFIXES.map(p => dayLine(date, p)).filter(Boolean);
  const comments = [...keep, ...lines].join('\n');
  try {
    const res = await fetch(`https://intervals.icu/api/v1/athlete/${state.athleteId}/wellness/${date}`, {
      method: 'PUT',
      headers: { Authorization: 'Basic ' + btoa('API_KEY:' + state.apiKey), 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: date, comments })
    });
    if (!res.ok) throw new Error(res.status);
    if (rec) rec.comments = comments; else (state.wellness = state.wellness || []).push({ id: date, comments });
    DAY_PREFIXES.forEach(p => localStorage.removeItem(pendKey(date, p)));
    return true;
  } catch (e) { return false; }
}
async function setDayLine(date, prefix, text) {
  localStorage.setItem(pendKey(date, prefix), text ? `${prefix} ${text}` : '');
  const ok = await pushDay(date);
  state.syncMsg = ok ? '' : 'Saved on this device — will sync to Intervals.icu when it can.';
  return ok;
}
async function flushPending() {
  for (const d of pendingDates()) await pushDay(d);
}
// one-time migration of earlier device-only logs into the synced day log
function migrateLocalLogs() {
  if (localStorage.getItem('migrated_v3')) return;
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && /^back_\d{4}-\d\d-\d\d$/.test(k)) {
      try { const e = JSON.parse(localStorage.getItem(k)); if (e && e.pain != null) localStorage.setItem(pendKey(k.slice(5), 'Back:'), backLine(e)); } catch (x) {}
      localStorage.removeItem(k);
    }
  }
  try {
    const log = JSON.parse(localStorage.getItem('session_log') || '[]');
    const byDate = {};
    log.forEach(x => (byDate[x.date] = byDate[x.date] || new Set()).add(x.cat));
    Object.entries(byDate).forEach(([d, cats]) => localStorage.setItem(pendKey(d, 'Done:'), 'Done: ' + [...cats].join(', ')));
    localStorage.removeItem('session_log');
  } catch (x) {}
  localStorage.setItem('migrated_v3', '1');
}

// ── live "today" (Home Screen apps can stay open past midnight) ─────
function refreshToday() {
  const now = isoLocal(new Date());
  if (now === todayIso) return;
  todayIso = now;
  state.backDraft = backEntryFor(todayIso) || { pain: null, reach: [], sts: false, routine: false };
  state.backSaved = !!backEntryFor(todayIso);
  state.liftDraft = {};
  state.pickOverride = null;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { const before = todayIso; refreshToday(); if (before !== todayIso) render(); } });

// ── Back log on the day log ─────────────────────────────────────────
function backEntryFor(date) { return parseBackLine(dayLine(date, 'Back:')); }
async function saveBack() {
  const d = state.backDraft;
  if (d.pain == null) { state.backMsg = 'Pick a pain level first.'; render(); return; }
  state.backSaved = true; state.backMsg = 'Saving…'; render();
  const ok = await setDayLine(todayIso, 'Back:', backLine(d).slice('Back: '.length));
  state.backMsg = ok ? 'Saved to Intervals.icu.' : 'Saved on this device — will sync when Intervals.icu is reachable.';
  render();
}

// ── Sessions done (synced) ──────────────────────────────────────────
function doneOn(date) { const l = dayLine(date, 'Done:'); return l ? l.slice(5).split(',').map(s => s.trim()).filter(Boolean) : []; }
function sessionLog(days = 120) {
  const out = [];
  for (let i = 0; i < days; i++) { const d = daysAgoIso(i); doneOn(d).forEach(cat => out.push({ cat, date: d })); }
  return out;
}
async function logSession(cat) {
  const cats = [...new Set([...doneOn(todayIso), cat])];
  await setDayLine(todayIso, 'Done:', cats.join(', '));
  if (cat === 'lower' || cat === 'upper') await saveLiftDraft();
  if (cat === 'lower' && hingeStage().stage >= 1) await setDayLine(todayIso, 'Hinge:', `stage ${hingeStage().stage}`);
  state.pickOverride = null;
  render();
}
async function unlogToday() {
  await setDayLine(todayIso, 'Done:', '');
  await setDayLine(todayIso, 'Hinge:', '');
  render();
}

// ── Readiness: rebalanced (two soft flags to downgrade, can upgrade) ─
function sleepNorm(days) {
  const v = days.filter(d => d.d >= daysAgoIso(14) && d.d < todayIso && d.sleepS).map(d => d.sleepS);
  return v.length >= 5 ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function garminReadiness(g) {
  const days = g.days || [];
  const last = lastWith(days, 'hrv');
  const avg7raw = avgLast(days, 'hrv', 7);
  const avg7 = avg7raw == null ? null : Math.round(avg7raw);
  const band = lastWith(days, 'hrvLow');
  const sleepLast = lastWith(days, 'sleepS');
  const sleep7 = avgLast(days, 'sleepS', 7);
  const norm = sleepNorm(days);
  const rhrLast = lastWith(days, 'rhr')?.rhr;
  const rhr30 = avgLast(days, 'rhr', 30);
  const hard = [], soft = [];
  if (last?.hrv != null && last.hrv < 40) hard.push(['rest', `HRV ${last.hrv} ms last night — under 40.`]);
  if (avg7 && band?.hrvLow && avg7 < band.hrvLow * 0.9) hard.push(['z2', `7-day HRV ${avg7} ms — more than 10% under baseline.`]);
  else if (avg7 && band?.hrvLow && avg7 < band.hrvLow) soft.push(`7-day HRV ${avg7} ms just under baseline ${band.hrvLow}–${band.hrvHigh}.`);
  if (sleepLast?.sleepS && (sleepLast.sleepS < 5 * 3600 || (norm && sleepLast.sleepS < norm - 45 * 60)))
    soft.push(`Slept ${fmtHm(sleepLast.sleepS)}${norm ? ` vs your ${fmtHm(norm)} norm` : ''}.`);
  if (rhrLast && rhr30 && rhrLast >= rhr30 + 5) soft.push(`Resting HR ${rhrLast} — ${Math.round(rhrLast - rhr30)} above normal.`);
  let level = 'go', text = 'Train as planned.';
  if (hard.length) { level = hard.some(h => h[0] === 'rest') ? 'rest' : 'z2'; text = hard[0][1] + (level === 'rest' ? ' Rest day.' : ' Zone 2 only.'); }
  else if (soft.length >= 2) { level = 'reduce'; text = 'Two recovery flags — trim volume 10–15%.'; }
  else if (soft.length === 1) text = 'One flag, not enough to change the plan — train as planned.';
  const mid = band?.hrvLow ? (band.hrvLow + band.hrvHigh) / 2 : null;
  const canPush = !hard.length && !soft.length && avg7 && mid && avg7 >= mid && sleepLast?.sleepS && (!norm || sleepLast.sleepS >= norm);
  if (canPush) text = 'HRV top half of baseline and sleep at or above norm — push day.';
  return { level, text, last, avg7, band, sleepLast, sleep7, norm, soft, hard, canPush, rhrLast, rhr30 };
}

const LEVELS = { push: -1, go: 0, reduce: 1, z2: 2, back: 3, rest: 4 };
function coachCall() {
  const reasons = [];
  let level = 'go';
  const bump = l => { if (LEVELS[l] > LEVELS[level]) level = l; };
  let r = null, acwr = null, canPush = false;
  if (garminReady()) {
    r = garminReadiness(state.garmin);
    acwr = garminAcwr(state.garmin);
    bump(r.level);
    canPush = r.canPush;
    if (r.avg7 && r.band?.hrvLow) reasons.push({ tone: r.avg7 >= r.band.hrvLow ? 'good' : 'warn', text: `HRV ${r.avg7} ms (7-day) vs baseline ${r.band.hrvLow}–${r.band.hrvHigh}.` });
    if (r.sleepLast?.sleepS) reasons.push({ tone: r.soft.some(s => s.startsWith('Slept')) ? 'warn' : 'good', text: `Slept ${fmtHm(r.sleepLast.sleepS)}${r.norm ? ` (norm ${fmtHm(r.norm)})` : ''}.` });
    if (r.rhrLast && r.rhr30 && r.rhrLast >= r.rhr30 + 5) reasons.push({ tone: 'warn', text: `Resting HR ${r.rhrLast}, ${Math.round(r.rhrLast - r.rhr30)} above normal.` });
    if (acwr) {
      if (acwr.ratio > 1.3) { bump('reduce'); canPush = false; reasons.push({ tone: 'bad', text: `Load ratio ${acwr.ratio.toFixed(2)} — over 1.3. Hold volume.` }); }
      else if (acwr.ratio > 1.15) canPush = false;
    }
  }
  if (state.feel === 'beat') { bump('z2'); canPush = false; reasons.push({ tone: 'warn', text: 'You feel beat — trust it.' }); }
  else if (state.feel === 'sore') { canPush = false; if (r && r.soft.length >= 1) bump('reduce'); reasons.push({ tone: 'neutral', text: r && r.soft.length >= 1 ? 'Sore plus a recovery flag — trim.' : 'Sore, but recovery numbers are fine — train, warm up longer.' }); }
  const back = backEntryFor(todayIso);
  if (back && back.pain != null) {
    if (back.pain >= 6 || back.reach.includes('Knee')) { bump('back'); canPush = false; reasons.push({ tone: 'bad', text: `Back ${back.pain}/10${back.reach.includes('Knee') ? ', reaching the knee' : ''} — back first.` }); }
    else if (back.pain >= 3) { canPush = false; reasons.push({ tone: 'warn', text: `Back ${back.pain}/10 — spine-friendly lower only.` }); }
    else reasons.push({ tone: 'good', text: `Back ${back.pain}/10.` });
  } else reasons.push({ tone: 'neutral', text: 'Back not logged yet today.', action: "setTab('back')" });
  if (level === 'go' && canPush) level = 'push';

  const HEAD = {
    push:   ['Push day', 'Everything lines up. Take the load jumps where suggested, or add 10 minutes to the run.', 'var(--accent)'],
    go:     ['Green light', 'Train as planned.', 'var(--green)'],
    reduce: ['Train, but trim', `Drop the last set of each lift. Runs at the easy end of Zone 2 (under ${EASY_CAP}).`, 'var(--yellow)'],
    z2:     ['Zone 2 only', `Easy aerobic work, HR under ${Z2_CAP}. No lifting intensity today.`, 'var(--orange)'],
    back:   ['Back first', 'Do the back routine, then easy Zone 2. No loaded lower body.', 'var(--orange)'],
    rest:   ['Rest day', 'Back routine and a walk. That is the whole session.', 'var(--red)'],
  };
  return { level, head: HEAD[level], reasons, back, r, acwr };
}

// ── Hinge return ladder ─────────────────────────────────────────────
const HINGE_STAGES = [
  { name: 'No loaded hinge yet', ex: null },
  { name: 'KB deadlift from blocks', ex: { name: 'KB Deadlift from Blocks', sets: 3, reps: '8', weight: '35–53 lb', rest: '90 sec', notes: 'Bell on blocks at mid-shin. Hinge, brace, 1-second pause at the bottom. Stop if pain spreads down the leg.' } },
  { name: 'Trap bar from blocks', ex: { name: 'Trap Bar Deadlift from Blocks', sets: 3, reps: '5', weight: '~50% of old working weight', rest: '2 min', notes: 'Blocks or pins at mid-shin. Smooth reps, nothing grindy.' } },
  { name: 'Trap bar from the floor', ex: { name: 'Trap Bar Deadlift', sets: 3, reps: '5', weight: 'build 5–10 lb/session', rest: '2 min', notes: 'Floor pulls. Add load only if next-day pain stays at 0–2.' } },
  { name: 'RDL back in', ex: { name: 'RDL', sets: 3, reps: '8', weight: 'light, build weekly', rest: '2 min', notes: 'Last rung. After 2 clean sessions, normal programming resumes.' } },
];
// Walk the history: unlock stage 1 after 5 days averaging ≤3 with no knee;
// move up after 2 hinge sessions with no flare; a flare (next-day pain
// up 2+ or reaching the knee) drops one stage.
function hingeStage() {
  let stage = 0, clean = 0, lastEvent = '';
  const hist = [];
  for (let i = 59; i >= 0; i--) { const d = daysAgoIso(i); hist.push({ d, e: backEntryFor(d), h: dayLine(d, 'Hinge:') }); }
  for (let i = 0; i < hist.length; i++) {
    const win = hist.slice(Math.max(0, i - 4), i + 1).filter(x => x.e);
    if (stage === 0 && win.length >= 4 && win.reduce((s, x) => s + x.e.pain, 0) / win.length <= 3 && !win.some(x => x.e.reach.includes('Knee'))) { stage = 1; clean = 0; lastEvent = `Unlocked ${shortDate(hist[i].d)}`; }
    if (hist[i].h && stage >= 1) {
      const before = hist[i].e?.pain ?? hist[i - 1]?.e?.pain;
      const after = hist[i + 1]?.e;
      const flare = after && ((before != null && after.pain >= before + 2) || after.reach.includes('Knee'));
      if (flare) { stage = Math.max(0, stage - 1); clean = 0; lastEvent = `Flared after ${shortDate(hist[i].d)} — dropped a stage`; }
      else if (after) { clean++; if (clean >= 2 && stage < 4) { stage++; clean = 0; lastEvent = `Moved up ${shortDate(hist[i + 1].d)}`; } }
    }
  }
  return { stage, clean, lastEvent, ...HINGE_STAGES[stage] };
}

// ── Strength log ────────────────────────────────────────────────────
state.liftDraft = {};
function parseLifts(line) {
  if (!line) return [];
  return line.slice(6).split(';').map(s => s.trim()).filter(Boolean).map(s => {
    const m = /^(.*) ((?:[\d.]+x\d+\/?)+)$/.exec(s);
    if (!m) return null;
    return { name: m[1], sets: m[2].split('/').filter(Boolean).map(t => { const [w, r] = t.split('x'); return { w: +w, r: +r }; }) };
  }).filter(Boolean);
}
function liftHistory(name, days = 120) {
  const out = [];
  for (let i = days - 1; i >= 0; i--) { const d = daysAgoIso(i); const l = parseLifts(dayLine(d, 'Lifts:')).find(x => x.name === name); if (l) out.push({ d, sets: l.sets }); }
  return out;
}
const e1rm = (w, r) => r > 0 ? w * (1 + r / 30) : 0;
const bestE1rm = sets => Math.max(0, ...sets.map(s => e1rm(s.w, s.r)));
const topReps = reps => Math.max(...(String(reps || '').match(/\d+/g) || [0]).map(Number));

  const acts = state.garmin.acts.filter(a => inLast(actDate(a)));
  const mins = acts.reduce((s, a) => s + (a.dur || 0) / 60, 0);
  const log = sessionLog(16).filter(x => inLast(x.date));
  const got = c => log.some(x => x.cat === c) || (c === 'run' && acts.some(a => sportOf(a.type) === 'run'));
  const minHit = ['lower', 'upper', 'run'].filter(got);
  const pains = d0 => { const v = []; for (let i = 0; i < 7; i++) { const d = isoLocal(new Date(new Date(d0 + 'T12:00:00').getTime() + i * 86400000)); const e = backEntryFor(d); if (e) v.push(e.pain); } return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

  const easyLast = (() => { const z = [0, 0, 0, 0, 0]; acts.filter(a => ['run', 'bike'].includes(sportOf(a.type))).forEach(a => (a.z || []).forEach((s, i) => z[i] += s || 0)); const t = z.reduce((a, b) => a + b, 0); return t ? Math.round((z[0] + z[1]) / t * 100) : null; })();
  const prs = [];

  names.forEach(n => { const h = liftHistory(n, 60); const lw = h.filter(x => inLast(x.d)), before = h.filter(x => x.d < lastMon); if (lw.length && before.length) { const a = Math.max(...lw.map(x => bestE1rm(x.sets))), b = Math.max(...before.map(x => bestE1rm(x.sets))); if (a > b) prs.push(`${n} e1RM ${Math.round(a)}`); } });
  let focus;
  if (minHit.length < 3) focus = `Hit the 3-day minimum — ${['lower', 'upper', 'run'].filter(c => !got(c)).map(c => CAT_LABEL[c]).join(' and ')} first, early in the week.`;
  else if (pLast != null && pPrev != null && pLast > pPrev + 0.5) focus = 'Back got worse — routine daily and keep lower body at the current hinge stage.';
  else if (easyLast != null && easyLast < 75) focus = `Only ${easyLast}% easy on runs and rides — slow down; HR under ${Z2_CAP}.`;
  else focus = 'Solid week. Progress one thing: +10 min on the Z2 run or take the load jumps.';
  return `<div class="card m-card m-review">
    <div class="m-row"><div class="card-title">Last week · ${shortDate(lastMon)}</div><div class="card-meta">${acts.length} sessions · ${hm(mins)}</div></div>
    <div class="m-review-grid">
      <div><b>${minHit.length}/3</b><span>minimum</span></div>
      <div><b>${pLast != null ? pLast.toFixed(1) : '—'}</b><span>back avg${pPrev != null && pLast != null ? ` (${pLast <= pPrev ? '▼' : '▲'} ${Math.abs(pLast - pPrev).toFixed(1)})` : ''}</span></div>
      <div><b>${easyLast != null ? easyLast + '%' : '—'}</b><span>easy (run/bike)</span></div>
    </div>
    ${prs.length ? `<div class="g-s" style="margin-bottom:8px">PRs: ${prs.map(esc).join(' · ')}</div>` : ''}
    ${takeaway('neutral', `<b>This week:</b> ${focus}`)}
  </div>`;
}

// ── Strength trends (e1RM) ──────────────────────────────────────────
function renderStrength() {
  const counts = {};

  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 6);
  if (!names.length) return `<div class="card m-card"><div class="card-title">Strength</div><div class="g-s" style="margin-top:6px">Log weight and reps on the session card (Today tab) and your estimated 1-rep-max trends show up here, with a load suggestion each session.</div></div>`;
  const rows = names.map(n => {
    const h = liftHistory(n);
    const pts = h.map(x => Math.round(bestE1rm(x.sets)));
    const now = pts[pts.length - 1], base = h.filter(x => x.d <= daysAgoIso(28)).map(x => Math.round(bestE1rm(x.sets))).pop();
    const max = Math.max(...pts), min = Math.min(...pts);

    return `<div class="str-row" data-tip="${esc(`<b>${n}</b> · ${h.map(x => `${shortDate(x.d)} ${x.sets.map(s => `${s.w}×${s.r}`).join(',')}`).slice(-3).join(' · ')}`)}">
      <div><div class="m-act-n">${esc(n)}</div><div class="g-s">${h.length} sessions · last ${shortDate(h[h.length - 1].d)}</div></div>
      <svg viewBox="0 0 80 24" class="str-spark">${sp ? `<polyline points="${sp}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>` : ''}</svg>
      <div class="str-v"><b>${now}</b><span>${base ? `${now >= base ? '▲' : '▼'} ${Math.abs(now - base)} vs 4 wk` : 'e1RM'}</span></div></div>`;
  }).join('');
  return `<div class="card m-card ch"><div class="card-title">Strength · estimated 1-rep max</div><div class="ch-read" style="margin-top:6px">Tap a lift for its last sessions.</div>${rows}</div>`;
}

// ── Run mechanics with a personal cadence target ────────────────────
function runCadenceTarget() {
  const runs = Object.values(state.runMech || {}).filter(r => r && r.cadFlat).sort((a, b) => a.date.localeCompare(b.date)).slice(-5);
  if (!runs.length) return null;
  const flat = runs.reduce((s, r) => s + r.cadFlat, 0) / runs.length;
  return Math.round(flat * 0.95);
}
function renderRunMechanics() {

    return `<div class="card m-card"><div class="card-title">Run mechanics</div>
      <div class="g-s" id="rm-status" style="margin-top:6px">${state.runMechStatus || (runMechLoading ? 'Analysing runs…' : state.ivError ? 'Needs Intervals.icu — offline right now.' : 'No runs of 15+ minutes in the last 6 months yet. Climb cadence and HR drift show up after your next run.')}</div></div>`;
  }
  const avg = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const last5 = runs.slice(-5);
  const climb = avg(last5.map(r => r.cadClimb)), flat = avg(last5.map(r => r.cadFlat));
  const drift = avg(last5.map(r => r.decouple)), over = avg(last5.map(r => r.over150));
  const target = flat ? Math.round(flat * 0.95) : null;
  const gap = climb && flat ? (flat - climb) / flat * 100 : null;
  const tone = (v, good, warn, lowerBetter = false) => v == null ? 'var(--text)' : (lowerBetter ? v <= good : v >= good) ? 'var(--green)' : (lowerBetter ? v <= warn : v >= warn) ? 'var(--yellow)' : 'var(--red)';
  const takes = [];
  if (gap != null) takes.push(gap <= 5 ? takeaway('good', `Climbing at ${Math.round(climb)} spm, within 5% of your ${Math.round(flat)} flat cadence. Mechanics hold on grades.`)
    : takeaway(gap <= 8 ? 'warn' : 'bad', `Cadence drops ${gap.toFixed(0)}% on climbs (${Math.round(flat)} → ${Math.round(climb)}). Target ${target}+ on grades: shorter, quicker steps; let pace drop, not cadence.`));
  if (drift != null) takes.push(drift < 5 ? takeaway('good', `HR drift ${drift.toFixed(1)}% — aerobic base is holding. Add 10 minutes to the next Z2 run.`)
    : takeaway(drift < 8 ? 'warn' : 'bad', `HR drift ${drift.toFixed(1)}% (target under 5%). Base is still thin — keep runs easier and steadier rather than longer.`));
  if (over != null) takes.push(over <= 15 ? takeaway('good', `${Math.round(over)}% of run time over ${Z2_CAP} bpm. Zone 2 discipline is good.`)
    : takeaway(over <= 35 ? 'warn' : 'bad', `${Math.round(over)}% of run time over ${Z2_CAP} bpm. Walk the climbs when HR passes ${Z2_CAP}.`));
  const label = r => new Date(r.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
  const cadPts = runs.map(r => ({ label: label(r), v: r.cadClimb, color: r.cadClimb == null || !r.cadFlat ? null : (r.cadFlat - r.cadClimb) / r.cadFlat <= 0.05 ? 'var(--green)' : (r.cadFlat - r.cadClimb) / r.cadFlat <= 0.08 ? 'var(--yellow)' : 'var(--red)',
    tip: `<b>${shortDate(r.date)}</b> · ${esc(r.name)} · climb ${r.cadClimb ?? '—'} spm${r.climbMins ? ` (${r.climbMins} min on 6%+)` : ''} · flat ${r.cadFlat ?? '—'} spm` }));
  const driftBars = runs.map(r => ({ label: label(r), tip: `<b>${shortDate(r.date)}</b> · ${esc(r.name)} · drift ${r.decouple == null ? '— (under 25 min)' : r.decouple + '%'} · ${r.over150}% over ${Z2_CAP} · ${r.mins} min`,
    segs: [{ v: r.decouple == null ? 0 : Math.max(0.2, Math.abs(r.decouple)), color: r.decouple == null ? 'transparent' : r.decouple < 5 ? 'var(--green)' : r.decouple < 8 ? 'var(--yellow)' : 'var(--red)' }] }));
  const lastRun = runs[runs.length - 1];

  <div class="card m-card">
    <div class="m-row"><div class="card-title">Run mechanics · last ${runs.length} runs</div><div class="card-meta" id="rm-status">${state.runMechStatus}</div></div>
    <div class="m-tiles m-tiles-3">
      <div class="m-tile"><div class="g-k">Climb cad</div><div class="m-tile-v" style="color:${tone(gap, 5, 8, true)}">${climb ? Math.round(climb) : '—'}<small>spm</small></div><div class="g-s">target ${target ?? '—'}</div></div>
      <div class="m-tile"><div class="g-k">HR drift</div><div class="m-tile-v" style="color:${tone(drift, 5, 8, true)}">${drift != null ? drift.toFixed(1) : '—'}<small>%</small></div><div class="g-s">target &lt; 5%</div></div>
      <div class="m-tile"><div class="g-k">Over ${Z2_CAP}</div><div class="m-tile-v" style="color:${tone(over, 15, 35, true)}">${over != null ? Math.round(over) : '—'}<small>%</small></div><div class="g-s">of run time</div></div>
    </div>
    ${takes.join('')}

    ${lineChart({ points: cadPts, color: 'var(--orange)', target: target, read: cadPts[cadPts.length - 1].tip, height: 110 })}
    <div class="g-row-title" style="margin-top:12px"><span>HR drift per run</span><span>dashed = 5%</span></div>
    ${barChart({ bars: driftBars, target: 5, read: driftBars[driftBars.length - 1].tip, height: 90 })}
    <div class="g-s" style="margin-top:6px">Last run ${shortDate(lastRun.date)}: ${lastRun.mins} min, flat ${lastRun.cadFlat ?? '—'} spm, climbs ${lastRun.cadClimb ?? '—'} spm. Averages use the last 5 runs. Drift needs 25+ minutes and is less reliable on hilly trails.</div>
  </div>`;

// ── Recover tab: + body weight ──────────────────────────────────────
function renderBodyWeight() {
  const days = state.garmin.days.filter(d => d.wt);
  if (!days.length) return `<div class="card m-card"><div class="card-title">Body weight</div><div class="g-s" style="margin-top:6px">No weigh-ins in Garmin Connect yet. Weigh in a few mornings a week (a Garmin scale, or add it manually in the Connect app) and the lean-bulk trend shows up here.</div></div>`;
  const lb = kg => kg * 2.20462;
  const span = Array.from({ length: 60 }, (_, i) => daysAgoIso(59 - i));
  const byD = Object.fromEntries(days.map(d => [d.d, lb(d.wt)]));
  const pts = span.map(d => ({ label: shortDate(d), v: byD[d] != null ? Math.round(byD[d] * 10) / 10 : null, tip: `<b>${shortDate(d)}</b> · ${byD[d] != null ? byD[d].toFixed(1) + ' lb' : 'no weigh-in'}` }));
  const avg = span.map((d, i) => { const w = span.slice(Math.max(0, i - 6), i + 1).map(x => byD[x]).filter(v => v != null); return w.length ? w.reduce((a, b) => a + b, 0) / w.length : null; });
  const now = avg.filter(v => v != null).pop();
  const then = avg.slice(0, 32).filter(v => v != null).pop();
  const perWk = now && then ? (now - then) / 4 : null;
  const pct = perWk && now ? perWk / now * 100 : null;
  const take = pct == null ? takeaway('neutral', 'Need a few more weeks of weigh-ins for a trend.')
    : pct > 0.6 ? takeaway('warn', `Gaining ${perWk.toFixed(1)} lb/week (${pct.toFixed(2)}%). Faster than a lean bulk — trim 200 kcal/day.`)
    : pct >= 0.2 ? takeaway('good', `Gaining ${perWk.toFixed(1)} lb/week (${pct.toFixed(2)}%). Right in the lean-bulk range (0.25–0.5%).`)
    : takeaway('warn', `${perWk >= 0 ? 'Gaining' : 'Losing'} ${Math.abs(perWk).toFixed(1)} lb/week. For a lean bulk, add ~200 kcal/day of whole food.`);
  return `<div class="card m-card">
    <div class="m-row"><div class="card-title">Body weight · 60 days</div><div class="card-meta">${now ? now.toFixed(1) + ' lb (7-day avg)' : ''}</div></div>
    ${take}
    ${lineChart({ points: pts, avg, color: 'var(--accent)', read: pts.filter(p => p.v != null).pop()?.tip || '', height: 100 })}
  </div>`;
}

// ── Back tab: + hinge ladder + weekly function check ────────────────

function lastCheck() { for (let i = 0; i < 60; i++) { const d = daysAgoIso(i); const l = dayLine(d, 'Check:'); if (l) return { d, ...parseCheck(l) }; } return null; }

}

  const runs = Object.values(state.runMech || {}).filter(r => r && r.date).sort((x, y) => x.date.localeCompare(y.date)).slice(-5);
  if (runs.length) add('Run mechanics (last 5)', runs.map(r => `${r.date.slice(5)} flat ${r.cadFlat ?? '—'}/climb ${r.cadClimb ?? '—'} spm, drift ${r.decouple ?? '—'}%, ${r.over150}% over ${Z2_CAP}`).join('; '));
  const lifts = []; for (let i = 0; i < 21; i++) { const d = daysAgoIso(i); parseLifts(dayLine(d, 'Lifts:')).forEach(l => lifts.push(`${d.slice(5)} ${l.name} ${l.sets.map(s => `${s.w}x${s.r}`).join(',')}`)); }
  if (lifts.length) lines.push('Lifts (last 3 weeks):', ...lifts.slice(0, 15).map(x => '  - ' + x));
  const { session: s } = pickSession(call, state.mins);
  add("Dashboard's pick", `${s.title} for ${state.mins} min — ${s.exercises.map(e => e.name).join(', ')}`);

  return `You are the personal coach for Clayton Sawyer. Coaching brief:

${COACHING_BRIEF}

Today is ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}. He has ${state.mins} minutes.

DASHBOARD DATA (Garmin + Intervals.icu + his logs):
${lines.join('\n')}

Pressure-test the dashboard's pick: agree or change it, with a reason. Respect the back rules and the hinge ladder stage. When data conflicts with how he feels, trust feel.

Format:
CALL — one straight sentence.
SESSION — exact exercises, sets × reps × load (use his logged lifts to set loads), or duration and HR cap.
KEY CUE — one.
BACK — one line on the back given the trend.
FUEL — one line.

Tight and direct. No fluff.`;
}
async function generateSession(btnId = 'coach-btn') {
  const prompt = buildClaudePrompt();
  try {
    await navigator.clipboard.writeText(prompt);
    document.querySelectorAll(`[id="${btnId}"]`).forEach(b => { b.textContent = 'Copied — paste it into Claude'; });
    setTimeout(() => window.open(CLAUDE_PROJECT_URL, '_blank'), 500);
    setTimeout(() => document.querySelectorAll(`[id="${btnId}"]`).forEach(b => { b.textContent = "Ask AI coach — copies today's full picture"; }), 3000);
  } catch (e) { alert('Could not copy. Check browser permissions.'); }
}

// ── render: Garmin works even when Intervals is down ────────────────
function render() {
  const app = $('#app');
  refreshToday();
  if (state.error === 'credentials') { app.innerHTML = renderSetup(); return; }
  if (!state.loaded) { app.innerHTML = '<div class="loading"><span class="spinner"></span>Loading dashboard...</div>'; return; }
  if (state.view === 'desktop') renderDesktop(); else renderPhone();
}

migrateLocalLogs();

fetchData();
</script>
</body>
