<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0B0F14">
<title>Coach — Training Intelligence</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230B0F14'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle' fill='%23E5E7EB' font-family='Inter,-apple-system' font-weight='700'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════
   TOKENS
   ════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:           #080C12;
  --surface:      #111827;
  --surface-2:    #0F1924;
  --surface-3:    #1a2535;
  --border:       #1E293B;
  --border-strong:#263548;
  --text:         #F1F5F9;
  --text-muted:   #94A3B8;
  --text-dim:     #475569;
  --primary:      #4F8EF7;
  --primary-bg:   rgba(79,142,247,0.10);
  --green:        #34D399;
  --green-bg:     rgba(34,197,94,0.10);
  --yellow:       #FBBF24;
  --yellow-bg:    rgba(251,191,36,0.10);
  --orange:       #FB923C;
  --orange-bg:    rgba(249,115,22,0.10);
  --red:          #F87171;
  --red-bg:       rgba(239,68,68,0.10);
  --purple:       #A78BFA;
  --teal:         #2DD4BF;
  /* spacing rhythm */
  --gap-card:     14px;
  --gap-section:  22px;
  --r-card:       16px;
  --r-inner:      10px;
}

/* ════════════════════════════════════════════════════════
   BASE
   ════════════════════════════════════════════════════════ */
html, body { background: var(--bg); }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 15px; line-height: 1.5;
  min-height: 100vh;
}

/* ════════════════════════════════════════════════════════
   LAYOUT — PHONE (default)
   ════════════════════════════════════════════════════════ */
body.phone-view {
  padding: max(20px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
  max-width: 480px; margin: 0 auto;
}

/* ════════════════════════════════════════════════════════
   LAYOUT — DESKTOP
   ════════════════════════════════════════════════════════ */
body.desktop-view { padding: 24px 32px 32px; max-width: 1440px; margin: 0 auto; }
body.desktop-view .desktop-grid {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px;
}
body.desktop-view .col-3  { grid-column: span 3; }
body.desktop-view .col-4  { grid-column: span 4; }
body.desktop-view .col-5  { grid-column: span 5; }
body.desktop-view .col-6  { grid-column: span 6; }
body.desktop-view .col-7  { grid-column: span 7; }
body.desktop-view .col-8  { grid-column: span 8; }
body.desktop-view .col-9  { grid-column: span 9; }
body.desktop-view .col-12 { grid-column: span 12; }
body.desktop-view .feel-card,
body.desktop-view .snapshot,
body.desktop-view .ai-summary,
body.desktop-view .session-card,
body.desktop-view .chart-card,
body.desktop-view .card,
body.desktop-view .alert,
body.desktop-view .week-planner,
body.desktop-view .activity { margin-bottom: 0; }
body.desktop-view .date { font-size: 28px; }
body.desktop-view .footer { margin-top: 32px; }
body.desktop-view .coach-button-fixed { display: none; }
@media (max-width: 900px) {
  body.desktop-view .desktop-grid { grid-template-columns: repeat(6, 1fr); }
  body.desktop-view [class*="col-"] { grid-column: span 6; }
}

/* ════════════════════════════════════════════════════════
   CARD BASE  (shared by all surface cards)
   ════════════════════════════════════════════════════════ */
.card, .snapshot, .feel-card, .session-card, .week-planner, .chart-card, .activity {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  margin-bottom: var(--gap-card);
}
.card { padding: 18px; }
.card-label {
  font-size: 10px; font-weight: 700; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px;
}
.card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.card-title { font-size: 13px; font-weight: 700; color: var(--text); }
.card-meta { font-size: 10.5px; color: var(--text-dim); font-weight: 600; }

/* ════════════════════════════════════════════════════════
   HEADER
   ════════════════════════════════════════════════════════ */
.header { margin-bottom: var(--gap-section); }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.greeting { font-size: 11px; color: var(--primary); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; margin-bottom: 1px; }
.date { font-size: 27px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; color: var(--text); }
.subdate { font-size: 11px; color: var(--text-dim); margin-top: 5px; font-weight: 500; }
.race-countdown {
  display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--orange); background: var(--orange-bg);
  padding: 4px 10px; border-radius: 100px;
  border: 1px solid rgba(249,115,22,0.25);
}

/* ════════════════════════════════════════════════════════
   VIEW TOGGLE
   ════════════════════════════════════════════════════════ */
.view-toggle { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 2px; }
.view-toggle button {
  background: transparent; border: none; color: var(--text-muted);
  font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 5px;
  cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; transition: all 0.15s;
}
.view-toggle button svg { width: 14px; height: 14px; }
.view-toggle button.active { background: rgba(79,142,247,0.15); color: var(--primary); border: 1px solid rgba(79,142,247,0.3); }

/* ════════════════════════════════════════════════════════
   SETUP
   ════════════════════════════════════════════════════════ */
.setup { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 20px; margin-bottom: 16px; max-width: 480px; }
.setup h3 { font-size: 16px; margin-bottom: 12px; font-weight: 600; }
.setup label { font-size: 12px; color: var(--text-muted); display: block; margin: 12px 0 6px; font-weight: 500; }
.setup input { width: 100%; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
.setup input:focus { outline: none; border-color: var(--primary); }
.setup button { width: 100%; margin-top: 16px; padding: 12px; background: var(--text); color: var(--bg); border: none; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
.setup-note { font-size: 11px; color: var(--text-dim); margin-top: 10px; line-height: 1.5; }

/* ════════════════════════════════════════════════════════
   SECTION LABELS  (between major blocks)
   ════════════════════════════════════════════════════════ */
.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-dim);
  margin: var(--gap-section) 0 10px;
}

/* ════════════════════════════════════════════════════════
   FEEL CHECK-IN
   ════════════════════════════════════════════════════════ */
.feel-card { padding: 14px 16px; margin-bottom: var(--gap-card); }
.feel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.feel-edit { font-size: 11px; color: var(--primary); font-weight: 600; cursor: pointer; }
.feel-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.feel-btn {
  background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: var(--r-inner); padding: 10px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  font-family: inherit; color: var(--text);
}
.feel-btn:active { transform: scale(0.96); }
.feel-btn:hover { background: var(--surface-3); border-color: var(--border-strong); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }
.feel-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); transform: none; }
.feel-btn-emoji { font-size: 22px; line-height: 1; }
.feel-btn-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-top: 4px; }
.feel-btn.active .feel-btn-label { color: var(--bg); }
.feel-selected { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.feel-selected-info { display: flex; align-items: center; gap: 10px; }
.feel-selected-emoji { font-size: 24px; }
.feel-selected-text { display: flex; flex-direction: column; }
.feel-selected-label { font-size: 13px; font-weight: 600; }
.feel-selected-sub { font-size: 11px; color: var(--text-muted); }

/* ════════════════════════════════════════════════════════
   HEALTH SNAPSHOT
   ════════════════════════════════════════════════════════ */
.snapshot { padding: 18px; margin-bottom: var(--gap-card); border-radius: 18px; }
.snapshot-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.snapshot-title { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.14em; }
.snapshot-time { font-size: 11px; color: var(--text-dim); }

.readiness-block {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 16px; margin-bottom: 16px;
  border-radius: var(--r-inner);
  border: 1px solid rgba(34,197,94,0.15);
}
/* ring SVG is self-contained — no wrapper divs needed */
.readiness-ring { display: block; flex-shrink: 0; }
.readiness-info { flex: 1; min-width: 0; }
.readiness-label { font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.readiness-status { font-size: 17px; font-weight: 800; margin: 2px 0; letter-spacing: -0.02em; }
.readiness-msg { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

.snap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.snap-metric { cursor: pointer; }
.snap-metric-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.snap-metric-label { font-size: 9.5px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
.snap-metric-help { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; background: var(--surface-2); color: var(--text-dim); font-size: 9px; font-weight: 700; }
.snap-metric-value { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.snap-metric-na { font-size: 24px; color: var(--text-dim); font-weight: 600; line-height: 1.1; }
.snap-metric-unit { font-size: 12px; color: var(--text-dim); font-weight: 500; margin-left: 2px; }
.snap-metric-trend { font-size: 10.5px; margin-top: 3px; font-weight: 600; }
.snap-metric-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.trend-up { color: var(--green); }
.trend-down { color: var(--red); }
.trend-flat { color: var(--text-dim); }
.help-drawer { display: none; grid-column: 1/-1; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-top: 4px; }
.help-drawer.open { display: block; }
.help-drawer strong { color: var(--text); font-weight: 600; }

/* ════════════════════════════════════════════════════════
   COACH'S READ
   ════════════════════════════════════════════════════════ */
.ai-summary {
  background: var(--surface);
  border: 1px solid rgba(79,142,247,0.2);
  border-radius: 18px;
  margin-bottom: var(--gap-section);
  overflow: hidden;
}
.ai-summary-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px 12px; border-bottom: 1px solid var(--border);
}
.ai-summary-header-left { display: flex; align-items: center; gap: 8px; }
.ai-summary-icon {
  width: 24px; height: 24px; background: rgba(79,142,247,0.15);
  border: 1px solid rgba(79,142,247,0.3); color: var(--primary);
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; flex-shrink: 0;
}
.ai-summary-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--primary); }

/* ── Shared gauge/ring tokens ── */
/* Both the Health Snapshot ring and Coach's Read arcs use SVG-native text
   so positioning is always pixel-perfect regardless of font rendering.    */

/* Metric row (Coach's Read) — vertical bar tiles */
.cr-gauge-row { display: flex; border-bottom: 1px solid var(--border); }
.cr-gauge-cell {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding: 14px 6px 14px; min-width: 0;
}
.cr-gauge-cell + .cr-gauge-cell { border-left: 1px solid var(--border); }
.cr-gauge-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 10px; white-space: nowrap;
}

/* The metric: number + unit on the left, vertical bar on the right */
.cr-metric { display: flex; align-items: center; gap: 10px; }
.cr-metric-readout { display: flex; flex-direction: column; align-items: flex-start; }
.cr-metric-value {
  font-size: 26px; font-weight: 800; letter-spacing: -0.04em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.cr-metric-unit { font-size: 9.5px; font-weight: 600; color: var(--text-dim); margin-top: 3px; }

/* Vertical track + fill */
.cr-bar-track {
  width: 7px; height: 46px; border-radius: 4px;
  background: var(--surface-3); position: relative; overflow: hidden;
  flex-shrink: 0;
}
.cr-bar-fill {
  position: absolute; left: 0; right: 0; bottom: 0;
  border-radius: 4px;
  height: 0;
  transition: height 0.7s cubic-bezier(0.4,0,0.2,1);
}
/* mid-point tick for the Form bar (TSB neutral marker) */
.cr-bar-tick {
  position: absolute; left: -2px; right: -2px; height: 1.5px;
  background: var(--text-dim); opacity: 0.5;
}

.cr-gauge-status {
  font-size: 10px; font-weight: 700; margin-top: 10px;
  text-align: center; white-space: nowrap;
}

/* Narrative */
.cr-narrative {
  padding: 14px 16px 12px; font-size: 13.5px; line-height: 1.65;
  color: var(--text-muted); border-bottom: 1px solid var(--border);
}
.cr-narrative strong { color: var(--text); font-weight: 600; }
.cr-narrative .highlight-good { color: var(--green); font-weight: 600; }
.cr-narrative .highlight-warn { color: var(--orange); font-weight: 600; }
.cr-narrative .highlight-bad  { color: var(--red);    font-weight: 600; }

/* Signal rows */
.cr-signals { padding: 4px 0 6px; }
.cr-signal { display: flex; align-items: flex-start; gap: 10px; padding: 8px 16px; }
.cr-signal-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.cr-signal-dot.green  { background: var(--green);  box-shadow: 0 0 6px rgba(52,211,153,0.5); }
.cr-signal-dot.yellow { background: var(--yellow); box-shadow: 0 0 6px rgba(251,191,36,0.5); }
.cr-signal-dot.orange { background: var(--orange); box-shadow: 0 0 6px rgba(251,146,60,0.5); }
.cr-signal-dot.red    { background: var(--red);    box-shadow: 0 0 6px rgba(248,113,113,0.5); }
.cr-signal-dot.blue   { background: var(--primary); }
.cr-signal-dot.gray   { background: var(--text-dim); }
.cr-signal-content { flex: 1; min-width: 0; }
.cr-signal-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
.cr-signal-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; line-height: 1.35; }
.cr-signal-value { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; padding-top: 3px; align-self: flex-start; }
.cr-spark-chip { display: flex; align-items: center; flex-shrink: 0; align-self: center; opacity: 0.75; }
.cr-spark-chip svg { display: block; }

/* compat aliases */
.ai-summary-text strong { color: var(--text); font-weight: 600; }
.ai-summary-text .highlight-good { color: var(--green); font-weight: 600; }
.ai-summary-text .highlight-warn { color: var(--orange); font-weight: 600; }
.ai-summary-text .highlight-bad  { color: var(--red);    font-weight: 600; }

/* ════════════════════════════════════════════════════════
   SESSION CARD  + Progressive Disclosure
   ════════════════════════════════════════════════════════ */
.session-card { padding: 20px; margin-bottom: var(--gap-card); border-radius: 18px; border-color: var(--border-strong); }
.session-override-banner { background: var(--primary-bg); border: 1px solid rgba(79,142,247,0.25); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; font-size: 11px; color: var(--primary); font-weight: 600; }
.session-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); display: block; margin-bottom: 8px; }
.session-pill { display: inline-block; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }
.pill-hard     { background: var(--red-bg);    color: var(--red); }
.pill-moderate { background: var(--orange-bg); color: var(--orange); }
.pill-easy     { background: var(--green-bg);  color: var(--green); }
.pill-rest     { background: rgba(148,163,184,0.12); color: var(--text-muted); }
.session-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); margin-bottom: 8px; line-height: 1.2; }
.session-detail { font-size: 13px; line-height: 1.65; color: var(--text-muted); margin-bottom: 4px; }

/* Collapsible section */
.session-section { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
.session-section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
.exercise { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
.exercise:last-child { border-bottom: none; }
.exercise-check {
  width: 22px; height: 22px; border: 1.5px solid var(--border-strong);
  border-radius: 50%; flex-shrink: 0; margin-top: 1px; cursor: pointer;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center;
}
.exercise:hover .exercise-check { border-color: var(--primary); }
.exercise-check.checked { background: var(--green); border-color: var(--green); }
.exercise-check.checked::after { content: "✓"; color: #000; font-size: 13px; font-weight: 700; }
.exercise-info { flex: 1; min-width: 0; }
.exercise-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; line-height: 1.3; }
.exercise.checked .exercise-name { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.exercise-prescription { font-size: 12.5px; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
.prescription-item { display: inline-flex; align-items: center; gap: 3px; }
.prescription-key { color: var(--text-dim); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
.prescription-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.exercise-note { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; font-style: italic; line-height: 1.45; }

/* Collapsible protocol blocks (warmup / cooldown / fueling) */
.proto-toggle {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 14px; cursor: pointer; user-select: none;
  border-radius: var(--r-inner);
  background: var(--surface-2); border: 1px solid var(--border);
  margin: 8px 0 0; transition: background 0.15s;
}
.proto-toggle:hover { background: var(--surface-3); }
.proto-toggle-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--text-dim);
  display: flex; align-items: center; gap: 6px;
}
.proto-toggle-count {
  font-size: 10px; font-weight: 700;
  background: var(--surface-3); color: var(--text-dim);
  padding: 2px 7px; border-radius: 20px;
}
.proto-toggle-chevron {
  color: var(--text-dim); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  flex-shrink: 0;
}
.proto-toggle.open .proto-toggle-chevron { transform: rotate(180deg); }
.proto-body {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.25s;
  opacity: 0;
}
.proto-body.open { max-height: 600px; opacity: 1; }
.proto-body-inner {
  padding: 10px 14px 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-top: none; border-radius: 0 0 var(--r-inner) var(--r-inner);
  font-size: 13px; color: var(--text-muted); line-height: 1.8;
}
.proto-body-inner span { display: block; }

/* ════════════════════════════════════════════════════════
   CHARTS
   ════════════════════════════════════════════════════════ */
.chart-card { padding: 14px; margin-bottom: 8px; }
.chart-svg { width: 100%; height: auto; display: block; }

/* ════════════════════════════════════════════════════════
   ACTIVITIES
   ════════════════════════════════════════════════════════ */
.activity { padding: 12px; margin-bottom: 6px; display: flex; gap: 12px; align-items: center; }
.activity-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
.activity-info { flex: 1; min-width: 0; }
.activity-name { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.activity-stats { font-size: 11.5px; color: var(--text-dim); display: flex; gap: 10px; flex-wrap: wrap; }
.activity-date { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.activity-spark { flex-shrink: 0; width: 60px; height: 24px; }

/* ════════════════════════════════════════════════════════
   COACH BUTTONS
   ════════════════════════════════════════════════════════ */
.coach-button-fixed {
  position: fixed; bottom: max(16px, env(safe-area-inset-bottom));
  left: 16px; right: 16px; max-width: 448px; margin: 0 auto;
  background: linear-gradient(135deg, var(--primary) 0%, #7C5CF6 100%);
  color: #fff; border: none; border-radius: 14px; padding: 16px;
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
  box-shadow: 0 4px 20px rgba(79,142,247,0.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; z-index: 100;
  transition: all 0.2s;
}
.coach-button-fixed:active { transform: scale(0.98); }
.coach-button-fixed.success { background: var(--green); color: #000; }
.coach-button-inline {
  background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 700;
  font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s;
}
.coach-button-inline:hover { background: var(--surface-3); color: var(--text); border-color: var(--primary); }
.coach-button-inline.success { background: var(--green-bg); color: var(--green); border-color: rgba(52,211,153,0.3); }

/* ════════════════════════════════════════════════════════
   ALERTS
   ════════════════════════════════════════════════════════ */
.alert { background: var(--orange-bg); border: 1px solid rgba(251,146,60,0.25); border-radius: var(--r-card); padding: 11px 13px; margin-bottom: var(--gap-card); font-size: 13px; color: var(--orange); font-weight: 600; }
.alert-poor { background: var(--red-bg); border-color: rgba(248,113,113,0.25); color: var(--red); }

/* ════════════════════════════════════════════════════════
   LOADING / ERROR
   ════════════════════════════════════════════════════════ */
.loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { background: var(--red-bg); border: 1px solid rgba(248,113,113,0.25); border-radius: var(--r-card); padding: 14px; font-size: 13px; color: var(--red); margin-bottom: var(--gap-card); line-height: 1.5; }

/* ════════════════════════════════════════════════════════
   INSIGHTS PANEL  (desktop trends section)
   ════════════════════════════════════════════════════════ */
.insight-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
.insight-row:last-child { border-bottom: none; }
.insight-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }
.insight-text { font-size: 13px; line-height: 1.45; }
.insight-text strong { font-weight: 600; }

/* ════════════════════════════════════════════════════════
   ZONE DONUT
   ════════════════════════════════════════════════════════ */
.zone-donut-wrap { display: flex; gap: 16px; align-items: center; }
.zone-legend { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.zone-legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.zone-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.zone-name { font-weight: 600; min-width: 22px; }
.zone-pct { color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* ════════════════════════════════════════════════════════
   WEEK PLANNER
   ════════════════════════════════════════════════════════ */
.week-planner { padding: 16px; margin-bottom: var(--gap-card); border-radius: 18px; }
.week-planner-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.week-planner-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); }
.week-planner-reset { font-size: 11px; color: var(--primary); font-weight: 600; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
.week-days { display: flex; flex-direction: column; gap: 6px; }
.week-day-row { display: flex; flex-direction: column; padding: 10px 12px; border-radius: var(--r-inner); background: var(--surface-2); border: 1px solid var(--border); transition: all 0.15s; position: relative; }
.week-day-row:hover { border-color: var(--border-strong); background: var(--surface-3); }
.week-day-row.today { border-color: rgba(79,142,247,0.35); background: rgba(79,142,247,0.06); }
.week-day-row.modified { border-color: rgba(251,146,60,0.35); background: rgba(249,115,22,0.04); }
.week-day-row.rest-day { opacity: 0.6; }
.week-day-row.has-log { border-color: rgba(52,211,153,0.25); }
.week-day-row.missed { opacity: 0.5; }
.week-day-label { font-size: 10px; font-weight: 800; color: var(--text-dim); min-width: 30px; text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
.week-day-row.today .week-day-label { color: var(--primary); }
.week-day-session { flex: 1; min-width: 0; }
.week-day-session-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.week-day-session-meta { font-size: 10.5px; color: var(--text-dim); margin-top: 1px; }
.week-day-badge { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 7px; border-radius: 4px; flex-shrink: 0; }
.badge-hard     { background: var(--red-bg);    color: var(--red); }
.badge-moderate { background: var(--orange-bg); color: var(--orange); }
.badge-easy     { background: var(--green-bg);  color: var(--green); }
.badge-rest     { background: rgba(148,163,184,0.1); color: var(--text-dim); }
.badge-custom   { background: var(--orange-bg); color: var(--orange); }
.week-day-edit { font-size: 18px; color: var(--text-dim); flex-shrink: 0; line-height: 1; }
.week-day-row.today .week-day-edit { color: var(--primary); }
.today-pill { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--primary); background: var(--primary-bg); padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
.modified-tag { font-size: 9px; font-weight: 700; color: var(--orange); opacity: 0.8; }
.week-day-main { display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer; }
.day-log-entries { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; }
.day-log-entry { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.day-log-entry-tap { cursor: pointer; padding: 3px 4px; border-radius: 6px; margin: -3px -4px; transition: background 0.15s; }
.day-log-entry-tap:hover { background: rgba(79,142,247,0.08); }
.day-log-icon { display: flex; align-items: center; color: var(--green); flex-shrink: 0; margin-top: 1px; }
.day-log-icon svg { width: 12px; height: 12px; }
.day-log-name { font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; max-width: 160px; }
.day-log-stats { font-size: 10.5px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }
.day-log-check { margin-left: auto; color: var(--green); font-size: 11px; font-weight: 700; flex-shrink: 0; padding-left: 4px; }

/* ════════════════════════════════════════════════════════
   SWAP MODAL
   ════════════════════════════════════════════════════════ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.15s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--surface); border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.2s cubic-bezier(0.34,1.3,0.64,1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 18px; }
.modal-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.01em; color: var(--text); }
.modal-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
.modal-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin: 14px 0 8px; }
.swap-option { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-inner); border: 1px solid var(--border); background: var(--surface-2); margin-bottom: 6px; cursor: pointer; transition: all 0.15s; }
.swap-option:hover { border-color: var(--border-strong); background: var(--surface-3); }
.swap-option.selected { border-color: var(--primary); background: var(--primary-bg); }
.swap-option-icon { font-size: 22px; width: 36px; text-align: center; flex-shrink: 0; }
.swap-option-info { flex: 1; min-width: 0; }
.swap-option-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
.swap-option-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.custom-input-wrap { display: flex; gap: 8px; margin-top: 8px; }
.custom-input { flex: 1; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-inner); color: var(--text); font-size: 13px; font-family: inherit; }
.custom-input:focus { outline: none; border-color: var(--primary); }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; }
.modal-btn { flex: 1; padding: 13px; border-radius: var(--r-inner); font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; border: none; }
.modal-btn-cancel { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
.modal-btn-confirm { background: var(--text); color: var(--bg); }
.modal-btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }

/* ════════════════════════════════════════════════════════
   ACTIVITY INSIGHTS MODAL
   ════════════════════════════════════════════════════════ */
.ai-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300;
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.15s;
}
.ai-modal {
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 22px 22px 0 0; width: 100%; max-width: 560px;
  max-height: 88vh; overflow-y: auto;
  animation: slideUp 0.22s cubic-bezier(0.34,1.3,0.64,1);
  padding: 0 0 env(safe-area-inset-bottom);
}
.ai-modal-header {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
  border-radius: 22px 22px 0 0;
}
.ai-modal-handle { width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
.ai-modal-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 4px; }
.ai-modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); line-height: 1.2; margin-bottom: 3px; }
.ai-modal-meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 10px; flex-wrap: wrap; }
.ai-modal-meta span { display: inline-flex; align-items: center; gap: 4px; }
.ai-modal-close { margin-left: auto; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 16px; line-height: 1; margin-top: 4px; }
.ai-modal-close:hover { background: var(--surface-3); color: var(--text); }

.ai-modal-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--border); border-bottom: 1px solid var(--border);
}
.ai-modal-stat {
  background: var(--surface); padding: 14px 16px; text-align: center;
}
.ai-modal-stat-val { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: var(--text); }
.ai-modal-stat-unit { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-left: 1px; }
.ai-modal-stat-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-top: 4px; }

.ai-modal-body { padding: 18px 20px 24px; }

.ai-insight-loading {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 32px 20px; color: var(--text-muted); font-size: 13px; text-align: center;
}
.ai-insight-loading .spinner { width: 22px; height: 22px; }

.ai-insight-block {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 12px;
}
.ai-insight-block-label {
  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text-dim); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.ai-insight-block-label span { font-size: 14px; }
.ai-insight-block-text { font-size: 13.5px; line-height: 1.65; color: var(--text-muted); }
.ai-insight-block-text strong { color: var(--text); font-weight: 600; }
.ai-insight-block-text .hi-good { color: var(--green); font-weight: 600; }
.ai-insight-block-text .hi-warn { color: var(--orange); font-weight: 600; }
.ai-insight-block-text .hi-bad  { color: var(--red); font-weight: 600; }

.ai-insight-error {
  background: var(--red-bg); border: 1px solid rgba(248,113,113,0.2);
  border-radius: 12px; padding: 16px; font-size: 13px; color: var(--red); line-height: 1.5;
}

/* Make activity rows clickable */
.activity { cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.activity:hover { background: var(--surface-3); border-color: var(--border-strong); }
.activity:active { background: var(--surface-2); }
.activity-tap-hint { font-size: 10px; color: var(--primary); font-weight: 600; margin-top: 2px; display: flex; align-items: center; gap: 3px; }

/* ════════════════════════════════════════════════════════
   PHONE MINI DATA GRID
   ════════════════════════════════════════════════════════ */
.phone-data-grid .card, .phone-data-grid .chart-card { margin-bottom: 0; padding: 12px; }
.phone-data-grid .card-label, .phone-data-grid .card-title { font-size: 10px; }
.phone-data-grid .zone-legend-row { font-size: 10px; }
.phone-data-grid .zone-dot { width: 8px; height: 8px; }
.phone-data-grid .card-meta { font-size: 9px; }

/* ════════════════════════════════════════════════════════
   FOOTER
   ════════════════════════════════════════════════════════ */
.footer { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 24px; padding-bottom: 20px; }
.footer a { color: var(--primary); opacity: 0.7; text-decoration: none; margin: 0 4px; }

/* ════════════════════════════════════════════════════════
   RECOVERY PANEL
   ════════════════════════════════════════════════════════ */
.rec-section-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--text-dim); margin: 16px 0 8px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.rec-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rec-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.rec-tile {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-inner); padding: 11px 12px; cursor: pointer;
  transition: border-color 0.15s;
}
.rec-tile:hover { border-color: var(--border-strong); }
.rec-tile-empty { opacity: 0.45; cursor: default; }
.rec-tile-empty:hover { border-color: var(--border); }
.rec-tile-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-dim); margin-bottom: 5px; display: flex; align-items: center; gap: 4px;
}
.rec-tile-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; }
.rec-tile-value { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.rec-tile-na { font-size: 18px; color: var(--text-dim); font-weight: 600; }
.rec-tile-unit { font-size: 11px; font-weight: 500; color: var(--text-dim); margin-left: 1px; }
.rec-tile-meta { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; line-height: 1.35; }
.rec-tile-sub { font-size: 10.5px; margin-top: 3px; }
.rec-tile-spark { flex-shrink: 0; opacity: 0.85; }

/* Sleep row — wider layout */
.rec-sleep-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.rec-sleep-main, .rec-sleep-spark {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-inner); padding: 11px 12px;
}

/* Score/stress bar */
.rec-bar-track {
  height: 3px; background: var(--border); border-radius: 2px;
  margin-top: 6px; overflow: hidden;
}
.rec-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }

/* Subjective alignment block */
.rec-align-block {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-inner); padding: 12px 14px; cursor: pointer;
}
.rec-align-status { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.rec-align-note { font-size: 12px; color: var(--text-dim); line-height: 1.4; }


/* ── Garmin + back log ─────────────────────────────── */
.g-card, .b-card { margin-bottom: 14px; }
.g-note { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }
.g-unlock { display: flex; gap: 8px; }
.g-unlock input { flex: 1; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--r-inner); color: var(--text); padding: 10px 12px; font: inherit; font-size: 16px; }
.g-unlock button, .b-save { background: var(--primary); color: #fff; border: 0; border-radius: var(--r-inner); padding: 10px 16px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
.b-save { width: 100%; margin-top: 12px; }
.g-read { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 10px 12px; border-left: 3px solid; background: var(--surface-2); border-radius: 6px; margin-bottom: 12px; }
.g-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.g-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.g-stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-inner); padding: 10px 12px; }
.g-k { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); }
.g-v { font-size: 22px; font-weight: 800; margin: 2px 0; }
.g-v span { font-size: 11px; color: var(--text-dim); font-weight: 600; margin-left: 3px; }
.g-s { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
.g-row-title { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.g-bar { position: relative; height: 8px; background: var(--surface-3); border-radius: 4px; margin-bottom: 6px; }
.g-bar > div { height: 100%; border-radius: 4px; }
.g-bar i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-muted); }
.g-weeks { display: flex; align-items: flex-end; gap: 4px; height: 44px; }
.g-wk { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
.g-wk > div { border-radius: 3px 3px 0 0; min-height: 2px; }
.b-hist .g-wk b { position: absolute; bottom: -6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--teal); }
.b-hist { margin-bottom: 6px; }

// ── CTL CALIBRATION ──────────────────────────────────────────────────
// Clayton's CTL from Intervals.icu runs in the single digits (the old
// "219" figure was an artifact from a different metric). These are
// sensible defaults; calibrateCtl() refines them from real data on load.
const CTL_CONFIG = { baseline: 9, peak: 11 };

// Recompute baseline (median of last 90 valid days) and peak (max of
// last 180) from the actual wellness history so the dashboard always
// reflects current reality rather than a hardcoded guess.
function calibrateCtl(history) {
  if (!history || !history.length) return;
  const ctls = history
    .map(d => getField(d, 'ctl'))
    .filter(v => v != null && v > 0);
  if (ctls.length < 10) return;
  const recent = ctls.slice(-90).sort((a, b) => a - b);
  const median = recent[Math.floor(recent.length / 2)];
  const peak = Math.max(...ctls.slice(-180));
  CTL_CONFIG.baseline = Math.round(median * 10) / 10;
  CTL_CONFIG.peak = Math.round(peak * 10) / 10;
}

const getField = (obj, ...keys) => {
  for (const k of keys) {
    if (obj && obj[k] != null && obj[k] !== '') return obj[k];
  }
  return null;
};

// CTL/ATL/rampRate fill in after overnight sync — today's wellness record
// can be missing values. Walk back to the most recent record that has a
// real value for the requested field.
function latestValid(history, key) {
  if (!history || !history.length) return null;
  const sorted = [...history].sort((a, b) => (a.id || '').localeCompare(b.id || ''));
  for (let i = sorted.length - 1; i >= 0; i--) {
    const v = getField(sorted[i], key);
    if (v != null) return v;
  }
  return null;
}

// Pull a coherent fitness snapshot. CTL/ATL come from the most recent
// record that actually HAS them — today's record may not be filled in
// yet. No magnitude filtering: Clayton's real CTL is single digits and
// every value Intervals returns is legitimate.
function fitnessSnapshot(history) {
  const empty = { ctl: null, atl: null, tsb: null, acwr: null };
  if (!history || !history.length) return empty;
  const sorted = [...history].sort((a, b) => (a.id || '').localeCompare(b.id || ''));
  for (let i = sorted.length - 1; i >= 0; i--) {
    const ctl = getField(sorted[i], 'ctl');
    const atl = getField(sorted[i], 'atl');
    if (ctl != null && atl != null) {
      return { ctl, atl, tsb: ctl - atl, acwr: ctl > 0 ? atl / ctl : null };
    }
  }
  return empty;
}

// HRV / RHR / sleep are measured overnight and may be absent on today's
// record even when CTL is present. Pull each from its latest valid day.
function wellnessSnapshot(history) {
  return {
    hrv:   latestValid(history, 'hrv') ?? latestValid(history, 'hrvWeeklyAverage'),
    rhr:   latestValid(history, 'restingHR'),
    sleep: latestValid(history, 'sleepSecs'),
    sleepScore: latestValid(history, 'sleepScore')
  };
}

// Clean a raw value series for sparklines — just drop nulls, no magnitude filter.
function cleanCtlSeries(values) {
  return values.filter(x => x != null);
}


function computeReadiness(latest, history) {
  if (!latest) return null;
  const w = wellnessSnapshot(history);
  const hrv = w.hrv;
  const rhr = w.rhr;
  const sleepSecs = w.sleep;
  const fit = fitnessSnapshot(history);
  const ctl = fit.ctl;
  const atl = fit.atl;

  if (hrv == null && sleepSecs == null) return null;

  let score = 50;
  let factors = 0;

  if (hrv != null) {
    const hist = history.slice(-14).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
    if (hist.length >= 5) {
      const avg = hist.reduce((a,b) => a+b, 0) / hist.length;
      const pct = ((hrv - avg) / avg) * 100;
      score += Math.max(-25, Math.min(25, pct * 1.25));
      factors++;
    }
  }
  if (sleepSecs != null) {
    const hrs = sleepSecs / 3600;
    score += Math.max(-15, Math.min(15, (hrs - 7) * 10));
    factors++;
  }
  if (rhr != null) {
    const hist = history.slice(-14).map(d => getField(d, 'restingHR')).filter(v => v != null);
    if (hist.length >= 5) {
      const avg = hist.reduce((a,b) => a+b, 0) / hist.length;
      const diff = rhr - avg;
      score += Math.max(-10, Math.min(10, -diff * 2));
      factors++;
    }
  }
  if (ctl != null && atl != null && ctl > 0) {
    const acwr = atl / ctl;
    if (acwr > 1.3) score -= Math.min(15, (acwr - 1.3) * 30);
    else if (acwr < 0.7) score -= 5;
    factors++;
  }

  if (factors === 0) return null;
  return Math.max(0, Math.min(100, Math.round(score)));
}

function applyFeelToReadiness(score, feel) {
  if (score == null && feel == null) return null;
  let s = score != null ? score : 50;
  if (feel === 'fresh') s = Math.min(100, s + 8);
  else if (feel === 'sore') s = Math.max(0, s - 18);
  else if (feel === 'beat') s = Math.max(0, s - 30);
  return Math.round(s);
}

//  FETCH DATA
// ════════════════════════════════════════════════════════════════════
async function fetchData() {
  if (!state.athleteId || !state.apiKey) { state.error = "credentials"; render(); return; }
  const today = new Date();
  const monthAgo = new Date(today.getTime() - 180 * 86400000);
  const fmt = d => d.toISOString().split('T')[0];
  const auth = 'Basic ' + btoa('API_KEY:' + state.apiKey);

  try {
    const wRes = await fetch(`https://intervals.icu/api/v1/athlete/${state.athleteId}/wellness?oldest=${fmt(monthAgo)}&newest=${fmt(today)}`, { headers: { Authorization: auth } });
    if (!wRes.ok) throw new Error(`Intervals API ${wRes.status} — check athlete ID and API key in settings`);
    state.wellness = await wRes.json();

    // Expose raw data on window for debugging — open console and type:
    // debugRaw() — shows latest wellness record keys and values
    // debugCtl() — shows CTL/ATL across all records
    window.debugRaw = () => {
      const sorted = [...state.wellness].sort((a,b)=>(a.id||'').localeCompare(b.id||''));
      const latest = sorted[sorted.length-1];
      console.group('Latest wellness record (' + (latest?.id||'none') + ')');
      if (latest) Object.entries(latest).forEach(([k,v]) => { if (v!=null) console.log(k,'→',v); });
      console.groupEnd();
      console.log('Total wellness records:', sorted.length, '| First:', sorted[0]?.id, '| Last:', sorted[sorted.length-1]?.id);
    };
    window.debugCtl = () => {
      const sorted = [...state.wellness].sort((a,b)=>(a.id||'').localeCompare(b.id||''));
      console.table(sorted.map(d=>({date:d.id, ctl:d.ctl, atl:d.atl, hrv:d.hrv??d.hrvWeeklyAverage, rhr:d.restingHR})).filter(d=>d.ctl||d.hrv));
    };
    window.debugSnap = () => console.log('fitnessSnapshot:', JSON.stringify(fitnessSnapshot(state.wellness)));

    console.log(`✅ Wellness loaded: ${state.wellness.length} records. Run debugRaw(), debugCtl(), or debugSnap() to inspect.`);
    calibrateCtl(state.wellness);
    console.log(`📊 CTL calibrated — baseline: ${CTL_CONFIG.baseline}, peak: ${CTL_CONFIG.peak}`);

    const aRes = await fetch(`https://intervals.icu/api/v1/athlete/${state.athleteId}/activities?oldest=${fmt(monthAgo)}&newest=${fmt(today)}`, { headers: { Authorization: auth } });
    if (aRes.ok) state.activities = await aRes.json();
    console.log(`✅ Activities loaded: ${state.activities?.length||0} records.`);

    state.loaded = true;
    state.error = null;
    render();
    setTimeout(() => loadRunMechanics(), 1500);
  } catch (e) {
    console.error('❌ fetchData error:', e.message);
    state.error = e.message;
    render();
  }
}

function getWeekStartMonday() {
  const today = new Date();
  const dow = today.getDay(); // 0=Sun
  const diff = dow === 0 ? -6 : 1 - dow; // shift to Monday
  const mon = new Date(today);
  mon.setDate(today.getDate() + diff);
  mon.setHours(0, 0, 0, 0);
  return mon;
}

function activitiesForDay(activities, targetDate) {
  const dateStr = targetDate.toISOString().split('T')[0];
  return activities.filter(a => {
    const aDate = (a.start_date_local || '').split('T')[0];
    return aDate === dateStr;
  });
}

function renderWeekPlanner(activities = []) {
  const today = new Date();
  const todayName = dayName(today);
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const hasAnySwap = Object.keys(state.weekSwaps).length > 0;
  const weekStart = getWeekStartMonday();

  const badgeClass = { hard: 'badge-hard', moderate: 'badge-moderate', easy: 'badge-easy', rest: 'badge-rest' };
  const badgeLabel = { hard: 'Hard', moderate: 'Mod', easy: 'Easy', rest: 'Off' };
  const dayAbbr = { Monday: 'MON', Tuesday: 'TUE', Wednesday: 'WED', Thursday: 'THU', Friday: 'FRI', Saturday: 'SAT', Sunday: 'SUN' };

  const rows = DAYS.map((day, idx) => {
    const isToday = day === todayName;
    const swap = state.weekSwaps[day];
    const planned = SESSIONS[day];
    const intensity = swap ? swap.intensity : planned.intensity;
    const title = swap ? `${swap.icon} ${swap.name}` : planned.title;
    const meta = swap ? `Swapped · was: ${planned.title}` : planned.duration;
    const isRest = intensity === 'rest' && !swap;

    // Find Garmin activities logged on this day
    const dayDate = new Date(weekStart);
    dayDate.setDate(weekStart.getDate() + idx);
    const logged = activitiesForDay(activities, dayDate);
    const isPast = dayDate < today && !isToday;

    const loggedHtml = logged.map(a => {
      const dist = a.distance ? `${fmtMiles(a.distance)}mi` : '';
      const dur = a.moving_time ? `${fmtMins(a.moving_time)}min` : '';
      const hrVal = a.icu_average_hr ?? a.average_heartrate ?? null;
      const hr = hrVal ? `${Math.round(hrVal)}bpm` : '';
      const stats = [dist, dur, hr].filter(Boolean).join(' · ');
      const icon = sportIcon(a.type);
      // Shorten Garmin auto-names like "San Luis Obispo County..." 
      const rawName = a.name || a.type || 'Activity';
      const shortName = rawName.length > 28 ? rawName.slice(0, 26) + '…' : rawName;
      return `
        <div class="day-log-entry day-log-entry-tap" onclick="event.stopPropagation(); openActivityInsights('${a.id}')">
          <span class="day-log-icon">${icon}</span>
          <span class="day-log-name">${shortName}</span>
          ${stats ? `<span class="day-log-stats">${stats}</span>` : ''}
          <span class="day-log-check">✓ <span style="color:var(--primary);font-size:9px;font-weight:700;">INSIGHTS</span></span>
        </div>
      `;
    }).join('');

    const hasLog = logged.length > 0;
    const doneClass = hasLog ? 'has-log' : (isPast && !isToday && intensity !== 'rest' ? 'missed' : '');

    return `
      <div class="week-day-row ${isToday ? 'today' : ''} ${swap ? 'modified' : ''} ${isRest ? 'rest-day' : ''} ${doneClass}">
        <div class="week-day-main" onclick="openSwapModal('${day}')">
          <div class="week-day-label">${dayAbbr[day]}</div>
          <div class="week-day-session">
            <div class="week-day-session-name">${title}</div>
            <div class="week-day-session-meta">${meta}</div>
          </div>
          ${isToday ? '<span class="today-pill">Today</span>' : ''}
          ${swap ? `<span class="week-day-badge badge-custom">Custom</span>` : `<span class="week-day-badge ${badgeClass[intensity] || 'badge-rest'}">${badgeLabel[intensity] || 'Off'}</span>`}
          <div class="week-day-edit">›</div>
        </div>
        ${hasLog ? `<div class="day-log-entries">${loggedHtml}</div>` : ''}
      </div>
    `;
  }).join('');

  return `
    <div class="week-planner">
      <div class="week-planner-header">
        <div class="week-planner-title">This Week</div>
        ${hasAnySwap ? `<button class="week-planner-reset" onclick="resetAllSwaps()">Reset all</button>` : ''}
      </div>
      <div class="week-days">${rows}</div>
    </div>
  `;
}

  const phoneIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="2" width="8" height="12" rx="1.5"/><line x1="7" y1="12" x2="9" y2="12"/></svg>';
  const desktopIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="8" rx="1"/><line x1="6" y1="14" x2="10" y2="14"/><line x1="8" y1="11" x2="8" y2="14"/></svg>';
  return `
    <div class="header">
      <div class="header-row">
        <div>
          <div class="greeting">Good morning, ${ATHLETE_NAME}</div>
          <div class="date">${fmtDate(today)}</div>
        </div>
        <div class="view-toggle">
          <button class="${state.view === 'phone' ? 'active' : ''}" onclick="setView('phone')">${phoneIcon}<span>Phone</span></button>
          <button class="${state.view === 'desktop' ? 'active' : ''}" onclick="setView('desktop')">${desktopIcon}<span>Desktop</span></button>

}

function renderPerfSubdate(latest, sorted) {
  const { ctl, atl, tsb } = fitnessSnapshot(sorted);
  const hrv = getField(latest, 'hrv', 'hrvWeeklyAverage');

  const parts = [];
  if (ctl != null) {
    const delta = Math.round((ctl - CTL_CONFIG.baseline) * 10) / 10;
    const sign = delta >= 0 ? '+' : '';
    parts.push(`Fitness ${Math.round(ctl)} (${sign}${delta} vs baseline)`);
  }
  if (tsb != null) {
    const form = tsb > 5 ? 'Fresh' : tsb > -10 ? 'Neutral' : tsb > -20 ? 'Building' : 'Fatigued';
    parts.push(`Form: ${form} (TSB ${tsb > 0 ? '+' : ''}${Math.round(tsb)})`);
  }
  if (hrv != null) {
    parts.push(`HRV ${Math.round(hrv)}ms`);
  }
  const el = document.getElementById('perf-subdate');
  if (el) el.textContent = parts.length ? parts.join(' · ') : 'Loading metrics...';
}

function getReadinessStatus(score) {
  if (score == null) return { color: 'var(--text-muted)', label: 'No data', dot: 'var(--text-muted)', msg: 'Tap how you feel or wait for Garmin sync' };
  if (score >= 80) return { color: 'var(--green)', label: 'Full send', dot: 'var(--green)', msg: "You're fresh — push it today" };
  if (score >= 60) return { color: 'var(--yellow)', label: 'Moderate', dot: 'var(--yellow)', msg: 'Execute session, back off top-end 10-15%' };
  if (score >= 40) return { color: 'var(--orange)', label: 'Low', dot: 'var(--orange)', msg: 'Swap hard session for Zone 2 or mobility' };
  return { color: 'var(--red)', label: 'Poor', dot: 'var(--red)', msg: 'Recovery day — non-negotiable' };
}

const HELP = {
  hrv:        '<strong>Heart Rate Variability</strong> — ms between heartbeats. Your range: 90–111ms. Below 85ms = intensity cap. Trending direction matters more than today\'s number.',
  rhr:        '<strong>Resting Heart Rate</strong> — bpm at full rest. Trending down = aerobic adaptation. Spike of 5+ bpm = under-recovery, illness, or high life stress.',
  sleep:      '<strong>Sleep duration</strong> — Garmin total. 7–9hrs is the performance window. Below 6hrs = drop intensity 15–20% regardless of how you feel.',
  sleepScore: '<strong>Sleep Score</strong> — Garmin\'s composite of duration, stages, restlessness, and SpO2. 70+ is solid. Below 60 = suppressed recovery.',
  sleepHR:    '<strong>Sleeping HR</strong> — avg HR during sleep. Lower is better. Elevated sleeping HR = body working hard to recover. Alcohol and heat spike it.',
  ctl:        '<strong>Fitness (CTL)</strong> — 42-day weighted average of training load (hrTSS). Calibrated to your recent Intervals.icu history. Note: only HR-tracked activities contribute, so surf/MTB/dirt-bike volume is not fully captured here.',
  atl:        '<strong>Fatigue (ATL)</strong> — 7-day load. High relative to CTL = fresh fatigue accumulating. Watch the ratio, not the absolute number.',
  tsb:        '<strong>Form (TSB)</strong> — Fitness minus Fatigue. Positive = fresh. Negative but building = productive. Below −25 = overreach territory.',
  acwr:       '<strong>Load Ratio (ACWR)</strong> — recent load ÷ chronic baseline. 0.8–1.2 = productive zone. Above 1.3 = injury risk. Your hard cap: 1.3×.',
  rampRate:   '<strong>Ramp Rate</strong> — week-over-week CTL change. Safe range: +3 to +7 per week. Above +8 = load spike, watch for overreach in 7–10 days.',
  vo2max:     '<strong>VO2 Max</strong> — Garmin\'s aerobic capacity estimate. Trending up = engine growing. Your target: hold or improve through Mash build.',
  stress:     '<strong>Daily Stress</strong> — Garmin\'s all-day stress score (0–100). Combines HRV fluctuation, activity, and rest periods. Above 60 consistently = recovery suppressed.',
  steps:      '<strong>Daily Steps</strong> — non-training movement. 7,000–10,000 keeps aerobic base active on rest days without adding training load.',
  recoveryDebt: '<strong>Recovery Debt</strong> — consecutive days where HRV stayed below your 85ms threshold. 1 day = normal fluctuation. 3+ days = structural fatigue.',
  subjectiveAlign: '<strong>Subjective / Objective Alignment</strong> — compares how you said you feel vs what your data shows. Mismatches are diagnostically important.'
};

function renderHealthSnapshot(latest, history, idSuffix='') {
  // ── Pull all available wellness fields ────────────────────────────────────
  const hrv        = getField(latest, 'hrv', 'hrvWeeklyAverage');
  const rhr        = getField(latest, 'restingHR');
  const sleepSecs  = getField(latest, 'sleepSecs');
  const sleep      = sleepSecs ? fmtHrs(sleepSecs) : null;
  const sleepScore = getField(latest, 'sleepScore');
  const sleepHR    = getField(latest, 'avgSleepingHR');
  const ctlSnap    = fitnessSnapshot(history);
  const ctl        = ctlSnap.ctl;
  const atl        = ctlSnap.atl;
  const tsb        = ctlSnap.tsb;
  const acwr       = ctlSnap.acwr;
  const rampRate   = latestValid(history, 'rampRate');
  const vo2max     = getField(latest, 'vo2max');
  const stress     = getField(latest, 'avgStressLevel');
  const steps      = getField(latest, 'steps');
  const spO2       = getField(latest, 'spO2');

  const baseReadiness    = computeReadiness(latest, history);
  const adjustedReadiness = applyFeelToReadiness(baseReadiness, state.feel);
  const status = getReadinessStatus(adjustedReadiness);

  // ── Derived metrics ───────────────────────────────────────────────────────
  // 7-day HRV sparkline + trend
  const hrv7 = history.slice(-7).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
  const hrv14pre = history.slice(-14, -7).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
  const hrvTrendVal = (hrv7.length && hrv14pre.length)
    ? (hrv7.reduce((a,b)=>a+b,0)/hrv7.length) - (hrv14pre.reduce((a,b)=>a+b,0)/hrv14pre.length)
    : null;

  // RHR trend
  const rhr7 = history.slice(-7).map(d => getField(d, 'restingHR')).filter(v => v != null);
  const rhr14 = history.slice(-14,-7).map(d => getField(d, 'restingHR')).filter(v => v != null);
  const rhrTrendVal = (rhr7.length && rhr14.length)
    ? (rhr7.reduce((a,b)=>a+b,0)/rhr7.length) - (rhr14.reduce((a,b)=>a+b,0)/rhr14.length)
    : null;

  // Recovery debt: consecutive days HRV < 85ms threshold
  const sortedHistory = [...history].sort((a,b) => (a.id||'').localeCompare(b.id||''));
  let recoveryDebt = 0;
  for (let i = sortedHistory.length - 1; i >= 0; i--) {
    const h = getField(sortedHistory[i], 'hrv', 'hrvWeeklyAverage');
    if (h == null) break;
    if (h < 85) recoveryDebt++;
    else break;
  }

  // 7-day sleep avg
  const sleep7 = history.slice(-7).map(d => getField(d, 'sleepSecs')).filter(v => v != null);
  const sleepAvg7 = sleep7.length ? (sleep7.reduce((a,b)=>a+b,0)/sleep7.length/3600).toFixed(1) : null;

  // Subjective vs objective alignment
  let alignLabel = '', alignColor = 'var(--text-dim)', alignNote = '';
  if (state.feel && adjustedReadiness != null) {
    const feelGood = state.feel === 'fresh' || state.feel === 'normal';
    const dataGood = adjustedReadiness >= 60;
    if (feelGood && dataGood)    { alignLabel = 'Aligned ✓';   alignColor = 'var(--green)';  alignNote = 'Feel and data agree — trust the plan.'; }
    else if (!feelGood && !dataGood) { alignLabel = 'Aligned ✓'; alignColor = 'var(--orange)'; alignNote = 'Both signal recovery day. Listen.'; }
    else if (feelGood && !dataGood)  { alignLabel = 'Mismatch ⚡'; alignColor = 'var(--orange)'; alignNote = 'You feel OK but data says pull back. Trust data.'; }
    else                             { alignLabel = 'Mismatch ⚡'; alignColor = 'var(--yellow)'; alignNote = 'You feel rough but data is OK. Warm up before deciding.'; }
  }

  // CTL 30-day sparkline
  const ctl30 = cleanCtlSeries(history.slice(-30).map(d => getField(d, 'ctl')));

  // Ramp rate status
  const rampColor = rampRate == null ? 'var(--text-dim)'
    : Math.abs(rampRate) > 8 ? 'var(--red)'
    : Math.abs(rampRate) > 6 ? 'var(--orange)'
    : 'var(--green)';
  const rampLabel = rampRate == null ? '—'
    : Math.abs(rampRate) > 8 ? 'Too steep'
    : Math.abs(rampRate) > 6 ? 'Watch closely'
    : rampRate > 0 ? 'Building safely' : 'Tapering';

  // ── Inline sparkline helper ────────────────────────────────────────────────
  function spark(values, color, w=80, h=28) {
    const nums = (values || []).filter(v => typeof v === 'number' && isFinite(v));
    if (nums.length < 2) return '';
    const min = Math.min(...nums), max = Math.max(...nums), range = max - min || 1;
    const pts = nums.map((v,i) => {
      const x = (i/(nums.length-1))*w;
      const y = h - ((v-min)/range)*(h-4) - 2;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const last = pts.split(' ').at(-1).split(',');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${parseFloat(last[0])}" cy="${parseFloat(last[1])}" r="2.5" fill="${color}"/>
    </svg>`;
  }

  // ── Metric tile helper ─────────────────────────────────────────────────────
  const tile = (key, label, value, unit='', meta='', color='var(--text)', sparkHtml='') => `
    <div class="rec-tile" onclick="toggleHelp('${key}${idSuffix}')">
      <div class="rec-tile-label">${label} <span class="snap-metric-help">?</span></div>
      <div class="rec-tile-row">
        <div>
          <div class="rec-tile-value" style="color:${color}">${value ?? '—'}<span class="rec-tile-unit">${value != null ? unit : ''}</span></div>
          ${meta ? `<div class="rec-tile-meta">${meta}</div>` : ''}
        </div>
        ${sparkHtml ? `<div class="rec-tile-spark">${sparkHtml}</div>` : ''}
      </div>
      <div class="help-drawer" id="help-${key}${idSuffix}">${HELP[key] || ''}</div>
    </div>`;

  // ── Bar helper for sleep stages ────────────────────────────────────────────
  const scoreBar = (val, max, color) => {
    const pct = val != null ? Math.min((val/max)*100, 100) : 0;
    return `<div class="rec-bar-track"><div class="rec-bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
  };

  // ── Readiness ring ─────────────────────────────────────────────────────────
  const readPct = adjustedReadiness != null ? adjustedReadiness / 100 : 0;
  const ringHtml = ringGaugeSvg(
    adjustedReadiness != null ? String(adjustedReadiness) : '—', '',
    readPct, status.color, 76
  );

  const nowStr = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const feelNote = state.feel ? `Adjusted for "${FEEL_OPTIONS.find(o=>o.id===state.feel)?.label}" check-in` : '';

  // Trend arrows
  const up = (v, inv=false) => {
    if (v == null) return '';
    const dir = v > 1 ? 'up' : v < -1 ? 'down' : 'flat';
    if (dir === 'flat') return `<span class="trend-flat">→ stable</span>`;
    const good = inv ? dir === 'down' : dir === 'up';
    return `<span class="${good ? 'trend-up' : 'trend-down'}">${dir === 'up' ? '↑' : '↓'} ${Math.abs(v).toFixed(1)} vs prior wk</span>`;
  };

  return `
    <div class="snapshot">
      <div class="snapshot-header">
        <div class="snapshot-title">Recovery</div>
        <div class="snapshot-time">${nowStr}</div>
      </div>

      <!-- READINESS BLOCK -->
      <div class="readiness-block">
        ${ringHtml}
        <div class="readiness-info">
          <div class="readiness-label">Today's Readiness</div>
          <div class="readiness-status" style="color:${status.color}">${status.label}</div>
          <div class="readiness-msg">${status.msg}</div>
          ${feelNote ? `<div class="readiness-msg" style="margin-top:4px;font-size:11px;color:var(--primary);">${feelNote}</div>` : ''}
        </div>
      </div>

      <!-- SECTION: HRV & CARDIAC -->
      <div class="rec-section-label">HRV &amp; Cardiac</div>
      <div class="rec-grid-2">
        ${tile('hrv', 'HRV Today', hrv ? Math.round(hrv) : null, ' ms',
          `<div class="rec-tile-sub">${up(hrvTrendVal)}</div>`,
          hrv == null ? 'var(--text-dim)' : hrv < 85 ? 'var(--red)' : hrv < 92 ? 'var(--yellow)' : 'var(--green)',
          spark(hrv7, hrv < 85 ? 'var(--red)' : 'var(--green)')
        )}
        ${tile('rhr', 'Resting HR', rhr, ' bpm',
          `<div class="rec-tile-sub">${up(rhrTrendVal, true)}</div>`,
          rhr == null ? 'var(--text-dim)' : rhr > 55 ? 'var(--orange)' : 'var(--text)',
          spark(rhr7, 'var(--primary)')
        )}
      </div>
      <div class="rec-grid-2" style="margin-top:8px">
        <div class="rec-tile">
          <div class="rec-tile-label">HRV Recovery Debt</div>
          <div class="rec-tile-value" style="color:${recoveryDebt >= 3 ? 'var(--red)' : recoveryDebt >= 1 ? 'var(--orange)' : 'var(--green)'}">
            ${recoveryDebt} <span class="rec-tile-unit">day${recoveryDebt !== 1 ? 's' : ''}</span>
          </div>
          <div class="rec-tile-meta">${recoveryDebt === 0 ? 'HRV above threshold — clear' : recoveryDebt === 1 ? 'One low day — monitor' : recoveryDebt < 3 ? 'Accumulating — ease up' : 'Structural fatigue — rest required'}</div>
          <div class="help-drawer" id="help-recoveryDebt${idSuffix}">${HELP.recoveryDebt}</div>
        </div>
        ${spO2 != null ? tile('spO2', 'Blood O₂ (SpO₂)', spO2.toFixed(1), '%', '',
          spO2 < 95 ? 'var(--red)' : spO2 < 97 ? 'var(--yellow)' : 'var(--green)') : `<div class="rec-tile rec-tile-empty"><div class="rec-tile-label">Blood O₂</div><div class="rec-tile-na">Not synced</div></div>`}
      </div>

      <!-- SECTION: SLEEP -->
      <div class="rec-section-label">Sleep</div>
      <div class="rec-sleep-row">
        <div class="rec-sleep-main">
          <div class="rec-tile-label">Last Night</div>
          <div class="rec-tile-value" style="color:${sleep == null ? 'var(--text-dim)' : parseFloat(sleep) < 6 ? 'var(--red)' : parseFloat(sleep) >= 7.5 ? 'var(--green)' : 'var(--text)'}">
            ${sleep ?? '—'}<span class="rec-tile-unit">${sleep ? ' hrs' : ''}</span>
          </div>
          ${sleepScore != null ? `
            <div class="rec-tile-meta" style="margin-top:6px">Score ${sleepScore}/100</div>
            ${scoreBar(sleepScore, 100, sleepScore >= 70 ? 'var(--green)' : sleepScore >= 50 ? 'var(--yellow)' : 'var(--red)')}` : ''}
          ${sleepHR != null ? `<div class="rec-tile-meta" style="margin-top:5px">Sleeping HR: ${Math.round(sleepHR)} bpm</div>` : ''}
        </div>
        <div class="rec-sleep-spark">
          <div class="rec-tile-label">7-Day Avg</div>
          <div class="rec-tile-value" style="font-size:16px;color:${sleepAvg7 == null ? 'var(--text-dim)' : parseFloat(sleepAvg7) < 6.5 ? 'var(--orange)' : 'var(--green)'}">
            ${sleepAvg7 ?? '—'}<span class="rec-tile-unit">${sleepAvg7 ? ' hrs' : ''}</span>
          </div>
          ${spark(sleep7.map(s=>s/3600), 'var(--purple)', 80, 28)}
        </div>
      </div>

      <!-- SECTION: TRAINING LOAD -->
      <div class="rec-section-label">Training Load</div>
      <div class="rec-grid-3">
        ${tile('ctl', 'Fitness (CTL)', ctl != null ? ctl.toFixed(1) : null, '', `Baseline: ${CTL_CONFIG.baseline}`,
          ctl == null ? 'var(--text-dim)' : ctl >= CTL_CONFIG.baseline ? 'var(--green)' : 'var(--orange)',
          spark(ctl30, 'var(--primary)', 56, 24)
        )}
        ${tile('tsb', 'Form (TSB)', tsb != null ? (tsb > 0 ? '+' : '') + Math.round(tsb) : null, '',
          tsb == null ? '' : tsb > 5 ? 'Fresh' : tsb > -10 ? 'Neutral' : tsb > -20 ? 'Productive' : 'Fatigued',
          tsb == null ? 'var(--text-dim)' : tsb > 5 ? 'var(--green)' : tsb > -10 ? 'var(--primary)' : tsb > -20 ? 'var(--orange)' : 'var(--red)'
        )}
        ${tile('acwr', 'Load Ratio', acwr ? acwr.toFixed(2) : null, 'x',
          acwr == null ? '' : acwr > 1.3 ? '⚠ Above cap' : acwr >= 0.8 ? 'Optimal zone' : 'Deload',
          acwr == null ? 'var(--text-dim)' : acwr > 1.3 ? 'var(--red)' : acwr >= 0.8 ? 'var(--green)' : 'var(--text-dim)'
        )}
      </div>
      <div class="rec-grid-2" style="margin-top:8px">
        ${rampRate != null ? tile('rampRate', 'Weekly Ramp Rate', (rampRate > 0 ? '+' : '') + rampRate.toFixed(1), ' CTL/wk', rampLabel, rampColor) : `<div class="rec-tile rec-tile-empty"><div class="rec-tile-label">Ramp Rate</div><div class="rec-tile-na">No data</div></div>`}
        ${vo2max != null ? tile('vo2max', 'VO₂ Max', vo2max.toFixed(1), ' ml/kg/min', 'Garmin estimate', 'var(--text)') : `<div class="rec-tile rec-tile-empty"><div class="rec-tile-label">VO₂ Max</div><div class="rec-tile-na">Not synced</div></div>`}
      </div>

      <!-- SECTION: STRESS & LIFESTYLE -->
      <div class="rec-section-label">Stress &amp; Lifestyle</div>
      <div class="rec-grid-2">
        ${stress != null ? `
        <div class="rec-tile">
          <div class="rec-tile-label">All-Day Stress <span class="snap-metric-help">?</span></div>
          <div class="rec-tile-value" style="color:${stress > 60 ? 'var(--red)' : stress > 40 ? 'var(--orange)' : 'var(--green)'}">${Math.round(stress)}<span class="rec-tile-unit">/100</span></div>
          ${scoreBar(stress, 100, stress > 60 ? 'var(--red)' : stress > 40 ? 'var(--yellow)' : 'var(--green)')}
          <div class="rec-tile-meta">${stress > 60 ? 'High — recovery suppressed' : stress > 40 ? 'Moderate — manageable' : 'Low — good recovery window'}</div>
          <div class="help-drawer" id="help-stress${idSuffix}">${HELP.stress}</div>
        </div>` : `<div class="rec-tile rec-tile-empty"><div class="rec-tile-label">All-Day Stress</div><div class="rec-tile-na">Not synced</div></div>`}
        ${steps != null ? `
        <div class="rec-tile">
          <div class="rec-tile-label">Steps <span class="snap-metric-help">?</span></div>
          <div class="rec-tile-value" style="color:${steps < 5000 ? 'var(--text-muted)' : steps >= 8000 ? 'var(--green)' : 'var(--text)'}">${steps >= 1000 ? (steps/1000).toFixed(1)+'k' : steps}</div>
          ${scoreBar(steps, 12000, steps >= 8000 ? 'var(--green)' : 'var(--yellow)')}
          <div class="rec-tile-meta">${steps >= 10000 ? 'Excellent movement' : steps >= 7000 ? 'On target' : 'Low — walk on rest days'}</div>
          <div class="help-drawer" id="help-steps${idSuffix}">${HELP.steps}</div>
        </div>` : `<div class="rec-tile rec-tile-empty"><div class="rec-tile-label">Daily Steps</div><div class="rec-tile-na">Not synced</div></div>`}
      </div>

      <!-- SECTION: SUBJECTIVE ALIGNMENT -->
      ${state.feel && alignLabel ? `
      <div class="rec-section-label">Subjective vs Objective</div>
      <div class="rec-align-block" onclick="toggleHelp('subjectiveAlign${idSuffix}')">
        <div class="rec-align-status" style="color:${alignColor}">${alignLabel}</div>
        <div class="rec-align-note">${alignNote}</div>
        <div class="help-drawer" id="help-subjectiveAlign${idSuffix}">${HELP.subjectiveAlign}</div>
      </div>` : ''}

    </div>`;
}
