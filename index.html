// ── generic SVG charts ──────────────────────────────────────────────
// bars: [{label, tip, segs:[{v,color}]}]; line: optional overlay values
function barChart({ bars, height = 120, line = null, lineTip = '', target = null, unit = '', read = '' }) {
  const W = 340, H = height, padB = 16, padT = 6;
  const max = Math.max(1, target || 0, ...bars.map(b => b.segs.reduce((s, x) => s + (x.v || 0), 0)), ...(line || []).filter(v => v != null));
  const bw = W / bars.length;
  const y = v => H - padB - (v / max) * (H - padB - padT);
  let svg = '';
  if (target) svg += `<line x1="0" x2="${W}" y1="${y(target)}" y2="${y(target)}" class="ch-target"/>`;
  bars.forEach((b, i) => {
    let acc = 0;
    const x = i * bw + bw * 0.18, w = bw * 0.64;
    b.segs.forEach(s => {
      if (!s.v) return;
      const y1 = y(acc + s.v), y0 = y(acc);
      svg += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0.5, y0 - y1).toFixed(1)}" rx="2" fill="${s.color}"/>`;
      acc += s.v;
    });
    svg += `<rect class="ch-hit" x="${(i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H - padB}" data-tip="${esc(b.tip)}"/>`;
    const kk = bars.length <= 14 ? 1 : Math.ceil(bars.length / 8);
    if (i % kk === 0 && (i === bars.length - 1 || bars.length - 1 - i >= kk / 2 || kk === 1) || (i === bars.length - 1 && i % kk >= kk / 2))
      svg += `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 3}" class="ch-x">${esc(b.label)}</text>`;
  });
  if (line) {
    const pts = line.map((v, i) => v == null ? null : `${(i * bw + bw / 2).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
    svg += `<polyline points="${pts.join(' ')}" class="ch-avg"/>`;
  }
  return `<div class="ch"><div class="ch-read">${read}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${svg}</svg></div>`;
}

// points: [{label, v, tip}]; band [lo, hi]; avg overlay
function lineChart({ points, height = 120, color = 'var(--primary)', band = null, avg = null, read = '', lowerBetter = false, target = null }) {
  const W = 340, H = height, padB = 16, padT = 8;
  const vals = points.map(p => p.v).filter(v => v != null).concat(band || [], (avg || []).filter(v => v != null), target != null ? [target] : []);
  if (!vals.length) return `<div class="ch"><div class="ch-read">No data yet</div></div>`;
  let min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max - min) * 0.15 || 5; min -= pad; max += pad;
  const step = W / points.length;
  const x = i => i * step + step / 2;
  const y = v => H - padB - (v - min) / (max - min) * (H - padB - padT);
  let svg = '';
  if (target != null) svg += `<line x1="0" x2="${W}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" class="ch-target"/>`;
  if (band) svg += `<rect x="0" y="${y(band[1]).toFixed(1)}" width="${W}" height="${(y(band[0]) - y(band[1])).toFixed(1)}" class="ch-band"/>`;
  const segs = []; let cur = [];
  points.forEach((p, i) => { if (p.v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`); });
  if (cur.length) segs.push(cur);
  segs.forEach(s => svg += `<polyline points="${s.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-opacity=".55"/>`);
  if (avg) {
    const pts = avg.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
    svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.6"/>`;
  }
  points.forEach((p, i) => {
    if (p.v != null) svg += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.4" fill="${p.color || color}"/>`;
    svg += `<rect class="ch-hit" x="${(i * step).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H - padB}" data-tip="${esc(p.tip)}"/>`;
    const kp = Math.ceil(points.length / 6);
    if ((i % kp === 0 && points.length - 1 - i >= kp / 2) || i === points.length - 1)
      svg += `<text x="${x(i).toFixed(1)}" y="${H - 3}" class="ch-x">${esc(p.label)}</text>`;
  });
  return `<div class="ch"><div class="ch-read">${read}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${svg}</svg></div>`;
}

function weekCoverage() {
  const mon = mondayOf(todayIso);

  const acts = garminReady() ? state.garmin.acts.filter(a => actDate(a) >= mon) : [];

  return {

    untagged: Math.max(0, strengthActs - has('lower') - has('upper')),

// ── coach's call: one decision from every signal ────────────────────
const LEVELS = { go: 0, reduce: 1, z2: 2, back: 3, rest: 4 };
function coachCall() {
  const reasons = [];
  let level = 'go';
  const bump = l => { if (LEVELS[l] > LEVELS[level]) level = l; };

  let r = null, acwr = null;
  if (garminReady()) {
    r = garminReadiness(state.garmin);
    acwr = garminAcwr(state.garmin);
    bump(r.level);
    if (r.avg7 && r.band?.hrvLow) {
      const inBand = r.avg7 >= r.band.hrvLow;
      reasons.push({ tone: inBand ? 'good' : 'warn', text: `HRV ${r.avg7} ms (7-day) is ${inBand ? 'inside' : 'below'} your baseline ${r.band.hrvLow}–${r.band.hrvHigh}.` });
    }
    if (r.sleepLast?.sleepS) {
      const h = r.sleepLast.sleepS / 3600;
      reasons.push({ tone: h >= 7 ? 'good' : h >= 6 ? 'neutral' : 'warn', text: `Slept ${fmtHm(r.sleepLast.sleepS)}${h < 6 ? ' — under 6 h' : ''}.` });
    }
    if (acwr) {
      if (acwr.ratio > 1.3) { bump('reduce'); reasons.push({ tone: 'warn', text: `Load ratio ${acwr.ratio.toFixed(2)} is over 1.3 — hold volume.` }); }
      else if (acwr.ratio < 0.8) reasons.push({ tone: 'neutral', text: `Load ratio ${acwr.ratio.toFixed(2)} — room to build.` });
    }
  } else {
    const sorted = [...state.wellness].sort((a, b) => (a.id || '').localeCompare(b.id || ''));
    const sc = applyFeelToReadiness(computeReadiness(getBackfilledLatest(sorted), sorted), state.feel);
    const s = typeof sc === 'object' ? sc.score ?? sc.value : sc;
    if (s != null) {
      bump(s >= 70 ? 'go' : s >= 50 ? 'reduce' : s >= 35 ? 'z2' : 'rest');
      reasons.push({ tone: s >= 70 ? 'good' : 'warn', text: `Intervals readiness ${Math.round(s)}/100.` });
    }
  }

  if (state.feel === 'beat') { bump('z2'); reasons.push({ tone: 'warn', text: 'You feel beat — trust it.' }); }
  else if (state.feel === 'sore') { bump('reduce'); reasons.push({ tone: 'neutral', text: 'Sore — trim the lifting.' }); }

  const back = backEntryFor(todayIso);
  if (back && back.pain != null) {
    if (back.pain >= 6 || back.reach.includes('Knee')) { bump('back'); reasons.push({ tone: 'bad', text: `Back ${back.pain}/10${back.reach.includes('Knee') ? ', reaching the knee' : ''} — back first.` }); }
    else if (back.pain >= 3) reasons.push({ tone: 'warn', text: `Back ${back.pain}/10 — spine-friendly lower only.` });
    else reasons.push({ tone: 'good', text: `Back ${back.pain}/10.` });
  } else reasons.push({ tone: 'neutral', text: 'Back not logged yet today.', action: "setTab('back')" });

  const HEAD = {
    go:     ['Green light', 'Train as planned.', 'var(--green)'],
    reduce: ['Train, but trim', 'Cut volume 10–15%: drop the last set of each lift, keep runs under 145 bpm.', 'var(--yellow)'],
    z2:     ['Zone 2 only', 'Easy aerobic work, HR capped at 145. No lifting intensity today.', 'var(--orange)'],
    back:   ['Back first', 'Do the back routine, then easy Zone 2. No loaded lower body.', 'var(--orange)'],
    rest:   ['Rest day', 'Back routine and a walk. That is the whole session.', 'var(--red)'],
  };
  return { level, head: HEAD[level], reasons, back, r, acwr };
}

const BACK_ROUTINE = [
  'Prone press-ups — 10 slow (keep only if leg pain eases)',
  'Cat-cow — 10',
  'Seated nerve sliders — 2×10 left (glide, don’t stretch)',
  'Half-kneeling hip flexor — 2×30 s/side, glute on',
  '90/90 hip switches — 8 each way',
  'Open books — 8/side',

];
const CAT_LABEL = { lower: 'Lower', upper: 'Upper', run: 'Z2 run', mtb: 'Long MTB', z2: 'Zone 2', back: 'Back + walk' };

function pickSession(call, mins) {
  const cov = weekCoverage();
  const pain = call.back?.pain ?? 0;
  let cats;
  if (call.level === 'rest') cats = ['back'];
  else if (call.level === 'back' || call.level === 'z2') cats = ['z2', 'back'];
  else {
    const need = ['lower', 'upper', 'run'].filter(c => !cov[c]).sort((a, b) => lastDone(a).localeCompare(lastDone(b)));
    const adds = [];
    if (mins >= 90 && !cov.mtb) adds.push('mtb');
    if (cov.upper < 2) adds.push('upper');
    adds.push('z2');
    cats = [...need, ...adds.filter(c => !need.includes(c))];
    if (pain >= 6) cats = cats.filter(c => c !== 'lower');
    if (mins < 90) cats = cats.filter(c => c !== 'mtb');
    // don't repeat what was already done today
    cats = cats.filter(c => !cov.doneToday.includes(c));
    if (!cats.length) cats = ['z2'];
  }
  const cat = state.pickOverride && cats.concat(['lower', 'upper', 'run', 'z2', 'back', 'mtb']).includes(state.pickOverride) ? state.pickOverride : cats[0];
  return { session: buildSession(cat, mins, call), alts: [...new Set(cats.filter(c => c !== cat))].slice(0, 3), cov };
}

function buildSession(cat, mins, call) {
  const S = SESSIONS;
  const trim = call.level === 'reduce';
  const take = (list, n) => list.slice(0, n).map(e => ({ ...e }));
  const why = {
    lower: 'Lower body is the oldest box on your 3-day minimum.',
    upper: 'Upper day keeps the minimum moving — incline first, biceps in.',
    run: 'Zone 2 run with a 170 spm metronome — aerobic base and cadence.',
    mtb: 'You have the time — long ride builds the engine.',
    z2: call.level === 'go' ? 'Minimum is covered — bank easy aerobic time.' : 'Today calls for easy aerobic work only.',
    back: 'Recovery day: the routine is the session.',
  }[cat];
  let s;
  if (cat === 'lower') {
    const ex = S.Monday.exercises;
    const pick = mins <= 20 ? [ex[0], ex[2], ex[4]] : mins <= 40 ? [ex[0], ex[1], ex[2], ex[4]] : ex;
    s = { title: 'Lower — spine-friendly', warmup: mins <= 20 ? S.Monday.warmup.slice(0, 2) : S.Monday.warmup, exercises: pick.map(e => ({ ...e })), cooldown: S.Monday.cooldown };
  } else if (cat === 'upper') {
    const t = S.Tuesday.exercises, f = S.Friday.exercises;
    const find = (list, re) => list.find(e => re.test(e.name)) || list[0];
    const incline = find(t, /Incline Barbell/), pull = find(f, /Pull-Up/), row = find(f, /Row/), hammer = find(f, /Hammer/),
          incline2 = find(t, /Landmine|Smith/), curl = find(t, /Curl/), face = find(f, /Face Pull/);
    const pick = mins <= 20 ? [incline, pull, hammer] : mins <= 40 ? [incline, pull, row, hammer] : [incline, pull, incline2, row, face, curl];
    s = { title: mins <= 20 ? 'Upper — express supersets' : 'Upper — push, pull, biceps', warmup: ['Band pull-aparts — 15', 'Scap push-ups — 10', 'Light incline press — 2×10'], exercises: pick.map(e => ({ ...e })), cooldown: ['Doorway pec stretch — 30 s/side', 'Open books — 8/side'] };
    if (mins <= 20) s.exercises.forEach(e => { e.sets = 3; e.rest = 'superset, 60 sec'; });
  } else if (cat === 'run') {
    const m = Math.max(20, Math.min(60, mins - 5));
    s = { title: `Zone 2 run — ${m} min`, warmup: ['Walk 3 min', 'Leg swings — 10/side'], exercises: [{ name: 'Trail or road run', sets: 1, reps: `${m} min`, weight: '140–150 bpm cap', rest: '—', notes: '170 spm metronome. Walk the climbs if HR passes 150.' }], cooldown: ['Half-kneeling hip flexor — 60 s/side', 'Calf stretch — 45 s/side'] };
  } else if (cat === 'mtb') {
    const m = Math.min(150, mins);
    s = { title: `Long MTB — ${hm(m)}`, warmup: ['First 10 min easy spin'], exercises: [{ name: 'MTB ride', sets: 1, reps: `${m} min`, weight: 'Z2, climbs ≤ Z3', rest: '—', notes: '500 mg sodium before. 60 g carbs/hour after the first hour. Stand and reset your back every 20 min.' }], cooldown: ['Half-kneeling hip flexor — 60 s/side', 'Prone press-ups — 10'] };
  } else if (cat === 'z2') {
    const m = Math.max(15, mins - 12);
    s = { title: `Zone 2 + back routine`, warmup: ['Back routine first (12 min)'], exercises: [{ name: 'Easy bike, run or brisk walk', sets: 1, reps: `${m} min`, weight: '≤ 145 bpm', rest: '—', notes: 'Nasal breathing pace. Bike or walk if running bugs the back.' }], cooldown: BACK_ROUTINE };
  } else {
    s = { title: 'Back routine + walk', warmup: [], exercises: BACK_ROUTINE.map(n => ({ name: n })).concat(mins > 20 ? [{ name: 'Easy walk', reps: `${Math.max(10, mins - 15)} min`, notes: 'Stroller walk counts.' }] : []), cooldown: [] };
  }
  if (trim && ['lower', 'upper'].includes(cat)) s.exercises.forEach(e => { if (typeof e.sets === 'number' && e.sets > 2) e.sets -= 1; });
  return { cat, mins, why, trimNote: trim && ['lower', 'upper', 'run', 'mtb'].includes(cat) ? 'Trimmed: one less set per lift, HR under 145.' : '', ...s };
}

// ── TRAIN ───────────────────────────────────────────────────────────
function mTrain() {
  setTimeout(loadRunMechanics, 0);
  if (!garminReady()) return renderGarminCard() + renderRunMechanics();
  const g = state.garmin, n = state.trainWeeks;
  const weeks = lastNWeeks(n + 4);           // +4 for rolling average lead-in
  const byWeek = {};
  weeks.forEach(w => byWeek[w] = { mins: 0, load: 0, n: 0, sport: {}, z: [0, 0, 0, 0, 0] });
  g.acts.forEach(a => {
    const w = mondayOf(actDate(a)); const b = byWeek[w]; if (!b) return;
    const sp = sportOf(a.type), m = (a.dur || 0) / 60;
    b.mins += m; b.load += a.load || 0; b.n += 1;
    b.sport[sp] = (b.sport[sp] || 0) + m;
    (a.z || []).forEach((s, i) => b.z[i] += (s || 0) / 60);
  });
  const shown = weeks.slice(4);
  const roll = (w, key) => { const i = weeks.indexOf(w); const prev = weeks.slice(Math.max(0, i - 4), i).map(x => byWeek[x][key]); return prev.length ? prev.reduce((a, b) => a + b, 0) / prev.length : null; };
  const cur = byWeek[shown[shown.length - 1]];
  const base = { mins: roll(shown[shown.length - 1], 'mins'), load: roll(shown[shown.length - 1], 'load'), n: roll(shown[shown.length - 1], 'n') };
  const acwr = garminAcwr(g);
  const dayOfWeek = (new Date().getDay() + 6) % 7 + 1;

  // weekly time by sport
  const sportsUsed = Object.keys(SPORTS).filter(sp => shown.some(w => byWeek[w].sport[sp]));
  const timeBars = shown.map(w => ({
    label: shortDate(w),
    tip: `<b>Week of ${shortDate(w)}</b> · ${hm(byWeek[w].mins)} · ${byWeek[w].n} sessions · ${sportsUsed.filter(sp => byWeek[w].sport[sp]).map(sp => `${SPORTS[sp].label} ${hm(byWeek[w].sport[sp])}`).join(' · ') || 'nothing logged'}`,
    segs: sportsUsed.map(sp => ({ v: (byWeek[w].sport[sp] || 0) / 60, color: SPORTS[sp].color })),
  }));
  const timeAvg = shown.map(w => { const v = roll(w, 'mins'); return v == null ? null : v / 60; });
  // Pro-rate the 4-week average to today so midweek isn't always "behind"
  const frac = dayOfWeek / 7, dayName = new Date().toLocaleDateString('en-US', { weekday: 'short' });
  const pace = k => base[k] == null ? null : base[k] * frac;
  const tDelta = pctDelta(cur.mins, pace('mins'));
  const timeTake = !base.mins ? '' : tDelta <= -30
      ? takeaway('warn', `${hm(cur.mins)} through ${dayName} — ${Math.abs(tDelta)}% behind your usual pace (${hm(base.mins)} a week).${dayOfWeek >= 5 ? ' Weekend is where to catch up.' : ''}`)
      : tDelta >= 30 ? takeaway('warn', `${hm(cur.mins)} through ${dayName} — ${tDelta}% ahead of your usual pace. That is how boom-bust starts; don't stack more.`)
      : takeaway('good', `${hm(cur.mins)} through ${dayName} — on pace for your usual ${hm(base.mins)} week.`);

  // zones per week
  const zc = ['#64748B', 'var(--green)', 'var(--yellow)', 'var(--orange)', 'var(--red)'];
  const zBars = shown.map(w => {
    const z = byWeek[w].z, tot = z.reduce((a, b) => a + b, 0);
    return { label: shortDate(w), tip: `<b>Week of ${shortDate(w)}</b> · ${tot ? Math.round((z[0] + z[1]) / tot * 100) : 0}% easy · ${z.map((m, i) => `Z${i + 1} ${Math.round(m)}m`).join(' · ')}`, segs: z.map((m, i) => ({ v: m, color: zc[i] })) };
  });
  const zNow = cur.z, zTot = zNow.reduce((a, b) => a + b, 0), easy = zTot ? Math.round((zNow[0] + zNow[1]) / zTot * 100) : null;
  const zTake = easy == null ? '' : easy >= 75 ? takeaway('good', `${easy}% easy this week. That's how the aerobic base gets built.`) : takeaway('warn', `Only ${easy}% easy this week. Your weakness is aerobic efficiency — aim for 80% in Zones 1–2.`);

  // load
  const loadBars = shown.map(w => ({ label: shortDate(w), tip: `<b>Week of ${shortDate(w)}</b> · load ${Math.round(byWeek[w].load)}`, segs: [{ v: byWeek[w].load, color: w === shown[shown.length - 1] ? 'var(--primary)' : '#3B4B63' }] }));
  const loadAvg = shown.map(w => roll(w, 'load'));
  const loadTake = !acwr ? '' : acwr.ratio > 1.3 ? takeaway('bad', `Ratio ${acwr.ratio.toFixed(2)} — over your 1.3 guardrail. Hold or cut volume this week.`) : acwr.ratio < 0.8 ? takeaway('neutral', `Ratio ${acwr.ratio.toFixed(2)} — under-loaded. Safe to add a session.`) : takeaway('good', `Ratio ${acwr.ratio.toFixed(2)} — in the build zone (0.8–1.3).`);

  const recent = [...g.acts].sort((a, b) => String(b.t).localeCompare(String(a.t))).slice(0, 8);

  return `
  <div class="m-seg m-range">${[4, 8, 12].map(w => `<button class="${n === w ? 'on' : ''}" onclick="setTrainWeeks(${w})">${w} wk</button>`).join('')}</div>

  <div class="m-tiles">
    <div class="m-tile"><div class="g-k">Time this wk</div><div class="m-tile-v">${hm(cur.mins)}</div><div class="g-s">${deltaChip(tDelta)} vs usual by ${dayName}</div></div>
    <div class="m-tile"><div class="g-k">Sessions</div><div class="m-tile-v">${cur.n}</div><div class="g-s">${deltaChip(pctDelta(cur.n, pace('n')))} vs usual by ${dayName}</div></div>
    <div class="m-tile"><div class="g-k">Garmin load</div><div class="m-tile-v">${Math.round(cur.load)}</div><div class="g-s">${deltaChip(pctDelta(cur.load, pace('load')))} vs usual by ${dayName}</div></div>
    <div class="m-tile"><div class="g-k">Load ratio</div><div class="m-tile-v" style="color:${!acwr ? 'var(--text)' : acwr.ratio > 1.3 ? 'var(--red)' : acwr.ratio < 0.8 ? 'var(--yellow)' : 'var(--green)'}">${acwr ? acwr.ratio.toFixed(2) : '—'}</div><div class="g-s">7-day vs 28-day</div></div>
  </div>

  <div class="card m-card">
    <div class="card-title">Each week · hours</div>
    ${timeTake}
    ${barChart({ bars: timeBars, line: timeAvg, read: timeBars[timeBars.length - 1].tip, height: 130 })}
    ${legend([...sportsUsed.map(sp => [SPORTS[sp].color, SPORTS[sp].label]), ['transparent;border-top:2px dashed var(--text-muted);height:0', '4-wk avg']])}
  </div>

  <div class="card m-card">
    <div class="card-title">Heart-rate zones · minutes</div>
    ${zTake}
    ${barChart({ bars: zBars, read: zBars[zBars.length - 1].tip, height: 120 })}
    ${legend([[zc[0], 'Z1 <142'], [zc[1], 'Z2 142–160'], [zc[2], 'Z3 160–169'], [zc[3], 'Z4 169–187'], [zc[4], 'Z5 187+']])}
  </div>

  ${renderRunMechanics()}

  <div class="card m-card">
    <div class="card-title">Training load · Garmin</div>
    ${loadTake}
    ${barChart({ bars: loadBars, line: loadAvg, read: loadBars[loadBars.length - 1].tip, height: 110 })}
    <div class="g-s">Counts every activity — paddle, surf and dirt bike included. Dashed line: 4-week average.</div>
  </div>

  <div class="card m-card">
    <div class="card-title">Recent</div>
    ${recent.map(a => {
      const sp = sportOf(a.type);
      const mi = a.dist ? (a.dist / 1609.34).toFixed(1) + ' mi' : '';
      return `<div class="m-act"><i style="background:${SPORTS[sp].color}"></i><div><div class="m-act-n">${esc(a.name && a.name.length > 1 ? a.name : SPORTS[sp].label)}</div>
        <div class="g-s">${new Date(a.t.replace(' ', 'T')).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} · ${[hm((a.dur || 0) / 60), mi, a.hr && `${a.hr} bpm`, a.load && `load ${Math.round(a.load)}`].filter(Boolean).join(' · ')}</div></div></div>`;
    }).join('')}
  </div>`;
}

// ── RECOVER ─────────────────────────────────────────────────────────
function mRecover() {
  if (!garminReady()) return renderGarminCard();
  const g = state.garmin, days = g.days;
  const byD = Object.fromEntries(days.map(d => [d.d, d]));
  const span = n => Array.from({ length: n }, (_, i) => daysAgoIso(n - 1 - i));
  const r = garminReadiness(g);

  // HRV 30 days with Garmin baseline band and 7-day average
  const d30 = span(30);
  const hrvPts = d30.map(d => ({ label: shortDate(d), v: byD[d]?.hrv ?? null, tip: `<b>${shortDate(d)}</b> · ${byD[d]?.hrv ?? '—'} ms · 7-day ${byD[d]?.hrvWeek ?? '—'}${byD[d]?.hrvStatus ? ' · ' + String(byD[d].hrvStatus).toLowerCase() : ''}` }));
  const hrvAvg = d30.map((d, i) => { const w = d30.slice(Math.max(0, i - 6), i + 1).map(x => byD[x]?.hrv).filter(v => v != null); return w.length >= 3 ? w.reduce((a, b) => a + b, 0) / w.length : null; });
  const band = r.band?.hrvLow ? [r.band.hrvLow, r.band.hrvHigh] : null;
  const hrvTake = !r.avg7 || !band ? '' : r.avg7 < band[0] * 0.9 ? takeaway('bad', `7-day HRV ${r.avg7} ms — well under baseline. Zone 2 only until it climbs back.`)
    : r.avg7 < band[0] ? takeaway('warn', `7-day HRV ${r.avg7} ms — just under baseline. Trim volume 10–15%.`)
    : takeaway('good', `7-day HRV ${r.avg7} ms — inside your ${band[0]}–${band[1]} baseline.`);

  // Sleep 14 nights, stages
  const d14 = span(14);
  const sleepBars = d14.map(d => {
    const x = byD[d] || {}, tot = (x.sleepS || 0) / 3600, deep = (x.deepS || 0) / 3600, rem = (x.remS || 0) / 3600;
    return { label: new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'narrow' }), tip: x.sleepS ? `<b>${shortDate(d)}</b> · ${fmtHm(x.sleepS)} · score ${x.sleepScore ?? '—'} · deep ${fmtHm(x.deepS)} · REM ${fmtHm(x.remS)}` : `<b>${shortDate(d)}</b> · no sleep data`,
      segs: [{ v: deep, color: '#3B5BDB' }, { v: rem, color: '#A78BFA' }, { v: Math.max(0, tot - deep - rem), color: '#4F8EF7' }] };
  });
  const s7 = r.sleep7 ? r.sleep7 / 3600 : null;
  const sleepTake = s7 == null ? '' : s7 >= 7 ? takeaway('good', `Averaging ${fmtHm(r.sleep7)} this week. Protect it.`) : takeaway(s7 < 6 ? 'bad' : 'warn', `Averaging ${fmtHm(r.sleep7)} — ${Math.round((7 - s7) * 60)} min a night short of 7 h. Newborn tax: keep intensity honest and nap when you can.`);

  // Resting HR 30 days
  const rhrPts = d30.map(d => ({ label: shortDate(d), v: byD[d]?.rhr ?? null, tip: `<b>${shortDate(d)}</b> · resting HR ${byD[d]?.rhr ?? '—'} bpm` }));
  const rhrVals = rhrPts.map(p => p.v).filter(v => v != null);
  const rhrBase = rhrVals.length ? rhrVals.reduce((a, b) => a + b, 0) / rhrVals.length : null;
  const rhrLast = rhrVals[rhrVals.length - 1];
  const rhrTake = rhrBase == null ? '' : rhrLast >= rhrBase + 5 ? takeaway('warn', `Resting HR ${rhrLast} — ${Math.round(rhrLast - rhrBase)} above your 30-day average. Often illness, stress or poor sleep coming.`) : takeaway('good', `Resting HR ${rhrLast} bpm, in line with your ${Math.round(rhrBase)} average.`);

  // Body Battery range 14 days
  const bbBars = d14.map(d => { const x = byD[d] || {}; return { label: new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'narrow' }), tip: `<b>${shortDate(d)}</b> · Body Battery ${x.bbMin ?? '—'} → ${x.bbMax ?? '—'}`, segs: [{ v: x.bbMin || 0, color: 'transparent' }, { v: Math.max(0, (x.bbMax || 0) - (x.bbMin || 0)), color: 'var(--teal)' }] }; });
  const bbLast = lastWith(days, 'bbMax');

  return `
  <div class="card m-call" style="--call:${{ go: 'var(--green)', reduce: 'var(--yellow)', z2: 'var(--orange)', rest: 'var(--red)' }[r.level]}">
    <div class="m-call-k">Recovery read</div>
    <div class="m-call-s" style="margin:0">${r.text}</div>
  </div>

  <div class="card m-card">
    <div class="m-row"><div class="card-title">HRV · 30 days</div><div class="card-meta">${r.last?.hrv ?? '—'} ms last night</div></div>
    ${hrvTake}
    ${lineChart({ points: hrvPts, band, avg: hrvAvg, color: 'var(--green)', read: hrvPts[hrvPts.length - 1].tip, height: 130 })}
    ${legend([['var(--green)', 'Nightly'], ['rgba(52,211,153,.18)', 'Garmin baseline'], ['var(--green);height:3px', '7-day avg']])}
  </div>

  <div class="card m-card">
    <div class="m-row"><div class="card-title">Sleep · 14 nights</div><div class="card-meta">${r.sleepLast?.sleepScore ? 'score ' + r.sleepLast.sleepScore : ''}</div></div>
    ${sleepTake}
    ${barChart({ bars: sleepBars, target: 7, read: sleepBars[sleepBars.length - 1].tip, height: 120 })}
    ${legend([['#3B5BDB', 'Deep'], ['#A78BFA', 'REM'], ['#4F8EF7', 'Light'], ['transparent;border-top:2px dashed var(--text-dim);height:0', '7 h']])}
  </div>

  <div class="card m-card">
    <div class="card-title">Resting heart rate · 30 days</div>
    ${rhrTake}
    ${lineChart({ points: rhrPts, color: 'var(--red)', read: rhrPts[rhrPts.length - 1].tip, height: 100 })}
  </div>

  <div class="card m-card">
    <div class="m-row"><div class="card-title">Body Battery · 14 days</div><div class="card-meta">${bbLast ? `charged to ${bbLast.bbMax}` : ''}</div></div>
    ${barChart({ bars: bbBars, read: bbBars[bbBars.length - 1].tip, height: 90 })}
    <div class="g-s">Bar runs from the day's low to its high. Charging under 60 overnight is a soft signal to go easier.</div>
  </div>

  <div class="card m-card m-settings">
    <div class="card-title">Data</div>
    <div class="g-s">Garmin updated ${new Date(g.generated).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' })} · pulls ~3:40am, 4:40am, 1:15pm.</div>
    <div class="m-links">
      <a href="#" onclick="toggleGhSetup();window.scrollTo(0,0);return false;">${ghToken() ? 'Refresh settings' : 'Set up Refresh button'}</a>
      <a href="#" onclick="lockGarmin();return false;">Lock Garmin on this device</a>
      <a href="#" onclick="clearCredentials();return false;">Reset Intervals login</a>
    </div>
  </div>`;
}

function routineState() { try { return JSON.parse(localStorage.getItem('routine_' + todayIso) || '[]'); } catch (e) { return []; } }
function toggleRoutine(i) {
  const s = new Set(routineState());
  s.has(i) ? s.delete(i) : s.add(i);
  localStorage.setItem('routine_' + todayIso, JSON.stringify([...s]));
  if (s.size === BACK_ROUTINE.length && !state.backDraft.routine) { state.backDraft.routine = true; state.backSaved = false; state.backMsg = 'Routine complete — save your check-in.'; }
  render();
}

function mBack() {
  const done = new Set(routineState());
  const hist = backHistory(30);
  const painColor = p => p >= 6 ? 'var(--red)' : p >= 3 ? 'var(--yellow)' : 'var(--green)';
  const bars = hist.map(h => ({
    label: new Date(h.d + 'T12:00:00').toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }),
    tip: h.e ? `<b>${shortDate(h.d)}</b> · pain ${h.e.pain}/10${h.e.reach.length ? ' · ' + h.e.reach.join(', ') : ''}${h.e.sts ? ' · sit-to-stand hurt' : ''}${h.e.routine ? ' · routine ✓' : ''}` : `<b>${shortDate(h.d)}</b> · not logged`,
    segs: [{ v: h.e ? Math.max(0.3, h.e.pain) : 0, color: h.e ? painColor(h.e.pain) : 'transparent' }],
  }));
  const logged = hist.filter(h => h.e);
  const routineDays = logged.filter(h => h.e.routine).length;
  const wk = a => a.length ? +(a.reduce((s, h) => s + h.e.pain, 0) / a.length).toFixed(1) : null;
  const last7 = logged.filter(h => h.d >= daysAgoIso(6)), prev7 = logged.filter(h => h.d < daysAgoIso(6) && h.d >= daysAgoIso(13));
  const trendTake = last7.length >= 3 && prev7.length >= 3
    ? (wk(last7) < wk(prev7) - 0.5 ? takeaway('good', `Averaging ${wk(last7)}/10 this week vs ${wk(prev7)} last week. The routine is working.`)
      : wk(last7) > wk(prev7) + 0.5 ? takeaway('bad', `Averaging ${wk(last7)}/10 vs ${wk(prev7)} last week — worse. If that holds another week, book a PT or sports med visit.`)
      : takeaway('neutral', `Flat at ${wk(last7)}/10. Give it the full 2–3 weeks, then reassess.`))
    : takeaway('neutral', `${logged.length} of 30 days logged. Log daily for two weeks and this turns into a trend.`);

  return `
  ${renderBackCheckpoint()}
  ${renderBackLog(false)}

  <div class="card m-card">
    <div class="m-row"><div class="card-title">Today's routine</div><div class="card-meta">${done.size}/${BACK_ROUTINE.length} · ~12 min</div></div>
    ${BACK_ROUTINE.map((t, i) => `<div class="exercise ${done.has(i) ? 'checked' : ''}" onclick="toggleRoutine(${i})"><div class="exercise-check ${done.has(i) ? 'checked' : ''}"></div><div class="exercise-info"><div class="exercise-name" style="font-size:13.5px">${t}</div></div></div>`).join('')}
    <div class="g-s" style="margin-top:8px">Gentle tension, never more symptoms. Anything that pushes pain further down the leg is out.</div>
  </div>

  <div class="card m-card">
    <div class="m-row"><div class="card-title">Pain · 30 days</div><div class="card-meta">${routineDays} routine days</div></div>
    ${trendTake}
    ${barChart({ bars, read: bars[bars.length - 1].tip, height: 100 })}
  </div>

  <div class="card m-card">
    <details class="m-rules"><summary class="card-title">Rules while it's irritated</summary>
      <ul>
        <li>Pain stays in the back or retreats from the leg → train.</li>
        <li>Pain spreads further down the leg → stop that movement.</li>
        <li>Pain 6+ or reaching the knee → routine + easy Zone 2 only.</li>
        <li>No heavy trap bar, RDL or back squat until a full week at 0–2.</li>
        <li>No dumbbell kick-ups — landmine or Smith incline instead.</li>
        <li>Sit-to-stand: edge of seat, brace, drive through both legs. Up every 30–45 min at work.</li>
        <li>Not clearly better by ~Dec 12, or worse at any point → PT or sports med.</li>
      </ul>
    </details>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════
//  RUN MECHANICS — climb cadence, HR drift, Z2 discipline
//  Per-second streams come from Intervals.icu (already synced from the
//  watch). Each run is analysed once and cached on this device.
// ════════════════════════════════════════════════════════════════════
const RM_KEY = 'runmech_v1';
state.runMech = (() => { try { return JSON.parse(localStorage.getItem(RM_KEY) || '{}'); } catch (e) { return {}; } })();
state.runMechStatus = '';
let runMechLoading = false;
const runMechTried = new Set();  // never re-request a run in the same session

function analyseRunStreams(streams) {
  const get = (...names) => { for (const n of names) { const s = streams.find(x => x.type === n); if (s && s.data && s.data.length) return s.data; } return null; };
  const t = get('time'), hr = get('heartrate'), cadRaw = get('cadence'), dist = get('distance');
  const alt = get('fixed_altitude', 'altitude'), gradeS = get('grade_smooth'), velS = get('velocity_smooth');
  if (!t || !hr || t.length < 300) return null;
  const n = t.length;

  // speed (m/s)
  const v = velS || (dist ? t.map((_, i) => i ? Math.max(0, (dist[i] - dist[i - 1]) / Math.max(1, t[i] - t[i - 1])) : 0) : null);
  // grade (%) over a ~40 m window when no smoothed grade is provided
  let grade = gradeS;
  if (!grade && alt && dist) {
    grade = new Array(n).fill(0);
    let j = 0;
    for (let i = 0; i < n; i++) {
      while (j < i && dist[i] - dist[j] > 40) j++;
      const dd = dist[i] - dist[j];
      grade[i] = dd > 15 ? (alt[i] - alt[j]) / dd * 100 : (i ? grade[i - 1] : 0);
    }
  }
  // running cadence: FIT stores strides/min (~85); convert to steps/min
  let cad = cadRaw;
  if (cad) {
    const nz = cad.filter(c => c > 30).sort((a, b) => a - b);
    const med = nz.length ? nz[Math.floor(nz.length / 2)] : 0;
    if (med && med < 120) cad = cad.map(c => c * 2);
  }

  let moving = 0, over150 = 0, flatT = 0, flatC = 0, climbT = 0, climbC = 0;
  const steady = [];  // [dtCumulative, v, hr] for flat-ish moving samples
  for (let i = 1; i < n; i++) {
    const dt = Math.min(5, t[i] - t[i - 1]);
    if (dt <= 0) continue;
    const isMoving = v ? v[i] > 0.8 : true;
    if (!isMoving) continue;
    moving += dt;
    if (hr[i] > 150) over150 += dt;
    const g = grade ? grade[i] : 0;
    const c = cad ? cad[i] : 0;
    if (c > 100) {
      if (g >= 6) { climbT += dt; climbC += c * dt; }
      else if (Math.abs(g) < 2) { flatT += dt; flatC += c * dt; }
    }
    if (v && hr[i] > 80 && Math.abs(g) < 4) steady.push([moving, v[i], hr[i], dt]);
  }
  if (moving < 600) return null;

  // aerobic decoupling: efficiency (speed / HR) first half vs second half
  let decouple = null;
  if (steady.length > 200 && moving >= 25 * 60) {
    const half = moving / 2;
    const ef = part => { let sv = 0, sh = 0, st = 0; part.forEach(([, sp, h, dt]) => { sv += sp * dt; sh += h * dt; st += dt; }); return st > 300 ? (sv / st) / (sh / st) : null; };
    const a = ef(steady.filter(x => x[0] <= half)), b = ef(steady.filter(x => x[0] > half));
    if (a && b) decouple = Math.round((a - b) / a * 1000) / 10;
  }
  return {
    mins: Math.round(moving / 60),
    cadFlat: flatT >= 120 ? Math.round(flatC / flatT) : null,
    cadClimb: climbT >= 90 ? Math.round(climbC / climbT) : null,
    climbMins: Math.round(climbT / 60 * 10) / 10,
    decouple,
    over150: Math.round(over150 / moving * 100),
  };
}

async function loadRunMechanics() {
  if (runMechLoading || !state.athleteId || !state.apiKey) return;
  const runs = (state.activities || [])
    .filter(a => /run/i.test(a.type || '') && (a.moving_time || 0) >= 15 * 60)
    .sort((a, b) => (b.start_date_local || '').localeCompare(a.start_date_local || ''))
    .slice(0, 12);
  const todo = runs.filter(a => !state.runMech[a.id] && !runMechTried.has(a.id));
  todo.forEach(a => runMechTried.add(a.id));
  if (!todo.length) return;
  runMechLoading = true;
  const auth = 'Basic ' + btoa('API_KEY:' + state.apiKey);
  let done = 0;
  for (const a of todo) {
    state.runMechStatus = `Analysing runs… ${done + 1}/${todo.length}`;
    const el = document.getElementById('rm-status'); if (el) el.textContent = state.runMechStatus;
    try {
      const r = await fetch(`https://intervals.icu/api/v1/activity/${a.id}/streams.json?types=time,heartrate,cadence,distance,altitude,fixed_altitude,grade_smooth,velocity_smooth`, { headers: { Authorization: auth } });
      if (r.ok) {
        const res = analyseRunStreams(await r.json());
        state.runMech[a.id] = res ? { ...res, date: (a.start_date_local || '').slice(0, 10), name: a.name || 'Run' } : { skip: true };
      }
    } catch (e) { /* try again next load */ }
    done++;
  }
  try { localStorage.setItem(RM_KEY, JSON.stringify(state.runMech)); } catch (e) {}
  state.runMechStatus = '';
  runMechLoading = false;
  if (state.tab === 'train') render();
}

function renderRunMechanics() {
  const runs = Object.values(state.runMech).filter(r => r && !r.skip && r.date).sort((a, b) => a.date.localeCompare(b.date)).slice(-12);
  if (!runs.length) {
    return `<div class="card m-card"><div class="card-title">Run mechanics</div>
      <div class="g-s" id="rm-status" style="margin-top:6px">${state.runMechStatus || (runMechLoading ? 'Analysing runs…' : 'No runs of 15+ minutes in the last 6 months yet. Climb cadence and HR drift show up after your next run.')}</div></div>`;
  }
  const avg = (arr) => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const last5 = runs.slice(-5);
  const climb = avg(last5.map(r => r.cadClimb)), flat = avg(last5.map(r => r.cadFlat));
  const drift = avg(last5.map(r => r.decouple)), over = avg(last5.map(r => r.over150));
  const tone = (v, good, warn, lowerBetter = false) => v == null ? 'var(--text)' : (lowerBetter ? v <= good : v >= good) ? 'var(--green)' : (lowerBetter ? v <= warn : v >= warn) ? 'var(--yellow)' : 'var(--red)';

  const takes = [];
  if (climb != null) takes.push(climb >= 168 ? takeaway('good', `Climbing at ${Math.round(climb)} spm — holding cadence on grades. Keep the 170 metronome.`)
    : takeaway(climb >= 160 ? 'warn' : 'bad', `Climbing at ${Math.round(climb)} spm vs 170 target${flat ? ` (${Math.round(flat)} on the flat)` : ''}. Shorter, quicker steps on grades — keep the metronome on and let pace drop, not cadence.`));
  if (drift != null) takes.push(drift < 5 ? takeaway('good', `HR drift ${drift.toFixed(1)}% — aerobic base is holding. Add 10 minutes to the next Z2 run.`)
    : takeaway(drift < 8 ? 'warn' : 'bad', `HR drift ${drift.toFixed(1)}% (target under 5%). Base is still thin — keep runs easier and steadier rather than longer.`));
  if (over != null) takes.push(over <= 15 ? takeaway('good', `${Math.round(over)}% of run time over 150 bpm. Zone 2 discipline is good.`)
    : takeaway(over <= 35 ? 'warn' : 'bad', `${Math.round(over)}% of run time over 150 bpm. Walk the climbs when HR passes 150.`));

  const label = r => new Date(r.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
  const cadPts = runs.map(r => ({ label: label(r), v: r.cadClimb, color: r.cadClimb == null ? null : r.cadClimb >= 168 ? 'var(--green)' : r.cadClimb >= 160 ? 'var(--yellow)' : 'var(--red)',
    tip: `<b>${shortDate(r.date)}</b> · ${esc(r.name)} · climb ${r.cadClimb ?? '—'} spm${r.climbMins ? ` (${r.climbMins} min on 6%+)` : ''} · flat ${r.cadFlat ?? '—'} spm` }));
  const driftBars = runs.map(r => ({ label: label(r), tip: `<b>${shortDate(r.date)}</b> · ${esc(r.name)} · drift ${r.decouple == null ? '— (under 25 min)' : r.decouple + '%'} · ${r.over150}% over 150 · ${r.mins} min`,
    segs: [{ v: r.decouple == null ? 0 : Math.max(0.2, Math.abs(r.decouple)), color: r.decouple == null ? 'transparent' : r.decouple < 5 ? 'var(--green)' : r.decouple < 8 ? 'var(--yellow)' : 'var(--red)' }] }));
  const lastRun = runs[runs.length - 1];

  return `
  <div class="card m-card">
    <div class="m-row"><div class="card-title">Run mechanics · last ${runs.length} runs</div><div class="card-meta" id="rm-status">${state.runMechStatus}</div></div>
    <div class="m-tiles m-tiles-3">
      <div class="m-tile"><div class="g-k">Climb cad</div><div class="m-tile-v" style="color:${tone(climb, 168, 160)}">${climb ? Math.round(climb) : '—'}<small>spm</small></div><div class="g-s">6%+ grade · 170</div></div>
      <div class="m-tile"><div class="g-k">HR drift</div><div class="m-tile-v" style="color:${tone(drift, 5, 8, true)}">${drift != null ? drift.toFixed(1) : '—'}<small>%</small></div><div class="g-s">target &lt; 5%</div></div>
      <div class="m-tile"><div class="g-k">Over 150</div><div class="m-tile-v" style="color:${tone(over, 15, 35, true)}">${over != null ? Math.round(over) : '—'}<small>%</small></div><div class="g-s">of run time</div></div>
    </div>
    ${takes.join('')}
    <div class="g-row-title" style="margin-top:6px"><span>Climb cadence per run</span><span>dashed = 170</span></div>
    ${lineChart({ points: cadPts, color: 'var(--orange)', target: 170, read: cadPts[cadPts.length - 1].tip, height: 110 })}
    <div class="g-row-title" style="margin-top:12px"><span>HR drift per run</span><span>dashed = 5%</span></div>
    ${barChart({ bars: driftBars, target: 5, read: driftBars[driftBars.length - 1].tip, height: 90 })}
    <div class="g-s" style="margin-top:6px">Last run ${shortDate(lastRun.date)}: ${lastRun.mins} min, flat ${lastRun.cadFlat ?? '—'} spm, climbs ${lastRun.cadClimb ?? '—'} spm. Averages use the last 5 runs. Drift needs 25+ minutes.</div>
  </div>`;
}

// ── 3-week back checkpoint (Dec 12) ─────────────────────────────────
const BACK_START = '2026-11-25', BACK_CHECK = '2026-12-12';
function renderBackCheckpoint() {
  const daysLeft = Math.round((new Date(BACK_CHECK + 'T12:00:00') - new Date(todayIso + 'T12:00:00')) / 86400000);
  const span = [];
  for (let d = new Date(BACK_START + 'T12:00:00'); isoLocal(d) <= todayIso; d.setDate(d.getDate() + 1)) span.push(isoLocal(d));
  const logged = span.map(d => ({ d, e: backEntryFor(d) })).filter(x => x.e && x.e.pain != null);
  const routine = logged.filter(x => x.e.routine).length;
  const mean = a => a.length ? a.reduce((s, x) => s + x.e.pain, 0) / a.length : null;
  const first = mean(logged.slice(0, 7)), last = mean(logged.slice(-7));
  const kneeLast = logged.slice(-7).some(x => x.e.reach.includes('Knee'));

  if (daysLeft > 0) {
    return `<div class="card m-card m-check">
      <div class="m-row"><div class="card-title">Checkpoint · Dec 12</div><div class="card-meta">${daysLeft} day${daysLeft === 1 ? '' : 's'}</div></div>
      <div class="g-s">On Dec 12 this card says whether the routine is working or it's time for a PT. So far: ${logged.length}/${span.length} days logged, routine on ${routine}. ${logged.length < span.length ? 'Log every day so the verdict is real.' : 'Keep it up.'}</div>
    </div>`;
  }
  let verdict;
  if (logged.length < 10) verdict = takeaway('warn', `Only ${logged.length} days logged since Nov 25 — not enough to call it. If it doesn't feel clearly better, book the PT anyway.`);
  else if (last <= 2 && !kneeLast) verdict = takeaway('good', `Working. Down to ${last.toFixed(1)}/10 from ${first.toFixed(1)}. Keep the routine; once you have a full week at 0–2, start bringing back light trap bar work.`);
  else if (last <= first - 1.5 && !kneeLast) verdict = takeaway('good', `Improving: ${first.toFixed(1)} → ${last.toFixed(1)}/10. Give it two more weeks, same plan.`);
  else verdict = takeaway('bad', `Not clearly better: ${first.toFixed(1)} → ${last.toFixed(1)}/10${kneeLast ? ', still reaching the knee' : ''}. Stretching alone isn't fixing this — book a physical therapist or sports med visit this week.`);
  return `<div class="card m-card m-check">
    <div class="m-row"><div class="card-title">3-week checkpoint</div><div class="card-meta">${logged.length} days · routine ${routine}</div></div>
    ${verdict}
  </div>`;
}

fetchData();
</script>
</body>
</html>
