// ══════════════════════════════════════════════════════════════════
//  SHARED GAUGE / RING SVG FACTORY
//  Two modes:
//    'ring'  — full circle (used in Health Snapshot readiness block)
//    'arc'   — half-circle opening upward (used in Coach's Read row)
//
//  Both embed number + unit as SVG <text> — zero DOM positioning hacks.
//  Stroke weight and corner style are identical in both modes.
// ══════════════════════════════════════════════════════════════════
function makeGaugeSvg({ mode='arc', value, unit='', pct, color, size, delay='0s' }) {
  const STROKE = 5;          // uniform stroke weight everywhere
  const font   = "Inter,-apple-system,sans-serif";

  if (mode === 'ring') {
    // ── Full-circle ring ──────────────────────────────────────────
    // size = diameter. Centre at (size/2, size/2).
    const S   = size || 76;
    const cx  = S / 2, cy = S / 2;
    const R   = (S / 2) - STROKE - 1;           // fits inside SVG
    const C   = 2 * Math.PI * R;
    const off = pct != null ? C * (1 - Math.min(Math.max(pct,0),1)) : C;
    // Rotate start to top (-90°) using transform on the fill circle
    const numSize  = S < 60 ? 15 : 20;
    const unitSize = S < 60 ? 9  : 11;
    const numY     = cy + numSize * 0.36;        // optical vertical centre
    const unitY    = cy + numSize * 0.36 + unitSize + 2;
    const showUnit = unit && S >= 70;
    return `<svg class="readiness-ring" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <circle cx="${cx}" cy="${cy}" r="${R}"
        fill="none" stroke="var(--border)" stroke-width="${STROKE}" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="${R}"
        fill="none" stroke="${color}" stroke-width="${STROKE}" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})"
        style="transition:stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1);"/>
      <text x="${cx}" y="${numY}" text-anchor="middle"
        font-family="${font}" font-size="${numSize}" font-weight="800"
        letter-spacing="-0.5" fill="${color}">${value}</text>
      ${showUnit ? `<text x="${cx}" y="${unitY}" text-anchor="middle"
        font-family="${font}" font-size="${unitSize}" font-weight="500"
        fill="var(--text-dim)">${unit}</text>` : ''}
    </svg>`;
  }

  // ── Half-arc (opens upward) ───────────────────────────────────
  // Canvas 84×62. Arc centre cx=42, cy=50. Radius=33.
  // Track spans bottom-left (180°) to bottom-right (0°).
  const S  = 84, H = 62;
  const cx = 42, cy = 50, R = 33;
  const tx1 = cx - R, ty = cy;   // left end
  const tx2 = cx + R;             // right end
  const clamp = Math.min(Math.max(pct || 0, 0), 1);
  // Fill sweeps left-to-right along the top of the arc
  const endAngle = Math.PI - Math.PI * clamp;  // 180° → 0°
  const fx = cx + R * Math.cos(endAngle);
  const fy = cy + R * Math.sin(endAngle);
  const largeArc = clamp > 0.5 ? 1 : 0;
  const arcLen   = (Math.PI * R * clamp).toFixed(1);

  const activePath = clamp > 0.02
    ? `<path d="M ${tx1} ${ty} A${R} ${R} 0 ${largeArc} 1 ${fx.toFixed(1)} ${fy.toFixed(1)}"
         fill="none" stroke="${color}" stroke-width="${STROKE}" stroke-linecap="round"
         stroke-dasharray="${arcLen}" stroke-dashoffset="${arcLen}"
         style="animation:arcDraw 0.6s cubic-bezier(0.4,0,0.2,1) ${delay} forwards;"/>`
    : '';

  // Number sits visually centred inside the arc opening; unit sits just below.
  const numStr  = String(value);
  const numSize = numStr.length >= 4 ? 18 : numStr.length === 3 ? 21 : 23;
  const numY  = 40;   // optical centre of the arc bowl
  const unitY = 56;   // clear gap below the number

  return `<svg class="cr-gauge-svg" width="${S}" height="${H}" viewBox="0 0 ${S} ${H}">
    <path d="M ${tx1} ${ty} A${R} ${R} 0 1 1 ${tx2} ${ty}"
      fill="none" stroke="var(--border)" stroke-width="${STROKE}" stroke-linecap="round"/>
    ${activePath}
    <text x="${cx}" y="${numY}" text-anchor="middle" dominant-baseline="middle"
      font-family="${font}" font-size="${numSize}" font-weight="800"
      letter-spacing="-0.5" fill="${color}">${value}</text>
    <text x="${cx}" y="${unitY}" text-anchor="middle" dominant-baseline="middle"
      font-family="${font}" font-size="9.5" font-weight="600"
      letter-spacing="0.02em" fill="var(--text-dim)">${unit}</text>
  </svg>`;
}

// Backwards-compat shims
function crArcSvg(numText, unitText, pct, color, delay='0s') {
  return makeGaugeSvg({ mode:'arc', value:numText, unit:unitText, pct, color, delay });
}
function ringGaugeSvg(value, unit, pct, color, size=76) {
  return makeGaugeSvg({ mode:'ring', value, unit, pct, color, size });
}

// Vertical-bar metric tile for the Coach's Read row.
// Robust: pure HTML/CSS, handles missing data and negative values cleanly.
//   value   — display string (e.g. "44", "107", "-9", "—")
//   unit    — small label under the number ("/ 100", "ms", "TSB")
//   pct     — 0..1 fill fraction (null = empty track)
//   color   — fill + number colour
//   tick    — optional 0..1 position for a reference marker (used by Form)
function crMetricBar(value, unit, pct, color, tick=null) {
  const clamped = pct == null ? 0 : Math.min(Math.max(pct, 0), 1);
  const fillPct = (clamped * 100).toFixed(1);
  const tickHtml = tick != null
    ? `<div class="cr-bar-tick" style="bottom:${(Math.min(Math.max(tick,0),1)*100).toFixed(1)}%"></div>`
    : '';
  return `
    <div class="cr-metric">
      <div class="cr-metric-readout">
        <div class="cr-metric-value" style="color:${color}">${value}</div>
        <div class="cr-metric-unit">${unit}</div>
      </div>
      <div class="cr-bar-track">
        ${tickHtml}
        <div class="cr-bar-fill" style="background:${color};height:${pct == null ? 0 : fillPct}%"></div>
      </div>
    </div>`;
}


function crSignalDot(level) {
  // level: 'green' | 'yellow' | 'orange' | 'red' | 'blue' | 'gray'
  return `<div class="cr-signal-dot ${level}"></div>`;
}

function crSignalRow(dotColor, title, sub, valueHtml) {
  return `
    <div class="cr-signal">
      ${crSignalDot(dotColor)}
      <div class="cr-signal-content">
        <div class="cr-signal-title">${title}</div>
        ${sub ? `<div class="cr-signal-sub">${sub}</div>` : ''}
      </div>
      ${valueHtml ? `<div class="cr-signal-value" style="color:${dotColor==='green'?'var(--green)':dotColor==='red'?'var(--red)':dotColor==='orange'?'var(--orange)':dotColor==='yellow'?'var(--yellow)':'var(--text-muted)'}">${valueHtml}</div>` : ''}
    </div>`;
}

function crSparkline(values, color, w=44, h=20) {
  const nums = (values || []).filter(v => typeof v === 'number' && isFinite(v));
  if (nums.length < 2) return '';
  const min = Math.min(...nums), max = Math.max(...nums);
  const range = max - min || 1;
  const pts = nums.map((v, i) => {
    const x = (i / (nums.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 2) - 1;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function crTodayDirective(readiness, hrv, feel, acwr) {
  // Returns { label, color, sub } — the single most important instruction for today
  if (feel === 'beat') return { label: 'Rest Day', color: 'var(--red)', sub: 'You marked yourself beat. Non-negotiable.' };
  if (hrv != null && hrv < 40) return { label: 'Rest Day', color: 'var(--red)', sub: `HRV ${Math.round(hrv)}ms — below 40ms floor.` };
  if (hrv != null && hrv < 60) return { label: 'Zone 2 Only', color: 'var(--orange)', sub: `HRV ${Math.round(hrv)}ms — low. No intensity today.` };
  if (feel === 'sore') return { label: 'Active Recovery', color: 'var(--orange)', sub: 'Soreness logged — session modified.' };
  // Low readiness — explain the driver: high load vs poor recovery look different
  if (readiness != null && readiness < 40) {
    if (acwr != null && acwr > 1.3 && hrv != null && hrv >= 90) {
      return { label: 'Pull Back Load', color: 'var(--orange)', sub: `HRV strong (${Math.round(hrv)}ms) but ACWR ${acwr.toFixed(2)} is over cap — this is a load problem, not a recovery one. Easy days until ACWR drops under 1.3.` };
    }
    return { label: 'Rest or Z2 Only', color: 'var(--red)', sub: `Readiness ${readiness}/100 — body needs recovery.` };
  }
  if (readiness != null && readiness < 60) return { label: 'Reduce 10–15%', color: 'var(--orange)', sub: `Readiness ${readiness}/100 — cap intensity.` };
  if (hrv != null && hrv < 85) return { label: 'Reduce Intensity', color: 'var(--yellow)', sub: `HRV ${Math.round(hrv)}ms — below 85ms threshold.` };
  if (readiness != null && readiness >= 80) return { label: 'Full Send', color: 'var(--green)', sub: `Readiness ${readiness}/100 — green light.` };
  return { label: 'Execute as Planned', color: 'var(--text-muted)', sub: readiness != null ? `Readiness ${readiness}/100` : 'Data syncing…' };
}

// ── Main render ────────────────────────────────────────────────────────────────

function renderCoachCard(latest, history, activities) {
  const { ctl, atl, tsb, acwr } = fitnessSnapshot(history);
  const hrv  = getField(latest, 'hrv', 'hrvWeeklyAverage');
  const sleep = getField(latest, 'sleepSecs');
  const rhr  = getField(latest, 'restingHR');

  const baseReadiness    = computeReadiness(latest, history);
  const adjustedReadiness = applyFeelToReadiness(baseReadiness, state.feel);
  const directive = crTodayDirective(adjustedReadiness, hrv, state.feel, acwr);

  // HRV sparkline (14d)
  const hrvHistory = history.slice(-14).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
  const hrvTrend7  = (() => {
    const r = history.slice(-7).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
    const p = history.slice(-14,-7).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
    if (!r.length || !p.length) return null;
    return (r.reduce((a,b)=>a+b,0)/r.length) - (p.reduce((a,b)=>a+b,0)/p.length);
  })();

  // Load trend
  const loadPct = (() => {
    const r = history.slice(-7).map(d => getField(d, 'atl')).filter(v => v != null);
    const p = history.slice(-14,-7).map(d => getField(d, 'atl')).filter(v => v != null);
    if (!r.length || !p.length) return null;
    const ra = r.reduce((a,b)=>a+b,0)/r.length;
    const pa = p.reduce((a,b)=>a+b,0)/p.length;
    return Math.round(((ra - pa) / pa) * 100);
  })();

  // ── GAUGE ROW ─────────────────────────────────────────────────────────────
  // Cell 1: Readiness
  const readPct = adjustedReadiness != null ? adjustedReadiness / 100 : 0;
  const readColor = adjustedReadiness == null ? 'var(--text-dim)'
    : adjustedReadiness >= 80 ? 'var(--green)'
    : adjustedReadiness >= 60 ? 'var(--yellow)'
    : adjustedReadiness >= 40 ? 'var(--orange)'
    : 'var(--red)';
  const readLabel = adjustedReadiness == null ? '—'
    : adjustedReadiness >= 80 ? 'Go Hard'
    : adjustedReadiness >= 60 ? 'Moderate'
    : adjustedReadiness >= 40 ? 'Zone 2'
    : 'Rest';

  // Cell 2: HRV
  // Map HRV to arc: 40ms=0, 111ms=1 (Clayton's range)
  const hrvPct = hrv != null ? Math.min(Math.max((hrv - 40) / 71, 0), 1) : 0;
  const hrvColor = hrv == null ? 'var(--text-dim)'
    : hrv >= 90 ? 'var(--green)'
    : hrv >= 80 ? 'var(--yellow)'
    : hrv >= 60 ? 'var(--orange)'
    : 'var(--red)';
  const hrvLabel = hrv == null ? '—'
    : hrv >= 90 ? 'Strong'
    : hrv >= 80 ? 'Normal'
    : hrv >= 60 ? 'Stressed'
    : 'Low';

  // Cell 3: Form (TSB mapped: -30=0, +20=1)
  const tsbPct = tsb != null ? Math.min(Math.max((tsb + 30) / 50, 0), 1) : 0;
  const tsbColor = tsb == null ? 'var(--text-dim)'
    : tsb > 5  ? 'var(--green)'
    : tsb > -10 ? 'var(--primary)'
    : tsb > -20 ? 'var(--orange)'
    : 'var(--red)';
  const tsbLabel = tsb == null ? '—'
    : tsb > 5  ? 'Fresh'
    : tsb > -10 ? 'Neutral'
    : tsb > -20 ? 'Building'
    : 'Fatigued';

  const readNum  = adjustedReadiness != null ? String(adjustedReadiness) : '—';
  const hrvNum   = hrv != null ? String(Math.round(hrv)) : '—';
  const tsbNum   = tsb != null ? (tsb > 0 ? '+' : '') + String(Math.round(tsb)) : '—';

  const gaugeRow = `
    <div class="cr-gauge-row">
      <div class="cr-gauge-cell">
        <div class="cr-gauge-label">Readiness</div>
        ${crMetricBar(readNum, '/ 100', adjustedReadiness != null ? readPct : null, readColor)}
        <div class="cr-gauge-status" style="color:${readColor}">${readLabel}</div>
      </div>
      <div class="cr-gauge-cell">
        <div class="cr-gauge-label">HRV</div>
        ${crMetricBar(hrvNum, 'ms', hrv != null ? hrvPct : null, hrvColor)}
        <div class="cr-gauge-status" style="color:${hrvColor}">${hrvLabel}</div>
      </div>
      <div class="cr-gauge-cell">
        <div class="cr-gauge-label">Form</div>
        ${crMetricBar(tsbNum, 'TSB', tsb != null ? tsbPct : null, tsbColor, 0.6)}
        <div class="cr-gauge-status" style="color:${tsbColor}">${tsbLabel}</div>
      </div>
    </div>`;

  // ── SIGNAL ROWS ───────────────────────────────────────────────────────────
  const signals = [];

  // Today's directive — always first
  signals.push(crSignalRow(
    directive.color === 'var(--green)' ? 'green'
    : directive.color === 'var(--red)' ? 'red'
    : directive.color === 'var(--orange)' ? 'orange'
    : directive.color === 'var(--yellow)' ? 'yellow' : 'gray',
    `Today: <span style="color:${directive.color};font-weight:700">${directive.label}</span>`,
    directive.sub,
    null
  ));

  // ── TODAY'S LOGGED WORK — what Clayton actually did vs recommendation ──────
  const todayActs = activitiesForDay(activities || [], new Date());
  let todayCostTotal = 0;
  if (todayActs.length) {
    todayCostTotal = todayActs.reduce((sum, act) => sum + activityRecoveryCost(act), 0);
    const tcl = costLabel(Math.min(100, todayCostTotal));
    const actNames = todayActs.map(act => {
      const m = act.moving_time ? Math.round(act.moving_time / 60) : 0;
      const nm = (act.type || 'Session');
      return `${nm}${m ? ` ${m}min` : ''}`;
    }).join(' + ');

    // Did the logged work contradict the recommendation?
    const wasRestRecommended = (adjustedReadiness != null && adjustedReadiness < 40)
      || state.feel === 'beat'
      || (hrv != null && hrv < 85 && adjustedReadiness != null && adjustedReadiness < 55);

    let dot, title, sub;
    if (wasRestRecommended && todayCostTotal >= 35) {
      dot = 'orange';
      title = `Logged today: <span style="color:var(--orange);font-weight:700">${actNames}</span>`;
      sub = `You trained on a low-readiness day — that's a real recovery cost (${Math.min(100,todayCostTotal)}/100). Not a mistake, but bank extra sleep tonight and make tomorrow genuinely easy. Re-check HRV in the morning.`;
    } else if (wasRestRecommended && todayCostTotal < 35) {
      dot = 'green';
      title = `Logged today: <span style="color:var(--green);font-weight:700">${actNames}</span>`;
      sub = `Light enough (${Math.min(100,todayCostTotal)}/100 cost) that it won't undo recovery — smart way to move on a low day without digging the hole deeper.`;
    } else if (todayCostTotal >= 60) {
      dot = 'orange';
      title = `Logged today: ${actNames}`;
      sub = `Heavy day — ${Math.min(100,todayCostTotal)}/100 recovery cost. Expect HRV to dip tomorrow; protect the next session.`;
    } else {
      dot = 'green';
      title = `Logged today: ${actNames}`;
      sub = `${tcl.word} recovery cost (${Math.min(100,todayCostTotal)}/100). Tap any activity below for the full breakdown.`;
    }
    signals.push(crSignalRow(dot, title, sub, null));
  }

  // Fitness (CTL) vs baseline
  if (ctl != null) {
    const delta = Math.round((ctl - CTL_CONFIG.baseline) * 10) / 10;
    const sign = delta >= 0 ? '+' : '';
    const dot = delta >= 5 ? 'green' : delta <= -15 ? 'orange' : 'blue';
    const ctlHistory = cleanCtlSeries(history.slice(-14).map(d => getField(d, 'ctl')));
    const spark = crSparkline(ctlHistory, 'var(--primary)');
    signals.push(crSignalRow(
      dot,
      `Fitness (CTL) ${Math.round(ctl)}`,
      `${sign}${delta} vs ${CTL_CONFIG.baseline} baseline · peak ${CTL_CONFIG.peak}`,
      `<span class="cr-spark-chip">${spark}</span>`
    ));
  }

  // ACWR
  if (acwr != null) {
    const dot = acwr > 1.3 ? 'red' : acwr > 1.2 ? 'orange' : acwr >= 0.8 ? 'green' : 'gray';
    let sub;
    if (acwr > 1.5) sub = `Well over the 1.3 cap — injury-risk territory. Hold easy/Z2 only until this drops back under 1.3.`;
    else if (acwr > 1.3) sub = 'Above 1.3 cap — back off intensity for a few days to bring it down';
    else if (acwr > 1.2) sub = 'Approaching cap — monitor, avoid stacking hard days';
    else if (acwr >= 0.8) sub = 'Optimal build zone';
    else sub = 'Low — safe to push';
    signals.push(crSignalRow(dot, `Load Ratio (ACWR) ${acwr.toFixed(2)}`, sub, loadPct != null ? `${loadPct > 0 ? '+' : ''}${loadPct}% vs wk` : null));
  }

  // HRV trend
  if (hrvTrend7 != null && Math.abs(hrvTrend7) >= 2) {
    const up = hrvTrend7 > 0;
    const dot = up ? 'green' : 'orange';
    const spark = crSparkline(hrvHistory, up ? 'var(--green)' : 'var(--orange)');
    signals.push(crSignalRow(
      dot,
      `HRV ${up ? '↑ Improving' : '↓ Under Stress'}`,
      `${up ? '+' : ''}${Math.round(hrvTrend7)}ms vs last week — recovery ${up ? 'trending better' : 'accumulating load'}`,
      `<span class="cr-spark-chip">${spark}</span>`
    ));
  }

  // Sleep
  if (sleep != null) {
    const hrs = sleep / 3600;
    const dot = hrs < 6 ? 'red' : hrs >= 7.5 ? 'green' : 'gray';
    const sub = hrs < 6 ? 'Drop intensity 15–20% today'
      : hrs >= 7.5 ? 'Solid foundation for training'
      : 'Adequate — execute as planned';
    signals.push(crSignalRow(dot, `Sleep ${hrs.toFixed(1)} hrs`, sub, null));
  }

  // Cramp / sweat warning on long efforts
  const { session } = getSessionForToday();
  if (session && (session.title.includes('MTB') || session.title.includes('Trail') || session.title.includes('Paddle'))) {
    signals.push(crSignalRow('blue', 'Hydration Protocol', '500mg sodium pre-load · 60g carb/hr · ~1,520ml sweat/90min', null));
  }

  // Race countdown
  const today2 = new Date();
  const daysLeft = Math.ceil((RACE_DATE - today2) / 86400000);
  if (daysLeft > 0) {
    const dot = daysLeft <= 14 ? 'orange' : 'gray';
    signals.push(crSignalRow(dot, `${daysLeft} days to Montecito Mash`, daysLeft <= 14 ? 'Race week protocols apply' : 'Phase 1: Base & Strength', null));
  }

  // No data fallback
  if (adjustedReadiness == null && hrv == null && sleep == null && ctl == null) {
    signals.push(crSignalRow('gray', 'No wellness data', 'Garmin sync not detected — check Intervals.icu settings', null));
  }

  const signalRows = signals.map(s => s).join('');

  // ── NARRATIVE (condensed, 1-2 sentences) ─────────────────────────────────
  const narrative = buildSummaryShort(latest, history);

  return `
    <div class="ai-summary">
      <div class="ai-summary-header">
        <div class="ai-summary-header-left">
          <div class="ai-summary-icon">C</div>
          <div class="ai-summary-title">Coach's Read</div>
        </div>
        <button class="coach-button-inline" id="coach-btn" onclick="generateSession()">⚡ Ask Claude</button>
      </div>
      ${gaugeRow}
      ${narrative ? `<div class="cr-narrative">${narrative}</div>` : ''}
      <div class="cr-signals">${signalRows}</div>
    </div>`;
}

// Short narrative — 1-2 punchy sentences replacing the wall of prose
function buildSummaryShort(latest, history) {
  const { session, override } = getSessionForToday();
  const day = dayName(new Date());
  const { tsb } = fitnessSnapshot(history);
  const hrv = getField(latest, 'hrv', 'hrvWeeklyAverage');
  const baseReadiness = computeReadiness(latest, history);
  const adjustedReadiness = applyFeelToReadiness(baseReadiness, state.feel);

  // What did Clayton actually log today?
  const todayActs = activitiesForDay(state.activities || [], new Date());
  const todayCost = todayActs.reduce((s, act) => s + activityRecoveryCost(act), 0);
  const lowReadinessDay = (adjustedReadiness != null && adjustedReadiness < 40)
    || state.feel === 'beat'
    || (hrv != null && hrv < 85 && adjustedReadiness != null && adjustedReadiness < 55);

  let parts = [];

  // If work is already logged today, the narrative reports on it rather than prescribing
  if (todayActs.length) {
    const summary = todayActs.map(act => {
      const m = act.moving_time ? Math.round(act.moving_time / 60) : 0;
      return `${act.type || 'session'}${m ? ` (${m}min)` : ''}`;
    }).join(' + ');

    if (lowReadinessDay && todayCost >= 35) {
      parts.push(`<strong>${day}</strong> — recovery flagged low, but you logged <strong>${summary}</strong>.`);
      parts.push(`That's real load on a depleted day. <span class="highlight-warn">Prioritize sleep tonight and keep tomorrow easy</span> — re-check HRV before deciding on the next hard session.`);
    } else if (lowReadinessDay) {
      parts.push(`<strong>${day}</strong> — readiness was low and you kept today's <strong>${summary}</strong> light. <span class="highlight-good">Good call</span> — movement without digging the hole deeper.`);
    } else if (todayCost >= 60) {
      parts.push(`<strong>${day}</strong> — logged <strong>${summary}</strong>, a heavy day.`);
      parts.push(`Expect HRV to dip tomorrow; make the next session genuinely controlled.`);
    } else {
      parts.push(`<strong>${day}</strong> — logged <strong>${summary}</strong>. ${session.title} was on the plan.`);
      parts.push(`Manageable load — you're clear to train as planned tomorrow.`);
    }
    return parts.join(' ');
  }

  // Nothing logged yet — prescribe as before
  if (override) {
    parts.push(`<strong>${day}</strong> — ${session.title}. <span class="highlight-warn">Original ${session.title} swapped based on check-in.</span>`);
  } else {
    parts.push(`<strong>${day}</strong> — ${session.title}.`);
  }

  if (hrv != null && hrv < 85) {
    parts.push(`HRV below threshold — auto-reduce intensity, keep HR under 150bpm on all work sets.`);
  } else if (tsb != null && tsb < -20) {
    parts.push(`Fatigue is accumulating — execute the session but leave a rep in the tank on every set.`);
  } else if (tsb != null && tsb > 5) {
    parts.push(`Fresh legs going in — this is a quality day, no sandbagging.`);
  } else if (adjustedReadiness != null && adjustedReadiness >= 80) {
    parts.push(`Body's ready. Lock in the process metrics — cadence at 170spm, HR cap 150bpm.`);
  }

  return parts.join(' ');
}

function renderAlerts(latest) {
  let alerts = '';
  const hrv = getField(latest, 'hrv', 'hrvWeeklyAverage');
  if (hrv != null && hrv < 85) alerts += `<div class="alert"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;vertical-align:-2px;margin-right:6px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>HRV at ${Math.round(hrv)}ms — below 85ms threshold. Auto-reduce intensity today.</div>`;
  if (state.feel === 'beat') alerts += `<div class="alert alert-poor"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;vertical-align:-2px;margin-right:6px;"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>You marked yourself as beat — strong recommendation to take a true rest day.</div>`;
  else if (state.feel === 'sore') alerts += `<div class="alert"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;vertical-align:-2px;margin-right:6px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Sore today — session swapped to active recovery to protect your training week.</div>`;
  return alerts;
}

function buildSummary(latest, history, activities) {
  const today = new Date();
  const day = dayName(today);
  const { session, override } = getSessionForToday();
  const baseReadiness = computeReadiness(latest, history);
  const adjustedReadiness = applyFeelToReadiness(baseReadiness, state.feel);
  const hrv = getField(latest, 'hrv', 'hrvWeeklyAverage');
  const sleep = getField(latest, 'sleepSecs');
  const { ctl, atl, tsb } = fitnessSnapshot(history);

  const recentHrv = history.slice(-7).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
  const olderHrv = history.slice(-14, -7).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
  const hrvTrend = (recentHrv.length && olderHrv.length) ? ((recentHrv.reduce((a,b)=>a+b,0)/recentHrv.length) - (olderHrv.reduce((a,b)=>a+b,0)/olderHrv.length)) : null;

  let parts = [];
  parts.push(`<strong>${day}</strong> — ${session.title}.`);
  if (override) parts.push(`<span class="highlight-warn">Original plan was ${SESSIONS[day].title} but swapped based on your check-in.</span>`);

  if (ctl != null && atl != null) {
    if (tsb > 5) parts.push(`Form is <span class="highlight-good">+${Math.round(tsb)} (fresh — fitness exceeds fatigue)</span>, fitness ${Math.round(ctl)}.`);
    else if (tsb > -10) parts.push(`Form is <strong>${Math.round(tsb)} (neutral — fitness and fatigue balanced)</strong>, fitness ${Math.round(ctl)}.`);
    else if (tsb > -20) parts.push(`Form is <span class="highlight-warn">${Math.round(tsb)} (productive — building fitness)</span>, fitness ${Math.round(ctl)}.`);
    else parts.push(`Form is <span class="highlight-bad">${Math.round(tsb)} (very fatigued)</span> — body asking for recovery.`);
  }

  if (hrv != null) {
    if (hrv < 85) parts.push(`HRV at <span class="highlight-bad">${Math.round(hrv)}ms</span> is below 85ms threshold — auto intensity reduction.`);
    else if (hrvTrend != null && hrvTrend < -3) parts.push(`HRV trending down (${Math.round(hrv)}ms) — stress accumulating.`);
    else if (hrvTrend != null && hrvTrend > 3) parts.push(`HRV trending <span class="highlight-good">up</span> at ${Math.round(hrv)}ms — recovery working.`);
  }

  if (adjustedReadiness != null) {
    if (state.feel === 'sore' || state.feel === 'beat') parts.push(`Computed readiness adjusted to <span class="highlight-warn">${adjustedReadiness}/100</span> based on your check-in.`);
    else if (adjustedReadiness >= 80) parts.push(`Readiness <span class="highlight-good">${adjustedReadiness}/100</span> — green light.`);
    else if (adjustedReadiness >= 60) parts.push(`Readiness ${adjustedReadiness}/100 — execute but cap top sets 10-15% lighter.`);
    else if (adjustedReadiness >= 40) parts.push(`Readiness <span class="highlight-warn">${adjustedReadiness}/100</span> — strongly consider Zone 2 or mobility.`);
    else parts.push(`Readiness <span class="highlight-bad">${adjustedReadiness}/100</span> — rest day, non-negotiable.`);
  }

  if (sleep != null) {
    const hrs = sleep / 3600;
    if (hrs < 6) parts.push(`Only <span class="highlight-bad">${hrs.toFixed(1)}hrs</span> sleep — drop intensity 15-20%.`);
    else if (hrs >= 7.5) parts.push(`Solid <span class="highlight-good">${hrs.toFixed(1)}hrs</span> sleep gives clean foundation today.`);
  }

  if (adjustedReadiness == null && hrv == null && sleep == null) parts.push(`<em style="color: var(--text-dim);">Wellness data not syncing from Garmin — check Intervals settings.</em>`);

  const days = Math.ceil((RACE_DATE - today) / 86400000);
  if (days < 0) { /* race passed — no countdown */ }
  else if (days <= 14) parts.push(`<span class="highlight-warn">${days} days to the Mash — race week mode.</span>`);
  else if (days <= 60) parts.push(`${days} days to the Mash — entering peaking phase soon.`);

  return parts.join(' ');
}

function toggleProto(id) {
  const toggle = document.getElementById('proto-toggle-' + id);
  const body   = document.getElementById('proto-body-' + id);
  if (!toggle || !body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  toggle.classList.toggle('open', !isOpen);
}

function protoBlock(id, label, items, emoji) {
  if (!items || !items.length) return '';
  const chevron = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="proto-toggle-chevron"><polyline points="6 9 12 15 18 9"/></svg>`;
  const listHtml = items.map(it => `<span>• ${it}</span>`).join('');
  return `
    <div id="proto-toggle-${id}" class="proto-toggle" onclick="toggleProto('${id}')">
      <div class="proto-toggle-label">
        ${emoji ? `<span>${emoji}</span>` : ''}
        ${label}
        <span class="proto-toggle-count">${items.length}</span>
      </div>
      ${chevron}
    </div>
    <div id="proto-body-${id}" class="proto-body">
      <div class="proto-body-inner">${listHtml}</div>
    </div>`;
}

function renderSession() {
  const { session, override, plannedTitle } = getSessionForToday();
  const pillClass = `pill-${session.intensity}`;
  const pillLabel = { hard: 'High Intensity', moderate: 'Moderate', easy: 'Easy / Recovery', rest: 'Rest Day' }[session.intensity];
  const day = dayName(new Date());

  const exerciseRows = session.exercises.map((ex, i) => {
    const id = `${day}-${override ? 'rec' : 'plan'}-${i}`;
    const checked = state.checkedExercises[id];
    const items = [];
    if (ex.sets)              items.push(`<span class="prescription-item"><span class="prescription-key">Sets</span> <span class="prescription-val">${ex.sets}</span></span>`);
    if (ex.reps)              items.push(`<span class="prescription-item"><span class="prescription-key">Reps</span> <span class="prescription-val">${ex.reps}</span></span>`);
    if (ex.weight)            items.push(`<span class="prescription-item"><span class="prescription-key">Load</span> <span class="prescription-val">${ex.weight}</span></span>`);
    if (ex.rest && ex.rest !== '—') items.push(`<span class="prescription-item"><span class="prescription-key">Rest</span> <span class="prescription-val">${ex.rest}</span></span>`);
    return `
      <div class="exercise ${checked ? 'checked' : ''}" id="ex-${id}">
        <div class="exercise-check ${checked ? 'checked' : ''}" id="chk-${id}" onclick="toggleExercise('${id}')"></div>
        <div class="exercise-info">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-prescription">${items.join('')}</div>
          ${ex.notes ? `<div class="exercise-note">${ex.notes}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const overrideBanner = override ? `<div class="session-override-banner">↻ Original plan was ${plannedTitle} — adjusted for your check-in</div>` : '';

  // Fueling as an array so protoBlock can count items
  const fuelingItems = session.fueling ? [session.fueling] : [];

  return `
    <div class="session-card">
      <div class="session-tag">Today's Session · ${session.duration}</div>
      ${overrideBanner}
      <span class="session-pill ${pillClass}">${pillLabel}</span>
      <div class="session-title">${session.title}</div>
      <div class="session-detail">${session.summary}</div>

      ${protoBlock('warmup-today', 'Warm-up', session.warmup, '🔥')}

      <div class="session-section">
        <div class="session-section-title">Main Work · ${session.exercises.length} ${session.exercises.length === 1 ? 'movement' : 'movements'}</div>
        ${exerciseRows}
      </div>

      ${protoBlock('cooldown-today', 'Cool-down & Mobility', session.cooldown, '🧊')}
      ${protoBlock('fueling-today', 'Fueling Protocol', fuelingItems, '⚡')}
    </div>`;
}

// Generic line chart
function renderChart(history, key, title, color, days=14, height=80) {
  const data = history.slice(-days).map(d => ({ date: d.id, value: getField(d, key) })).filter(d => d.value != null);
  if (data.length < 2) return '';
  const w = 380, h = height, pad = 12;
  const values = data.map(d => d.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = (w - pad*2) / (data.length - 1);
  const points = data.map((d, i) => [pad + i * stepX, pad + (h - pad*2) * (1 - (d.value - min) / range)]);
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = `${path} L ${points[points.length-1][0].toFixed(1)},${h-pad} L ${pad},${h-pad} Z`;
  const change = ((data[data.length-1].value - data[0].value) / data[0].value * 100).toFixed(0);

  return `
    <div class="chart-card">
      <div class="card-header"><div class="card-title">${title}</div><div class="card-meta">${days}d · ${change > 0 ? '+' : ''}${change}%</div></div>
      <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <path d="${area}" fill="${color}" opacity="0.15"/>
        <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${points.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="${color}"/>`).join('')}
      </svg>
    </div>
  `;
}

// Multi-line CTL/ATL/TSB chart for desktop
function renderLoadFullChart(history, days=60) {
  const data = history.slice(-days)
    .map(d => ({ date: d.id, ctl: getField(d, 'ctl'), atl: getField(d, 'atl') }))
    .filter(d => typeof d.ctl === 'number' && typeof d.atl === 'number' && isFinite(d.ctl) && isFinite(d.atl));
  if (data.length < 2) return '<div class="chart-card"><div class="card-label">Training Load</div><div style="color:var(--text-dim);font-size:13px;text-align:center;padding:30px 0;">Not enough load data yet</div></div>';
  const w = 800, h = 220, pad = 30;
  const allVals = data.flatMap(d => [d.ctl, d.atl]);
  const min = Math.min(...allVals);
  const max = Math.max(...allVals);
  const range = max - min || 1;
  const stepX = (w - pad*2) / (data.length - 1);
  const yFor = v => pad + (h - pad*2) * (1 - (v - min) / range);

  const ctlPoints = data.map((d, i) => [pad + i * stepX, yFor(d.ctl)]);
  const atlPoints = data.map((d, i) => [pad + i * stepX, yFor(d.atl)]);
  const ctlPath = ctlPoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const atlPath = atlPoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

  const tsbAreaPoints = data.map((d, i) => [pad + i * stepX, yFor(Math.max(d.ctl, d.atl))]);
  const ctlClose = [...ctlPoints].reverse();
  const tsbArea = atlPoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') +
                  ' ' + ctlClose.map(p => `L ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + ' Z';

  const ctlEnd = data[data.length-1].ctl;
  const atlEnd = data[data.length-1].atl;
  const tsbEnd = ctlEnd - atlEnd;

  return `
    <div class="chart-card">
      <div class="card-header">
        <div>
          <div class="card-title">Training Load — ${days}d</div>
          <div style="display:flex;gap:14px;margin-top:4px;font-size:12px;color:var(--text-muted);">
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);margin-right:5px;"></span>CTL ${Math.round(ctlEnd)}</span>
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px;"></span>ATL ${Math.round(atlEnd)}</span>
            <span style="color:${tsbEnd > 0 ? 'var(--green)' : 'var(--orange)'};">TSB ${tsbEnd > 0 ? '+' : ''}${Math.round(tsbEnd)}</span>
          </div>
        </div>
      </div>
      <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <path d="${tsbArea}" fill="var(--orange)" opacity="0.08"/>
        <path d="${ctlPath}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>
        <path d="${atlPath}" fill="none" stroke="var(--red)" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </div>
  `;
}

// Insights panel
function renderInsights(history, activities) {
  const insights = [];

  // Fitness trend — CTL vs baseline
  const { ctl, atl, acwr } = fitnessSnapshot(history);
  if (ctl != null) {
    const delta = Math.round((ctl - CTL_CONFIG.baseline) * 10) / 10;
    const sign = delta >= 0 ? '+' : '';
    const color = delta >= 5 ? 'var(--green-bg)' : delta <= -10 ? 'var(--red-bg)' : 'var(--surface-2)';
    const icon = delta >= 0
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>';
    insights.push({ icon, bg: color, text: `Fitness (CTL) at <strong>${ctl.toFixed(1)}</strong> — <strong>${sign}${delta} vs ${CTL_CONFIG.baseline} baseline</strong>. Peak: ${CTL_CONFIG.peak}.` });
  }
  if (acwr != null) {
    if (acwr > 1.3) insights.push({ icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>', bg: 'var(--red-bg)', text: `<strong>ACWR ${acwr.toFixed(2)}</strong> — above 1.3 cap. Back off today.` });
    else if (acwr >= 0.8 && acwr <= 1.2) insights.push({ icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>', bg: 'var(--green-bg)', text: `<strong>ACWR ${acwr.toFixed(2)}</strong> — optimal training zone. Build.` });
  }

  // HRV trend — 7d vs previous 7d
  const recentHrv = history.slice(-7).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
  const prevHrv = history.slice(-14, -7).map(d => getField(d, 'hrv', 'hrvWeeklyAverage')).filter(v => v != null);
  if (recentHrv.length && prevHrv.length) {
    const r = recentHrv.reduce((a,b)=>a+b,0)/recentHrv.length;
    const p = prevHrv.reduce((a,b)=>a+b,0)/prevHrv.length;
    const diff = Math.round(r - p);
    if (Math.abs(diff) >= 3) {
      const up = diff > 0;
      insights.push({
        icon: up
          ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>'
          : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
        bg: up ? 'var(--green-bg)' : 'var(--orange-bg)',
        text: `HRV <strong>${up ? 'up' : 'down'} ${Math.abs(diff)}ms</strong> vs last week — recovery ${up ? 'improving' : 'under stress'}.`
      });
    }
  }

  // Load change last 7 days vs previous 7
  const recentLoad = history.slice(-7).map(d => getField(d, 'atl')).filter(v => v != null);
  const prevLoad = history.slice(-14, -7).map(d => getField(d, 'atl')).filter(v => v != null);
  if (recentLoad.length && prevLoad.length) {
    const r = recentLoad.reduce((a,b)=>a+b,0)/recentLoad.length;
    const p = prevLoad.reduce((a,b)=>a+b,0)/prevLoad.length;
    const pct = Math.round(((r - p) / p) * 100);
    if (Math.abs(pct) >= 5) {
      const up = pct > 0;
      insights.push({
        icon: up ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
        bg: up ? 'var(--orange-bg)' : 'var(--green-bg)',
        text: `Weekly load <strong>${up ? 'up' : 'down'} ${Math.abs(pct)}%</strong> vs prior week — ${up ? 'watch your ACWR' : 'maintain consistency'}.`
      });
    }
  }

  // Sleep this week
  const recentSleep = history.slice(-7).map(d => getField(d, 'sleepSecs')).filter(v => v != null);
  if (recentSleep.length >= 4) {
    const avg = recentSleep.reduce((a,b)=>a+b,0)/recentSleep.length / 3600;
    if (avg < 6.5) insights.push({ icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>', bg: 'var(--red-bg)', text: `Sleep averaging <strong>${avg.toFixed(1)}hrs</strong> — recovery suppressed. Gains happen in sleep.` });
    else if (avg >= 7.5) insights.push({ icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>', bg: 'var(--green-bg)', text: `Solid sleep week — <strong>${avg.toFixed(1)}hrs avg</strong>. Recovery and adaptation optimized.` });
  }

  if (!insights.length) insights.push({ icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>', bg: 'var(--surface-2)', text: 'Build more training data for personalized insights' });

  return `
    <div class="card">
      <div class="card-label">Performance Insights</div>
      ${insights.slice(0, 5).map(i => `
        <div class="insight-row">
          <div class="insight-icon" style="background: ${i.bg};">${i.icon}</div>
          <div class="insight-text">${i.text}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// Zone distribution from recent activities
function renderZoneDonut(activities) {
  const zoneSecs = [0, 0, 0, 0, 0];
  activities.sort((a, b) => (b.start_date_local || "").localeCompare(a.start_date_local || "")).slice(0, 30).forEach(a => {
    if (a.icu_zone_times) {
      a.icu_zone_times.forEach((t, i) => { if (i < 5) zoneSecs[i] += t || 0; });
    } else if (a.icu_hr_zone_times) {
      a.icu_hr_zone_times.forEach((t, i) => { if (i < 5) zoneSecs[i] += t || 0; });
    } else if (a.moving_time) {
      // Rough estimate based on activity type when zone data missing
      const mins = a.moving_time / 60;
      const t = (a.type || '').toLowerCase();
      if (t.includes('run')) { zoneSecs[1] += mins * 30; zoneSecs[2] += mins * 20; zoneSecs[3] += mins * 10; }
      else { zoneSecs[1] += mins * 40; zoneSecs[2] += mins * 15; }
    }
  });
  const total = zoneSecs.reduce((a, b) => a + b, 0);
  if (total === 0) return '<div class="card"><div class="card-label">Zone Distribution</div><div style="color:var(--text-dim);font-size:13px;text-align:center;padding:30px 0;">Not enough zone data yet</div></div>';

  const colors = ['#9CA3AF', 'var(--green)', 'var(--primary)', 'var(--orange)', 'var(--red)'];
  const labels = ['Z1 Recovery', 'Z2 Endurance', 'Z3 Tempo', 'Z4 Threshold', 'Z5 VO2'];
  let cumAngle = -90;
  const arcs = zoneSecs.map((secs, i) => {
    const pct = secs / total;
    const angle = pct * 360;
    if (angle < 0.5) { return ''; }
    const start = cumAngle;
    const end = cumAngle + angle;
    cumAngle = end;
    const cx = 70, cy = 70, r = 55, ir = 35;
    const sx1 = cx + r * Math.cos(start * Math.PI / 180);
    const sy1 = cy + r * Math.sin(start * Math.PI / 180);
    const sx2 = cx + r * Math.cos(end * Math.PI / 180);
    const sy2 = cy + r * Math.sin(end * Math.PI / 180);
    const ix1 = cx + ir * Math.cos(end * Math.PI / 180);
    const iy1 = cy + ir * Math.sin(end * Math.PI / 180);
    const ix2 = cx + ir * Math.cos(start * Math.PI / 180);
    const iy2 = cy + ir * Math.sin(start * Math.PI / 180);
    const large = angle > 180 ? 1 : 0;
    return `<path d="M ${sx1.toFixed(2)} ${sy1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${sx2.toFixed(2)} ${sy2.toFixed(2)} L ${ix1.toFixed(2)} ${iy1.toFixed(2)} A ${ir} ${ir} 0 ${large} 0 ${ix2.toFixed(2)} ${iy2.toFixed(2)} Z" fill="${colors[i]}"/>`;
  }).join('');

  const legendRows = zoneSecs.map((s, i) => `
    <div class="zone-legend-row">
      <span class="zone-dot" style="background:${colors[i]};"></span>
      <span class="zone-name">${labels[i].split(' ')[0]}</span>
      <span class="zone-pct">${Math.round((s / total) * 100)}%</span>
    </div>
  `).join('');

  return `
    <div class="card">
      <div class="card-label">Zone Distribution · 30d</div>
      <div class="zone-donut-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">${arcs}</svg>
        <div class="zone-legend">${legendRows}</div>
      </div>
    </div>
  `;
}

// Weekly volume bar chart
function renderWeeklyVolume(activities) {
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const today = new Date();
  const weekStart = new Date(today);
  const dow = today.getDay();
  const offset = dow === 0 ? 6 : dow - 1;
  weekStart.setDate(today.getDate() - offset);
  weekStart.setHours(0,0,0,0);

  const dayMins = [0,0,0,0,0,0,0];
  activities.forEach(a => {
    const d = new Date(a.start_date_local);
    if (d >= weekStart) {
      const idx = (d.getDay() + 6) % 7;
      dayMins[idx] += (a.moving_time || 0) / 60;
    }
  });

  const max = Math.max(...dayMins, 60);
  const w = 380, h = 140, pad = 24, barW = (w - pad*2) / 7 - 8;
  const todayIdx = (dow + 6) % 7;

  const bars = dayMins.map((mins, i) => {
    const x = pad + i * ((w - pad*2) / 7) + 4;
    const barH = (mins / max) * (h - pad*2);
    const y = h - pad - barH;
    const isToday = i === todayIdx;
    const color = isToday ? 'var(--primary)' : 'var(--surface-3)';
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH, 2).toFixed(1)}" fill="${color}" rx="3"/>
      <text x="${(x + barW/2).toFixed(1)}" y="${h - 6}" text-anchor="middle" fill="var(--text-dim)" font-size="10" font-family="Inter" font-weight="600">${days[i]}</text>
      ${mins > 0 ? `<text x="${(x + barW/2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" fill="var(--text-muted)" font-size="9" font-family="Inter" font-weight="600">${Math.round(mins)}</text>` : ''}
    `;
  }).join('');

  const totalHrs = (dayMins.reduce((a,b) => a+b, 0) / 60).toFixed(1);

  return `
    <div class="card">
      <div class="card-header">
        <div class="card-title">This Week's Volume</div>
        <div class="card-meta">${totalHrs} hrs total</div>
      </div>
      <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>
    </div>
  `;
}

// Mini sparkline for activity feed
function renderSparkline(activity) {
  // Use HR as the metric if available, else flat line
  const hr = activity.icu_average_hr ?? activity.average_heartrate;
  if (!hr) return '<svg class="activity-spark" viewBox="0 0 60 24"><line x1="0" y1="12" x2="60" y2="12" stroke="var(--border-strong)" stroke-width="1"/></svg>';
  // Generate a representative sparkline based on activity profile
  const points = [];
  const w = 60, h = 24;
  for (let i = 0; i < 12; i++) {
    const noise = Math.sin(i * 0.8 + activity.id * 0.3) * 0.3 + Math.random() * 0.2;
    const y = 4 + (h - 8) * (0.4 + noise);
    points.push([i * (w/11), Math.max(2, Math.min(h-2, y))]);
  }
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  return `<svg class="activity-spark" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="var(--primary)" stroke-width="1.5"/></svg>`;
}

function renderActivities(activities, limit=7) {
  if (!activities.length) return '<div class="card"><div class="card-label">Recent Activities</div><div style="color:var(--text-dim);font-size:13px;padding:10px 0;">No activities yet</div></div>';
  const recent = [...activities].sort((a, b) => (b.start_date_local || "").localeCompare(a.start_date_local || "")).slice(0, limit);
  const inner = recent.map(a => {
    const icon = sportIcon(a.type);
    const dist = a.distance ? `${fmtMiles(a.distance)} mi` : '';
    const dur = a.moving_time ? `${fmtMins(a.moving_time)} min` : '';
    const hrVal = a.icu_average_hr ?? a.average_heartrate ?? null;
    const hr = hrVal ? `${Math.round(hrVal)} bpm` : '';
    const date = a.start_date_local ? fmtShort(a.start_date_local.split('T')[0]) : '';
    const stats = [dist, dur, hr].filter(Boolean).join(' · ');

  return inner;

//  ACTIVITY INSIGHTS MODAL — local rules engine (no API needed)
// ════════════════════════════════════════════════════════════════════

// Estimate a "recovery cost" 0-100 for an activity based on duration,
// HR intensity, elevation and sport. Used by Coach's Read + insights.
function activityRecoveryCost(a) {
  const mins = (a.moving_time || 0) / 60;
  if (mins <= 0) return 0;
  const hr = a.icu_average_hr ?? a.average_heartrate ?? null;
  const type = (a.type || '').toLowerCase();

  // Duration component — longer = more cost, diminishing past 2hrs
  let cost = Math.min(45, mins * 0.45);

  // Intensity multiplier from HR (Clayton runs hot — 140-150 is endurance, 160+ is hard)
  let intensityMult = 1.0;
  if (hr != null) {
    if (hr >= 165) intensityMult = 1.85;
    else if (hr >= 155) intensityMult = 1.5;
    else if (hr >= 148) intensityMult = 1.2;
    else if (hr >= 135) intensityMult = 1.0;
    else intensityMult = 0.65;
  }
  cost *= intensityMult;

  // Elevation adds eccentric load (descents) — relevant to lower-body resilience
  const elevFt = (a.total_elevation_gain || 0) * 3.281;
  cost += Math.min(20, elevFt / 80);

  // Sport weighting — running is highest impact, paddle/swim lowest
  if (type.includes('run')) cost *= 1.15;
  else if (type.includes('ride') || type.includes('mtb') || type.includes('bike')) cost *= 1.0;
  else if (type.includes('paddle') || type.includes('surf') || type.includes('swim')) cost *= 0.7;
  else if (type.includes('weight') || type.includes('strength')) cost *= 1.1;

  return Math.round(Math.max(0, Math.min(100, cost)));
}

function costLabel(cost) {
  if (cost >= 60) return { word: 'High', cls: 'hi-bad' };
  if (cost >= 35) return { word: 'Moderate', cls: 'hi-warn' };
  if (cost >= 15) return { word: 'Low-moderate', cls: 'hi-warn' };
  return { word: 'Low', cls: 'hi-good' };
}

function openActivityInsights(activityId) {
  const a = state.activities.find(x => String(x.id) === String(activityId));
  if (!a) return;

  const type = a.type || 'Activity';
  const t = type.toLowerCase();
  const isRun = t.includes('run');
  const isBike = t.includes('ride') || t.includes('mtb') || t.includes('cycl') || t.includes('bike');
  const isPaddle = t.includes('paddle') || t.includes('surf') || t.includes('row');
  const isSwim = t.includes('swim');
  const isStrength = t.includes('weight') || t.includes('strength');

  const mins = a.moving_time ? a.moving_time / 60 : 0;
  const miles = a.distance ? a.distance / 1609.34 : 0;
  const hrVal = a.icu_average_hr ?? a.average_heartrate ?? null;
  const maxHr = a.max_heartrate || null;
  const elevFt = a.total_elevation_gain ? a.total_elevation_gain * 3.281 : 0;
  const paceMin = (mins && miles) ? mins / miles : null;
  const mphSpeed = a.average_speed ? a.average_speed * 2.237 : null;
  const power = a.average_watts || null;
  // Garmin run cadence is often one-foot; double it for spm
  const cadenceSpm = a.average_cadence ? Math.round(a.average_cadence * (isRun ? 2 : 1)) : null;
  const calories = a.calories ?? a.kilojoules ?? null;
  const hrZones = a.icu_zone_times || a.icu_hr_zone_times || null;
  const date = a.start_date_local ? fmtDate(a.start_date_local.split('T')[0]) : '';
  const dist = miles ? `${miles.toFixed(1)} mi` : null;
  const dur = mins ? `${Math.round(mins)} min` : null;

  // ── STAT TILES ──────────────────────────────────────────────
  let stats = [];
  if (miles) stats.push({ val: miles.toFixed(1), unit: 'mi', label: 'Distance' });
  if (mins) stats.push({ val: Math.round(mins), unit: 'min', label: 'Duration' });
  if (isRun && paceMin) stats.push({ val: paceMin.toFixed(1), unit: 'min/mi', label: 'Avg Pace' });
  else if (isBike && mphSpeed) stats.push({ val: mphSpeed.toFixed(1), unit: 'mph', label: 'Avg Speed' });
  else if (hrVal) stats.push({ val: Math.round(hrVal), unit: 'bpm', label: 'Avg HR' });
  if (stats.length < 3 && hrVal) stats.push({ val: Math.round(hrVal), unit: 'bpm', label: 'Avg HR' });
  if (stats.length < 3 && elevFt > 50) stats.push({ val: Math.round(elevFt), unit: 'ft', label: 'Elevation' });
  if (stats.length < 3 && power) stats.push({ val: Math.round(power), unit: 'W', label: 'Avg Power' });
  if (stats.length < 3 && calories) stats.push({ val: Math.round(calories), unit: 'kcal', label: 'Calories' });
  stats = stats.slice(0, 3);
  const statTiles = stats.map(s => `
    <div class="ai-modal-stat">
      <div class="ai-modal-stat-val">${s.val}<span class="ai-modal-stat-unit">${s.unit}</span></div>
      <div class="ai-modal-stat-label">${s.label}</div>
    </div>`).join('');

  // ── RULES ENGINE ────────────────────────────────────────────
  const cost = activityRecoveryCost(a);
  const cl = costLabel(cost);

  // 1. PERFORMANCE READ — one-line summary
  let perfRead;
  if (hrVal != null) {
    if (isRun && hrVal > 152) {
      perfRead = `You ran <strong>${miles.toFixed(1)}mi</strong> at <span class="hi-warn">${Math.round(hrVal)}bpm avg</span> — above your 140-150 endurance cap. This was a tempo effort, not a base-builder.`;
    } else if (isRun && hrVal >= 140 && hrVal <= 152) {
      perfRead = `Disciplined run — <strong>${miles.toFixed(1)}mi</strong> at <span class="hi-good">${Math.round(hrVal)}bpm avg</span>, right in your aerobic window. This is exactly the work that builds the Mash engine.`;
    } else if (isRun) {
      perfRead = `Easy run — <strong>${miles.toFixed(1)}mi</strong> at <span class="hi-good">${Math.round(hrVal)}bpm avg</span>. Pure recovery pace, minimal stress.`;
    } else if (isPaddle || isSwim) {
      perfRead = `<strong>${Math.round(mins)}min</strong> paddle/water session at ${Math.round(hrVal)}bpm avg. Paddle isn't your weakness — this is low-cost aerobic volume that spares the legs.`;
    } else if (isBike) {
      perfRead = `<strong>${miles ? miles.toFixed(1)+'mi' : Math.round(mins)+'min'}</strong> ride at ${Math.round(hrVal)}bpm avg${elevFt > 300 ? ` with ${Math.round(elevFt)}ft climbing` : ''}. ${hrVal > 150 ? 'Solid intensity.' : 'Steady aerobic work.'}`;
    } else {
      perfRead = `<strong>${Math.round(mins)}min</strong> ${type} session at ${Math.round(hrVal)}bpm avg.`;
    }
  } else {
    perfRead = `<strong>${Math.round(mins)}min</strong> ${type} session${dist ? ` covering ${dist}` : ''}.`;
  }

  // 2. KEY SIGNALS — bullets
  const signals = [];

  // HR zone discipline
  if (hrVal != null && isRun) {
    if (hrVal > 152) {
      signals.push(`<span class="hi-warn">HR ran hot</span> — ${Math.round(hrVal)}bpm avg vs your 140-150 endurance target. You naturally drift to 90%+; this is the discipline gap to close before October.`);
    } else if (hrVal >= 140 && hrVal <= 152) {
      signals.push(`<span class="hi-good">HR control on point</span> — held ${Math.round(hrVal)}bpm, dead center of your aerobic band. Repeatable efforts like this raise your Hill Score.`);
    }
  }
  if (maxHr && hrVal && (maxHr - hrVal) > 35) {
    signals.push(`Big HR spread (avg ${Math.round(hrVal)} → max ${Math.round(maxHr)}bpm) — climbs or surges drove it. Watch that those spikes don't become the whole session.`);
  }

  // Cadence — Clayton's known collapse point
  if (cadenceSpm != null && isRun) {
    if (cadenceSpm >= 170) {
      signals.push(`<span class="hi-good">Cadence ${cadenceSpm}spm</span> — at or above your 170 target. Keep this turnover honest on climbs, where you tend to collapse to ~152.`);
    } else if (cadenceSpm >= 158) {
      signals.push(`<span class="hi-warn">Cadence ${cadenceSpm}spm</span> — below your 170 goal. Run a metronome; short quick steps protect your lower body and fight the climb collapse.`);
    } else {
      signals.push(`<span class="hi-bad">Cadence ${cadenceSpm}spm</span> — well under target. This is overstriding territory — high impact per step, exactly the lower-body load you're trying to build resilience against.`);
    }
  }

  // Elevation / climbing load
  if (elevFt > 800) {
    signals.push(`<strong>${Math.round(elevFt)}ft of climbing</strong> — meaningful eccentric load on the descents. Good for lower-body resilience, but it adds to recovery cost.`);
  } else if (elevFt > 300 && isRun) {
    signals.push(`${Math.round(elevFt)}ft elevation — moderate climbing stimulus. Useful for the trail-run leg of the Mash.`);
  }

  // Pace / power context
  if (isRun && paceMin) {
    signals.push(`Avg pace <strong>${paceMin.toFixed(1)} min/mi</strong>${hrVal && hrVal <= 150 ? ' — note this as your current aerobic pace; watch it get faster at the same HR as fitness builds.' : '.'}`);
  }
  if (isBike && power) {
    signals.push(`Avg power <strong>${Math.round(power)}W</strong> over ${Math.round(mins)}min — log this; sustained climbing power is what stops the bike-leg cramps.`);
  }

  // HR zone distribution
  if (hrZones && hrZones.length >= 5) {
    const total = hrZones.reduce((x, y) => x + (y || 0), 0);
    if (total > 0) {
      const z45 = ((hrZones[3] || 0) + (hrZones[4] || 0)) / total;
      const z12 = ((hrZones[0] || 0) + (hrZones[1] || 0)) / total;
      if (z45 > 0.35) {
        signals.push(`<span class="hi-warn">${Math.round(z45 * 100)}% in Z4-Z5</span> — this was a hard day. Make sure tomorrow is genuinely easy.`);
      } else if (z12 > 0.7) {
        signals.push(`<span class="hi-good">${Math.round(z12 * 100)}% in Z1-Z2</span> — clean aerobic session, low systemic stress.`);
      }
    }
  }

  if (!signals.length) {
    signals.push(`Solid ${Math.round(mins)}min of ${isPaddle ? 'water time' : 'aerobic work'}. Nothing in the data to flag — log it and move on.`);
  }

  // 3. WHAT TO TAKE FORWARD
  let forward;
  if (isRun && hrVal != null && hrVal > 152) {
    forward = `Next trail run: strap the HR monitor on and <strong>walk the climbs</strong> if that's what it takes to stay under 150. The Mash is won by who didn't blow up — train the discipline now.`;
  } else if (isRun && cadenceSpm != null && cadenceSpm < 170) {
    forward = `Set a metronome to <strong>170spm</strong> for your next run and hold it especially on uphills. Quick feet, shorter stride — that's your single biggest run efficiency lever.`;
  } else if (isRun) {
    forward = `This is the template — repeat it. More controlled aerobic miles at this HR is exactly the aerobic-efficiency work the Mash demands.`;
  } else if (isBike && elevFt > 500) {
    forward = `On your next long MTB, stay seated and spin the climbs at higher cadence rather than grinding — that's the habit that prevents the bike-leg cramps from last year.`;
  } else if (isBike) {
    forward = `Build the duration of these rides toward 2+ hours and practice the race fuel — 500mg sodium pre-load, 60g carbs/hr.`;
  } else if (isPaddle || isSwim) {
    forward = `Paddle is a strength, not a weakness — use sessions like this as low-leg-cost aerobic volume on days your legs need a break from running and lifting.`;
  } else {
    forward = `Log how this felt against the numbers — feel beats data when they disagree.`;
  }

  // 4. RECOVERY COST
  let recovery;
  const sweatNote = mins > 45
    ? ` At ~1520ml/90min sweat rate you lost roughly <strong>${Math.round((mins / 90) * 1520)}ml</strong> — replace it with electrolytes, not just water.`
    : '';
  recovery = `Recovery cost: <span class="${cl.cls}">${cl.word}</span> (${cost}/100). ${
    cost >= 60 ? 'Treat tomorrow as easy or mobility — back-to-back hard days is the boom-bust pattern you\'re trying to break.' :
    cost >= 35 ? 'Moderate hit — fine to train tomorrow, but keep it controlled.' :
    'Low drain — this barely dents recovery. You can stack another quality session.'
  }${sweatNote}`;

  // ── ASSEMBLE ────────────────────────────────────────────────
  const blocks = [
    { icon: '📊', label: 'Performance Read', body: perfRead },
    { icon: '⚡', label: 'Key Signals', body: signals.map(s => `<div style="margin-bottom:7px;">• ${s}</div>`).join('') },
    { icon: '🎯', label: 'What to Take Forward', body: forward },
    { icon: '💧', label: 'Recovery Cost', body: recovery }
  ];
  const blocksHtml = blocks.map(b => `
    <div class="ai-insight-block">
      <div class="ai-insight-block-label"><span>${b.icon}</span>${b.label}</div>
      <div class="ai-insight-block-text">${b.body}</div>
    </div>`).join('');

  // ── RENDER MODAL ────────────────────────────────────────────
  const overlay = document.createElement('div');
  overlay.className = 'ai-modal-overlay';
  overlay.id = 'activity-insights-overlay';
  overlay.innerHTML = `
    <div class="ai-modal" id="activity-insights-modal">
      <div class="ai-modal-header">
        <div class="ai-modal-handle"></div>
        <div class="ai-modal-icon">${sportIcon(type)}</div>
        <div style="flex:1;min-width:0;">
          <div class="ai-modal-title">${a.name || type}</div>
          <div class="ai-modal-meta">
            <span>${date}</span>
            ${dist ? `<span>· ${dist}</span>` : ''}
            ${dur ? `<span>· ${dur}</span>` : ''}
          </div>
        </div>
        <div class="ai-modal-close" onclick="closeActivityInsights()">✕</div>
      </div>
      ${stats.length ? `<div class="ai-modal-stats">${statTiles}</div>` : ''}
      <div class="ai-modal-body">${blocksHtml}</div>
    </div>`;

  overlay.addEventListener('click', e => { if (e.target === overlay) closeActivityInsights(); });
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function closeActivityInsights() {
  const overlay = document.getElementById('activity-insights-overlay');
  if (overlay) overlay.remove();
  document.body.style.overflow = '';
}

function buildClaudePrompt(latest, history, activities) {
  const today = new Date();
  const day = dayName(today);
  const dateStr = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const baseReadiness = computeReadiness(latest, history);
  const adjustedReadiness = applyFeelToReadiness(baseReadiness, state.feel);
  const feelLine = state.feel ? `Self-reported state: ${FEEL_OPTIONS.find(o => o.id === state.feel).label} (${FEEL_OPTIONS.find(o => o.id === state.feel).desc})` : 'Self-reported state: not provided';
  const fit = fitnessSnapshot(history);

  const data = [
    `Computed Readiness: ${adjustedReadiness ?? 'unable to compute'}/100${state.feel ? ' (adjusted for self-report)' : ''}`,
    feelLine,
    `HRV: ${getField(latest, 'hrv', 'hrvWeeklyAverage') ?? 'not synced'} ms`,
    `Resting HR: ${getField(latest, 'restingHR') ?? 'not synced'} bpm`,
    `Sleep: ${fmtHrs(getField(latest, 'sleepSecs')) ?? 'not synced'} hrs`,
    `Sleep Score: ${getField(latest, 'sleepScore') ?? 'not synced'}`,
    `CTL (fitness): ${fit.ctl != null ? Math.round(fit.ctl) : 'not synced'}`,

${COACHING_BRIEF}

Today is ${day}, ${dateStr}.

LIVE INTERVALS.ICU DATA + SELF-REPORT:
${data}

RECENT ACTIVITIES (last 7 days):
${recent}

Important: factor his self-reported state heavily into your recommendation. If he says "sore" or "beat", recommend recovery work, NOT pushing through.

Format exactly like this:

READINESS ASSESSMENT
One straight-talking sentence on his recovery state.

TODAY'S SESSION
Specific session with sets/reps/duration/intensity.

KEY FOCUS
One specific actionable cue for today.

FUELING NOTE
One sentence on nutrition/hydration given his heavy sweat rate.

Tight and direct. No fluff.`;

// ════════════════════════════════════════════════════════════════════
//  GARMIN (official Personal API → GitHub Action → encrypted file)
// ════════════════════════════════════════════════════════════════════
// The Action writes garmin.enc.json to the `garmin-data` branch. It is
// encrypted (PBKDF2-SHA256 + AES-256-GCM); the passphrase lives only on
// this device. Nothing readable about Clayton is public.
const GARMIN_URLS = [
  'https://raw.githubusercontent.com/claytonsawyer/Coach/garmin-data/garmin.enc.json',
];
state.garmin = null;          // decrypted payload
state.garminStatus = 'idle';  // idle | loading | locked | badpass | missing | ready
state.garminBlob = null;

const b64bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptGarmin(blob, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64bytes(blob.salt), iterations: blob.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64bytes(blob.iv) }, key, b64bytes(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const GH_REPO = 'claytonsawyer/Coach';
const GH_WORKFLOW = 'garmin.yml';
const ghToken = () => localStorage.getItem('gh_token') || '';
const ghHeaders = (extra = {}) => ({ Authorization: 'Bearer ' + ghToken(), 'X-GitHub-Api-Version': '2022-11-28', ...extra });

async function fetchGarminBlob() {
  if (ghToken()) {  // API read is never CDN-cached, so a refresh shows up immediately
    try {
      const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/garmin.enc.json?ref=garmin-data&t=${Date.now()}`,
        { headers: ghHeaders({ Accept: 'application/vnd.github.raw+json' }), cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch (e) { /* fall back */ }
  }
  for (const url of GARMIN_URLS) {
    try {
      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch (e) { /* try next */ }
  }
  return null;
}

async function loadGarmin() {
  if (!state.garmin) state.garminStatus = 'loading';
  const blob = await fetchGarminBlob();
  if (!blob) { if (!state.garmin) { state.garminStatus = 'missing'; render(); } return; }
  state.garminBlob = blob;
  const pass = localStorage.getItem('garmin_pass');
  if (!pass) { state.garminStatus = 'locked'; render(); return; }
  await unlockGarmin(pass, false);
}

  state.garminRefresh = m;

async function refreshGarmin() {
  if (garminRefreshing) return;
  if (!ghToken()) { state.ghSetup = true; render(); return; }
  garminRefreshing = true;
  const started = Date.now();
  const before = state.garmin?.generated;
  setRefreshMsg('Starting pull…'); render();
  try {
    const d = await fetch(`https://api.github.com/repos/${GH_REPO}/actions/workflows/${GH_WORKFLOW}/dispatches`, {
      method: 'POST', headers: ghHeaders({ Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }),
      body: JSON.stringify({ ref: 'main' })
    });
    if (d.status === 401) throw new Error('GitHub token is invalid or expired — set it up again.');
    if (d.status === 403 || d.status === 404) throw new Error('Token can\'t run the action — it needs Actions: Read and write on the Coach repo.');
    if (!d.ok) throw new Error('GitHub said ' + d.status);

    let run = null;
    while (Date.now() - started < 6 * 60000) {
      await new Promise(r => setTimeout(r, 6000));
      const secs = Math.round((Date.now() - started) / 1000);
      const r = await fetch(`https://api.github.com/repos/${GH_REPO}/actions/workflows/${GH_WORKFLOW}/runs?event=workflow_dispatch&per_page=3&t=${Date.now()}`,
        { headers: ghHeaders({ Accept: 'application/vnd.github+json' }), cache: 'no-store' });
      if (r.ok) {
        const runs = (await r.json()).workflow_runs || [];
        run = runs.find(x => new Date(x.created_at).getTime() >= started - 15000) || run;
      }
      if (run && run.status === 'completed') break;
      setRefreshMsg(`Pulling from Garmin… ${secs}s`);
    }
    if (!run || run.status !== 'completed') throw new Error('Still running — check back in a minute.');
    if (run.conclusion !== 'success') throw new Error('The pull failed — open the Actions tab on GitHub for the log.');

    setRefreshMsg('Loading new data…');
    for (let i = 0; i < 5; i++) {
      await loadGarmin();
      if (state.garmin?.generated && state.garmin.generated !== before) break;
      await new Promise(r => setTimeout(r, 4000));
    }
    state.garminRefresh = '';
  } catch (e) {
    state.garminRefresh = e.message;
  }
  garminRefreshing = false;
  render();
}

async function unlockGarmin(pass, fromInput = true) {
  if (fromInput) pass = (document.getElementById('garmin-pass')?.value || '').trim();
  if (!pass || !state.garminBlob) return;
  try {
    state.garmin = await decryptGarmin(state.garminBlob, pass);
    localStorage.setItem('garmin_pass', pass);
    state.garminStatus = 'ready';
    window.debugGarmin = () => console.log('Garmin payload:', state.garmin);
  } catch (e) {
    localStorage.removeItem('garmin_pass');
    state.garmin = null;
    state.garminStatus = fromInput ? 'badpass' : 'locked';
  }
  render();
}

function lockGarmin() {
  localStorage.removeItem('garmin_pass');
  state.garmin = null; state.garminStatus = 'locked'; render();
}

// ── Garmin maths ─────────────────────────────────────────────────────
const isoLocal = d => d.toLocaleDateString('en-CA');           // YYYY-MM-DD
const daysAgoIso = n => isoLocal(new Date(Date.now() - n * 86400000));

function garminDailyLoad(g) {
  const m = {};
  (g.acts || []).forEach(a => {
    const d = String(a.t || '').slice(0, 10);
    if (d && a.load != null) m[d] = (m[d] || 0) + a.load;
  });
  return m;
}

function garminAcwr(g) {
  const load = garminDailyLoad(g);
  const first = Object.keys(load).sort()[0];
  if (!first || first > daysAgoIso(27)) return null;
  let acute = 0, chronic = 0;
  for (let i = 0; i < 28; i++) {
    const v = load[daysAgoIso(i)] || 0;
    chronic += v; if (i < 7) acute += v;
  }
  const weeklyChronic = chronic / 4;
  if (!weeklyChronic) return null;
  return { acute: Math.round(acute), chronic: Math.round(weeklyChronic), ratio: acute / weeklyChronic };
}

function garminWeeklyLoad(g, weeks = 8) {
  const load = garminDailyLoad(g);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const out = [];
  for (let w = weeks - 1; w >= 0; w--) {
    const start = new Date(monday); start.setDate(monday.getDate() - 7 * w);
    let sum = 0;
    for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(start.getDate() + i); sum += load[isoLocal(d)] || 0; }
    out.push({ label: start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), value: Math.round(sum), current: w === 0 });
  }
  return out;
}

function garminZones7d(g) {
  const cutoff = daysAgoIso(6);
  const z = [0, 0, 0, 0, 0];
  (g.acts || []).forEach(a => {
    if (String(a.t || '').slice(0, 10) >= cutoff) (a.z || []).forEach((s, i) => z[i] += s || 0);
  });
  return z;
}

function lastWith(days, key) {
  for (let i = days.length - 1; i >= 0; i--) if (days[i][key] != null) return days[i];
  return null;
}
function avgLast(days, key, n = 7) {
  const vals = days.filter(d => d.d >= daysAgoIso(n - 1) && d[key] != null).map(d => d[key]);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}
const fmtHm = s => s == null ? '—' : `${Math.floor(s / 3600)}:${String(Math.round((s % 3600) / 60)).padStart(2, '0')}`;

// HRV read built for newborn-era noise: judge the 7-day average against
// Garmin's own baseline band; a single very low night still overrides.
function garminReadiness(g) {
  const days = g.days || [];
  const last = lastWith(days, 'hrv');
  const avg7raw = avgLast(days, 'hrv', 7);
  const avg7 = avg7raw == null ? null : Math.round(avg7raw);
  const band = lastWith(days, 'hrvLow');
  const sleepLast = lastWith(days, 'sleepS');
  const sleep7 = avgLast(days, 'sleepS', 7);
  let level = 'go', text = 'Train as planned.';
  if (last && last.hrv != null && last.hrv < 40) { level = 'rest'; text = 'Last night HRV under 40 — rest day.'; }
  else if (avg7 && band && band.hrvLow) {
    if (avg7 < band.hrvLow * 0.9) { level = 'z2'; text = '7-day HRV well below your baseline — Zone 2 only.'; }
    else if (avg7 < band.hrvLow) { level = 'reduce'; text = '7-day HRV below baseline — cut volume 10–15%.'; }
  }
  if (level === 'go' && sleepLast && sleepLast.sleepS < 6 * 3600) { level = 'reduce'; text = 'Under 6 h sleep — drop intensity 15–20%.'; }
  return { level, text, last, avg7, band, sleepLast, sleep7 };
}

// ── Back / sciatica log ──────────────────────────────────────────────
// Saved to Intervals.icu wellness "comments" as one "Back:" line (other
// comment text is kept), so it follows you across phone and desktop.
const BACK_REACH = ['Back', 'Buttock', 'Thigh', 'Knee', 'Neck'];

function parseBackLine(text) {
  const line = String(text || '').split('\n').find(l => l.startsWith('Back: pain '));
  if (!line) return null;
  const parts = line.split(' · ').map(x => x.trim());
  const pain = parseInt(parts[0].replace('Back: pain ', ''), 10);
  if (isNaN(pain)) return null;
  const reachPart = parts.find(x => x.startsWith('reach ')) || '';
  return {
    pain,
    reach: reachPart.slice(6).split(',').map(x => x.trim()).filter(x => x && x !== 'none').map(x => x[0].toUpperCase() + x.slice(1)),
    sts: parts.includes('sit-to-stand hurt'), routine: parts.includes('routine done')
  };
}
function backLine(e) {
  return `Back: pain ${e.pain}/10 · reach ${e.reach.length ? e.reach.map(s => s.toLowerCase()).join(', ') : 'none'} · ${e.sts ? 'sit-to-stand hurt' : 'sit-to-stand ok'} · ${e.routine ? 'routine done' : 'no routine'}`;
}
function backEntryFor(date) {
  const local = localStorage.getItem('back_' + date);
  if (local) { try { return JSON.parse(local); } catch (e) {} }
  const w = (state.wellness || []).find(x => x.id === date);
  return w ? parseBackLine(w.comments) : null;
}

const todayIso = isoLocal(new Date());

state.backSaved = !!localStorage.getItem('back_' + todayIso);
state.backMsg = '';

function backSet(field, value) {
  const d = state.backDraft;
  if (field === 'reach') d.reach = d.reach.includes(value) ? d.reach.filter(r => r !== value) : [...d.reach, value];
  else if (field === 'pain') d.pain = value;
  else d[field] = !d[field];
  state.backSaved = false; state.backMsg = '';
  render();
}

async function saveBack() {
  const d = state.backDraft;
  if (d.pain == null) { state.backMsg = 'Pick a pain level first.'; render(); return; }
  localStorage.setItem('back_' + todayIso, JSON.stringify(d));
  state.backSaved = true;
  state.backMsg = 'Saved on this device…';
  render();
  if (!state.athleteId || !state.apiKey) return;
  try {
    const rec = (state.wellness || []).find(x => x.id === todayIso);
    const others = String(rec?.comments || '').split('\n').filter(l => l.trim() && !l.startsWith('Back:'));
    const comments = [...others, backLine(d)].join('\n');
    const res = await fetch(`https://intervals.icu/api/v1/athlete/${state.athleteId}/wellness/${todayIso}`, {
      method: 'PUT',
      headers: { Authorization: 'Basic ' + btoa('API_KEY:' + state.apiKey), 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: todayIso, comments })
    });
    if (!res.ok) throw new Error(res.status);
    if (rec) rec.comments = comments; else state.wellness.push({ id: todayIso, comments });
    state.backMsg = 'Saved to Intervals.icu.';
  } catch (e) {
    state.backMsg = 'Saved on this device (Intervals sync failed).';
  }
  render();
}

function backHistory(n = 14) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) { const d = daysAgoIso(i); out.push({ d, e: backEntryFor(d) }); }
  return out;
}

function backGuidance(e, hist) {
  if (!e || e.pain == null) return '';
  const logged = hist.filter(h => h.e && h.e.pain != null);
  const recent = logged.slice(-3).map(h => h.e.pain), earlier = logged.slice(-7, -3).map(h => h.e.pain);
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  let trend = '';
  if (recent.length >= 2 && earlier.length >= 2) {
    const diff = mean(recent) - mean(earlier);
    trend = diff <= -1 ? ' Trending better.' : diff >= 1 ? ' Trending worse — if this holds a week, book a PT or sports med visit.' : '';
  }
  if (e.reach.includes('Knee') || e.pain >= 6)
    return `Back off today: no loaded hinges or squats. Routine + easy Zone 2 only.${trend}`;
  if (e.pain >= 3)
    return `Train around it: single-leg and spine-friendly options, no kick-ups. Stop any movement that sends pain further down the leg.${trend}`;
  return `Green light — train as planned with the spine-friendly lower day.${trend}`;
}

const SPORTS = {

function sportOf(typeKey) {

  if (t.includes('cycl') || t.includes('bik') || t.includes('ride')) return t.includes('motor') ? 'moto' : 'bike';

  if (/(motor|moto|atv)/.test(t)) return 'moto';

}
const actDate = a => String(a.t || '').slice(0, 10);

function mondayOf(iso) {
  const d = new Date(iso + 'T12:00:00');

}
function lastNWeeks(n) {
